<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#2563eb">
<title>Ujjwal Academy · My Exam Results</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
(function () {
    try {
        var t = localStorage.getItem('user-theme-preference') || 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════
   THEME VARIABLES
   ══════════════════════════════════════════════════════════════ */
:root {
    --bg-body: #f4f7fc;
    --bg-card: #ffffff;
    --bg-header: #ffffff;
    --text-main: #1e293b;
    --text-muted: #5b6e8c;
    --text-light: #94a3b8;
    --border-light: #e2e8f0;
    --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.06);
    --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.12);
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-soft: rgba(37, 99, 235, 0.08);
    --accent-glow: rgba(37, 99, 235, 0.35);
    --card-border: 1px solid rgba(0,0,0,0.04);
    --input-bg: #f8fafc;
    --input-border: #e2e8f0;
    --success: #10b981;
    --success-soft: rgba(16, 185, 129, 0.10);
    --danger: #ef4444;
    --warning: #f59e0b;
    --grad-hero: linear-gradient(135deg, #2563eb, #7c3aed);
    --transition-fast: 150ms ease;
    --transition-normal: 300ms ease;
    --table-header-bg: #f8fafc;
    --table-row-hover: #f1f5f9;
    --table-border: #e2e8f0;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
[data-theme="dark"] {
    --bg-body: #0a0f1c;
    --bg-card: #1e293b;
    --bg-header: #111827;
    --text-main: #f1f5f9;
    --text-muted: #9ca3af;
    --text-light: #64748b;
    --border-light: #1f2a3e;
    --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.6);
    --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.8);
    --accent: #3b82f6;
    --accent-2: #a78bfa;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --accent-glow: rgba(59, 130, 246, 0.45);
    --card-border: 1px solid rgba(255,255,255,0.04);
    --input-bg: #1e293b;
    --input-border: #334155;
    --table-header-bg: #1e293b;
    --table-row-hover: #334155;
    --table-border: #334155;
}

/* ══════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    transition: background var(--transition-normal), color var(--transition-normal);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ══════════════════════════════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════════════════════════════ */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes printPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
}

.spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    will-change: transform;
}
.spinner.sm { width: 14px; height: 14px; border-width: 2px; }
.spinner.white { border-color: rgba(255,255,255,0.35); border-top-color: #fff; }

/* ══════════════════════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════════════════════ */
.app-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(0.75rem, 2vw, 1.4rem);
    padding-top: calc(clamp(0.75rem, 2vw, 1.4rem) + var(--safe-top));
    padding-bottom: calc(clamp(1rem, 2vw, 1.5rem) + var(--safe-bottom));
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(0.85rem, 2vw, 1.3rem);
    align-content: start;
    min-height: 100dvh;
}

.page { display: none; animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.page.active-page { display: block; }

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--bg-header);
    border-radius: 999px;
    padding: 0.5rem clamp(0.85rem, 2vw, 1.4rem);
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: calc(var(--safe-top) + 6px);
    z-index: 50;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    margin-bottom: 0.4rem;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand img { height: clamp(30px, 3.5vw, 40px); width: auto; object-fit: contain; flex-shrink: 0; }
[data-theme="dark"] .brand img { filter: brightness(0) invert(1); }
.brand-name {
    font-size: clamp(0.9rem, 1.5vw, 1.15rem);
    font-weight: 800;
    letter-spacing: -0.015em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.my-account-pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--accent-soft);
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    cursor: pointer;
    transition: all 260ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
    color: var(--text-main);
    flex-shrink: 0;
    max-width: 100%;
    font-weight: 700;
}
.my-account-pill:hover,
.my-account-pill:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -10px var(--accent-glow);
}
.my-account-pill .pill-thumb {
    width: clamp(26px, 3vw, 32px);
    height: clamp(26px, 3vw, 32px);
    border-radius: 50%;
    object-fit: cover;
    background: var(--input-bg);
    border: 2px solid var(--bg-card);
    flex-shrink: 0;
}
.my-account-pill:hover .pill-thumb { border-color: rgba(255,255,255,0.6); }
.my-account-pill .pill-label {
    font-size: clamp(0.68rem, 1vw, 0.82rem);
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    max-width: clamp(90px, 22vw, 180px);
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    vertical-align: middle;
}

/* ══════════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════════ */
.toast {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    right: 20px;
    background: var(--bg-card);
    border-left: 5px solid var(--accent);
    padding: 0.9rem 1.2rem;
    border-radius: 0 16px 16px 0;
    box-shadow: var(--shadow-hover);
    font-weight: 600;
    font-size: 0.88rem;
    z-index: 3000;
    display: none;
    animation: slideIn 0.3s ease-out;
    color: var(--text-main);
    max-width: 340px;
}
.toast.success { border-left-color: var(--success); }
.toast.error   { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.info    { border-left-color: var(--accent); }

/* ══════════════════════════════════════════════════════════════
   TOOLBAR
   ══════════════════════════════════════════════════════════════ */
.toolbar-section {
    background: var(--bg-card);
    border-radius: 32px;
    padding: 1.2rem 1.5rem;
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1rem;
}
.toolbar-row {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    align-items: center;
}
.search-wrapper {
    flex: 1 1 260px;
    min-width: 220px;
    position: relative;
}
.search-wrapper input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.9rem;
    font-family: inherit;
    transition: all var(--transition-fast);
}
.search-wrapper input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}
.search-wrapper i {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 0.85rem;
    pointer-events: none;
}
.toolbar-select {
    padding: 0.7rem 1rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition-fast);
    min-width: 170px;
}
.toolbar-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}
.desktop-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-left: auto; }
.filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.filter-chip {
    padding: 0.55rem 1.1rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.filter-chip i { font-size: 0.75rem; opacity: 0.75; }
.filter-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.filter-chip.active {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.5);
}
.filter-chip.active i { opacity: 1; }

.filter-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--text-muted);
    padding: 0.4rem 0.8rem;
    border-radius: 30px;
    background: var(--accent-soft);
    border: 1px dashed var(--border-light);
}
.filter-meta strong { color: var(--accent); }
.filter-meta .clear-filter-btn {
    background: transparent;
    border: none;
    color: var(--danger);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.filter-meta .clear-filter-btn:hover { text-decoration: underline; }

.mobile-controls { display: none; gap: 0.6rem; width: 100%; }
.mobile-controls .toolbar-select { flex: 1; min-width: 0; }
.mobile-controls .mobile-filter-btn {
    flex: 0 0 auto;
    padding: 0.7rem 1.2rem;
    border-radius: 60px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
}
.mobile-controls .mobile-filter-btn:hover { background: var(--accent); color: white; }

/* ══════════════════════════════════════════════════════════════
   TABLE
   ══════════════════════════════════════════════════════════════ */
.table-card {
    background: var(--bg-card);
    border-radius: 32px;
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
}
.table-wrapper { overflow-x: auto; padding: 0 1rem 1rem; }
.data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.875rem;
}
.data-table th {
    text-align: left;
    padding: 1rem 1.2rem;
    background: var(--table-header-bg);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 10;
}
.data-table td {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-main);
    transition: background var(--transition-fast);
}
.data-table tr:hover td { background: var(--table-row-hover); }

.view-action-btn {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: white;
    border: none;
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.view-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

/* ══════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════ */
.btn {
    border: none;
    padding: 0.6rem 1.4rem;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-family: inherit;
    position: relative;
}
.btn-primary {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: white;
    box-shadow: var(--shadow-sm);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.btn-outline {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
}
.btn-outline:hover { background: var(--accent); color: white; transform: translateY(-2px); }
.btn-success {
    background: linear-gradient(135deg, var(--success), #059669);
    color: white;
    box-shadow: 0 6px 18px -6px rgba(16, 185, 129, 0.45);
}
.btn-success:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.btn-sm { padding: 0.4rem 1rem; font-size: 0.75rem; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

/* ══════════════════════════════════════════════════════════════
   DETAIL VIEW (exact SchoolExam.html layout)
   ══════════════════════════════════════════════════════════════ */
.detail-view-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}
.detail-hero {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    border-radius: 24px;
    padding: 1.5rem 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: center;
    justify-content: space-between;
}
.detail-hero-left { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.detail-hero-left .name { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
.detail-hero-left .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.8rem;
    opacity: 0.95;
}
.detail-hero-left .meta span {
    background: rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.25);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.detail-hero-right { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.hero-stat {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 0.8rem 1.2rem;
    text-align: center;
    min-width: 100px;
}
.hero-stat .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
    font-weight: 700;
}
.hero-stat .value { font-size: 1.5rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
.hero-stat.highlight { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); }
.hero-stat.pass-bg { background: rgba(16, 185, 129, 0.35); border-color: rgba(16, 185, 129, 0.6); }
.hero-stat.fail-bg { background: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.6); }

.detail-section {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    overflow: hidden;
}
.detail-section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.9rem 1.4rem;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-light);
    background: var(--table-header-bg);
    color: var(--accent);
}
.detail-section-header i {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
}
.detail-section-body {
    padding: 1rem 1.4rem 1.4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.9rem;
}
.info-tile {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 0.8rem 1rem;
    border: 1px solid var(--border-light);
    transition: all var(--transition-fast);
}
.info-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.info-tile .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    font-weight: 700;
}
.info-tile .value {
    font-weight: 700;
    font-size: 1rem;
    margin-top: 4px;
    color: var(--text-main);
    word-break: break-word;
}
.info-tile.marks-tile .value { color: var(--accent); font-size: 1.15rem; }
.info-tile.highlight {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(124, 58, 237, 0.12));
    border-color: rgba(37, 99, 235, 0.35);
}
.info-tile.highlight .value { color: var(--accent); font-size: 1.2rem; }
.info-tile.remark-tile { grid-column: 1 / -1; }

.detail-actions {
    padding: 0 1.5rem 1.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: flex-end;
}

/* ══════════════════════════════════════════════════════════════
   MODALS
   ══════════════════════════════════════════════════════════════ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    visibility: hidden;
    opacity: 0;
    transition: all var(--transition-normal);
}
.modal-overlay.active { display: flex; visibility: visible; opacity: 1; }
.modal-overlay.nested { z-index: 2001; }
.modal-box {
    background: var(--bg-card);
    border-radius: 40px;
    max-width: 600px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    border: var(--card-border);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4);
    animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-box.wide { max-width: 900px; }
.modal-header {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    padding: 1.2rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 40px 40px 0 0;
    color: white;
    position: sticky;
    top: 0;
    z-index: 10;
}
.modal-header h3 {
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.modal-close {
    background: rgba(255,255,255,0.15);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    color: white;
    transition: transform var(--transition-fast), background var(--transition-fast);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
}
.modal-close:hover { transform: rotate(90deg); background: rgba(255,255,255,0.3); }
.modal-body { padding: 1.5rem; overflow-y: auto; max-height: calc(92vh - 80px); }

/* ══════════════════════════════════════════════════════════════
   DATE RANGE MODAL
   ══════════════════════════════════════════════════════════════ */
.date-range-box {
    background: var(--bg-card);
    border-radius: 32px;
    max-width: 520px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.5);
    animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.date-range-hero {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    padding: 1.5rem 2rem;
    color: white;
    position: relative;
}
.date-range-hero h3 {
    font-size: 1.4rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
}
.date-range-hero p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
.date-range-close {
    position: absolute;
    top: 12px; right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
}
.date-range-close:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }
.date-range-body { padding: 1.8rem 2rem 2rem; }
.date-range-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
.date-field { display: flex; flex-direction: column; gap: 6px; }
.date-field label {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
}
.date-field input[type="date"] {
    padding: 0.8rem 1rem;
    border-radius: 16px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.9rem;
    font-family: inherit;
}
.date-field input[type="date"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
}
.date-quick-picks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.quick-pick {
    padding: 0.45rem 1rem;
    border-radius: 30px;
    border: 2px dashed var(--border-light);
    background: transparent;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition-fast);
}
.quick-pick:hover {
    border-color: var(--accent);
    color: var(--accent);
    border-style: solid;
    background: var(--accent-soft);
}
.date-range-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* ══════════════════════════════════════════════════════════════
   MOBILE FILTER SHEET
   ══════════════════════════════════════════════════════════════ */
.mobile-filter-sheet {
    position: fixed;
    left: 0; right: 0;
    bottom: -100%;
    background: var(--bg-card);
    border-radius: 32px 32px 0 0;
    box-shadow: 0 -20px 60px -10px rgba(0,0,0,0.25);
    z-index: 2500;
    transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 1.5rem 1.2rem 2rem;
    max-height: 80vh;
    overflow-y: auto;
    border-top: 1px solid var(--border-light);
}
.mobile-filter-sheet.open { bottom: 0; }
.mobile-filter-sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    z-index: 2499;
    opacity: 0;
    visibility: hidden;
    transition: all var(--transition-normal);
}
.mobile-filter-sheet-backdrop.open { opacity: 1; visibility: visible; }
.mobile-filter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--border-light);
}
.mobile-filter-header h4 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
}
.mobile-filter-header button {
    background: transparent;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 4px;
}
.mobile-filter-sheet .filter-chip {
    width: 100%;
    justify-content: center;
    margin-bottom: 0.5rem;
    padding: 0.7rem 1rem;
}

/* ══════════════════════════════════════════════════════════════
   EMPTY / ERROR / LOADING
   ══════════════════════════════════════════════════════════════ */
.loading-container, .empty-container, .error-container {
    text-align: center;
    padding: 40px 20px;
}
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--border-light);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
}
.empty-icon, .error-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
.error-icon { color: var(--danger); }
.empty-title { font-weight: 600; color: var(--text-muted); font-size: 1.1rem; }
.error-title { font-weight: 600; color: var(--danger); font-size: 1.1rem; }
.empty-subtitle { color: var(--text-light); font-size: 0.85rem; margin-top: 6px; }
.error-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* ══════════════════════════════════════════════════════════════
   SKELETON
   ══════════════════════════════════════════════════════════════ */
.skeleton {
    background: linear-gradient(90deg, var(--input-bg) 0%, var(--border-light) 50%, var(--input-bg) 100%);
    background-size: 500px 100%;
    animation: softPulse 1.4s infinite linear;
    border-radius: 6px;
}
.skeleton-row td { padding: 1rem 1.2rem; }
.skeleton-line { height: 14px; }

/* ══════════════════════════════════════════════════════════════
   REFRESH DOT
   ══════════════════════════════════════════════════════════════ */
.refresh-dot {
    position: fixed;
    top: calc(var(--safe-top) + 14px);
    right: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    transition: opacity 300ms ease;
}
.refresh-dot.show { opacity: 1; animation: softPulse 1.4s ease-in-out infinite; }

/* ══════════════════════════════════════════════════════════════
   ⭐ PRINT PREVIEW MODAL — enhanced buttons + hidden scrollbar
   ══════════════════════════════════════════════════════════════ */

/* Preview body: hidden scrollbar but scrollable */
#printResultBody {
    scrollbar-width: none;              /* Firefox */
    -ms-overflow-style: none;           /* IE / Edge */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;  /* smooth iOS scroll */
    max-height: 70vh;
    padding: 1.5rem;
    background: #f1f5f9;
}
#printResultBody::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;                      /* Chrome / Safari / Edge */
}

/* Hide scrollbar on the modal box too */
#printResultModal .modal-box {
    scrollbar-width: none;
    -ms-overflow-style: none;
}
#printResultModal .modal-box::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
}

/* ⭐ Enhanced footer buttons */
#printResultModal .modal-body:last-child {
    padding: 1.1rem 1.5rem 1.4rem;
    display: flex;
    gap: 0.85rem;
    justify-content: flex-end;
    flex-wrap: wrap;
    background: var(--bg-card);
    border-top: 1px solid var(--border-light);
    border-radius: 0 0 40px 40px;
}
#printResultModal .btn {
    padding: 0.85rem 1.9rem;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    border-radius: 999px;
    min-width: 130px;
    justify-content: center;
    transition: transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.1),
                box-shadow 220ms ease,
                background 220ms ease,
                color 220ms ease,
                border-color 220ms ease;
    position: relative;
    overflow: hidden;
}
#printResultModal .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.35) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 260ms ease;
    pointer-events: none;
}
#printResultModal .btn:hover::after { opacity: 1; }
#printResultModal .btn i {
    font-size: 1rem;
    margin-right: 2px;
}

/* Cancel button */
#printResultModal #closePrintResultFooterBtn {
    background: transparent;
    border: 2px solid var(--border-light);
    color: var(--text-main);
    box-shadow: none;
}
#printResultModal #closePrintResultFooterBtn:hover {
    background: var(--bg-body);
    border-color: var(--text-muted);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.18);
}
#printResultModal #closePrintResultFooterBtn:active { transform: translateY(0); }

/* Print button */
#printResultModal #printResultNowBtn {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: #ffffff;
    border: none;
    box-shadow: 0 10px 24px -8px rgba(37, 99, 235, 0.55);
}
#printResultModal #printResultNowBtn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 16px 32px -10px rgba(37, 99, 235, 0.75);
}
#printResultModal #printResultNowBtn:active { transform: translateY(-1px) scale(0.99); }
#printResultModal #printResultNowBtn i {
    animation: printPulse 2s ease-in-out infinite;
}

/* Dark theme tweaks */
[data-theme="dark"] #printResultBody { background: #0f1830; }
[data-theme="dark"] #printResultModal .modal-body:last-child {
    background: var(--bg-card);
    border-top-color: var(--border-light);
}
[data-theme="dark"] #printResultModal #closePrintResultFooterBtn {
    color: var(--text-main);
    border-color: var(--border-light);
}
[data-theme="dark"] #printResultModal #closePrintResultFooterBtn:hover {
    background: #334155;
    border-color: #64748b;
}

/* Mobile: stack buttons full-width */
@media (max-width: 480px) {
    #printResultModal .modal-body:last-child {
        padding: 1rem;
        border-radius: 0 0 28px 28px;
    }
    #printResultModal .btn {
        flex: 1 1 100%;
        padding: 0.9rem 1.2rem;
        min-width: 0;
    }
}

/* ══════════════════════════════════════════════════════════════
   ⭐ PRINT RESULT SHEET (modal preview)
   ══════════════════════════════════════════════════════════════ */
.pr-result-sheet {
    background: #ffffff;
    color: #0f172a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: 18px 22px 26px;
    border: 3px solid #b91c1c;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 40px -10px rgba(0,0,0,0.25);
    isolation: isolate;
    box-sizing: border-box;
    min-height: 275mm;
    display: flex;
    flex-direction: column;
}
.pr-watermark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
}
.pr-watermark img {
    width: 78%;
    max-width: 580px;
    opacity: 0.07;
    transform: rotate(-18deg);
    filter: grayscale(15%) contrast(90%);
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}
.pr-result-sheet > *:not(.pr-watermark) {
    position: relative;
    z-index: 1;
}
.pr-info-grid, .pr-subject-table, .pr-status-table, .pr-remarks-box, .pr-photo-box {
    background-color: rgba(255, 255, 255, 0.82) !important;
}
.pr-subject-table th { background-color: rgba(185, 28, 28, 0.95) !important; }
.pr-status-table th { background-color: rgba(254, 202, 202, 0.95) !important; }

.pr-header {
    display: grid;
    grid-template-columns: 130px 1fr 130px;
    align-items: center;
    gap: 12px;
    border-bottom: 3px solid #b91c1c;
    padding-bottom: 12px;
    margin-bottom: 14px;
    background: transparent;
    flex: 0 0 auto;
}
.pr-header-left { display: flex; justify-content: flex-start; }
.pr-logo { height: 100px; width: 100px; object-fit: contain; }
.pr-header-center { text-align: center; }
.pr-title {
    font-size: 2.1rem;
    font-weight: 900;
    color: #b91c1c;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.1;
}
.pr-result-badge {
    display: inline-block;
    margin-top: 6px;
    background: #b91c1c;
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 4px 36px;
    border-radius: 999px;
    position: relative;
}
.pr-result-badge::before,
.pr-result-badge::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40px;
    height: 2px;
    background: #b91c1c;
    transform: translateY(-50%);
}
.pr-result-badge::before { right: calc(100% + 8px); }
.pr-result-badge::after  { left:  calc(100% + 8px); }
.pr-header-right { display: flex; justify-content: flex-end; }

.pr-photo-box {
    position: relative;
    width: 110px;
    height: 140px;
    border: 2px solid #1e3a8a;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(30, 58, 138, 0.15);
    flex: 0 0 auto;
}
.pr-photo-box > img,
.pr-photo-box > .pr-photo-placeholder {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
.pr-photo-box > img {
    object-fit: cover;
    object-position: center top;
    display: block;
    background: #ffffff;
}
.pr-photo-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: rgba(241, 245, 249, 0.85);
}
.pr-photo-placeholder i { font-size: 1.8rem; }

.pr-info-grid {
    border: 2px solid #1e3a8a;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 12px;
    box-sizing: border-box;
    flex: 0 0 auto;
}
.pr-info-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.pr-info-row:last-child { margin-bottom: 0; }
.pr-info-cell { display: flex; align-items: center; gap: 6px; flex: 1 1 180px; min-width: 140px; }
.pr-info-cell.full { flex: 1 1 100%; }
.pr-info-cell label {
    font-size: 0.78rem;
    font-weight: 800;
    color: #1e3a8a;
    white-space: nowrap;
}
.pr-info-cell span {
    flex: 1;
    border: 1.5px solid #1e3a8a;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #0f172a;
    background: rgba(255,255,255,0.85);
    min-height: 22px;
    line-height: 1.3;
    word-break: break-word;
    box-sizing: border-box;
}

.pr-subject-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    border: 2px solid #1e3a8a;
    box-sizing: border-box;
    flex: 0 0 auto;
}
.pr-subject-table th {
    color: #ffffff;
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    border: 1.5px solid #1e3a8a;
    text-align: center;
}
.pr-subject-table td {
    padding: 5px 10px;
    font-size: 0.82rem;
    color: #0f172a;
    border: 1.5px solid #1e3a8a;
    height: 26px;
    background: rgba(255,255,255,0.82);
}
.pr-subject-table tbody tr:nth-child(even) td { background: rgba(248,250,252,0.82); }

.pr-section-title {
    display: inline-block;
    background: #b91c1c;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 800;
    padding: 4px 18px;
    border-radius: 999px;
    margin: 4px 0 6px;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
}

.pr-status-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    border: 2px solid #b91c1c;
    box-sizing: border-box;
    flex: 0 0 auto;
}
.pr-status-table th {
    color: #7f1d1d;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 5px 6px;
    border: 1.5px solid #b91c1c;
    text-align: center;
}
.pr-status-table td {
    padding: 6px 8px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #0f172a;
    text-align: center;
    border: 1.5px solid #b91c1c;
    min-height: 24px;
    background: rgba(255,255,255,0.82);
}

.pr-remarks-box {
    border: 2px solid #b91c1c;
    border-radius: 6px;
    padding: 8px 12px;
    min-height: 46px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #0f172a;
    line-height: 1.5;
    box-sizing: border-box;
    flex: 0 0 auto;
}

/* ⭐ Signature block — pinned to bottom of the sheet */
.pr-signature-row {
    margin-top: auto;
    padding-top: 34px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 60px;
    flex: 0 0 auto;
}
.pr-signature-cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.pr-signature-line {
    width: 85%;
    max-width: 240px;
    height: 0;
    border-top: 1.8px solid #0f172a;
    margin-bottom: 6px;
}
.pr-signature-label {
    font-size: 0.8rem;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: 0.4px;
    text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════
   PRINT MEDIA QUERY
   ══════════════════════════════════════════════════════════════ */
@media print {
    @page { size: A4; margin: 6mm; }
    html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
    }
    body > *:not(#printResultFrame) { display: none !important; }
    .pr-result-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 10px 14px 14px !important;
        box-sizing: border-box !important;
        overflow: visible !important;
        border: 3px solid #b91c1c !important;
        page-break-inside: avoid;
        break-inside: avoid;
        background-color: #ffffff !important;
        min-height: 273mm !important;
        display: flex !important;
        flex-direction: column !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .pr-watermark { display: flex !important; opacity: 1 !important; z-index: 5 !important; }
    .pr-watermark img {
        display: block !important;
        opacity: 0.07 !important;
        width: 78% !important;
        max-width: 580px !important;
        transform: rotate(-18deg) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        filter: grayscale(15%) contrast(90%) !important;
    }
    .pr-logo { height: 90px !important; width: 90px !important; }
    .pr-info-grid, .pr-subject-table, .pr-subject-table th, .pr-subject-table td,
    .pr-status-table, .pr-status-table th, .pr-status-table td,
    .pr-section-title, .pr-result-badge, .pr-remarks-box, .pr-photo-box, .pr-info-cell span,
    .pr-signature-line, .pr-signature-label {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .pr-signature-row {
        margin-top: auto !important;
        padding-top: 28px !important;
        page-break-inside: avoid;
        break-inside: avoid;
    }
}

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════════════════════ */
@media (min-width: 821px) {
    .mobile-controls { display: none !important; }
    .mobile-filter-sheet, .mobile-filter-sheet-backdrop { display: none !important; }
}

/* ══════════════════════════════════════════════════════════════
   UTILITIES

function showToast(msg, type = 'info', ms = 3500) {
    if (!dom.toast) return;
    dom.toast.textContent = msg;
    dom.toast.className = `toast ${type}`;
    dom.toast.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { dom.toast.style.display = 'none'; }, ms);
}
function setRefreshIndicator(on) {
    if (dom.refreshDot) dom.refreshDot.classList.toggle('show', !!on);

function normalizeEmail(v) { return (v || '').toString().trim().toLowerCase(); }
function normalizeName(v) {
    if (v == null) return '';
    return v.toString().replace(/\./g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}
function namesMatch(a, b) {
    const na = normalizeName(a);
    const nb = normalizeName(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const wa = na.split(' ').filter(Boolean);
    const wb = nb.split(' ').filter(Boolean);
    if (wa.length >= 2 && wb.length >= 2) {
        const sameFirst = wa[0] === wb[0];
        const sameLast  = wa[wa.length - 1] === wb[wb.length - 1];
        if (sameFirst && sameLast) return true;
        if (na.includes(nb) || nb.includes(na)) return true;
    }
    return false;
}
function escapeHtml(v) {
    return (v == null ? '' : v.toString())
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function readSessionValue(key) {
    try {
        const raw = localStorage.getItem(key);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object' && 'value' in parsed) {
                if (parsed.expiry && Date.now() >= parsed.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.value;
            }
            return parsed;
        }
    } catch (e) {}
    try {
        const s = sessionStorage.getItem(key);
        if (s) { try { return JSON.parse(s); } catch (e) { return s; } }
    } catch (e) {}
    return null;
}
function getLoggedInEmail() {
    const userType = readSessionValue(SESSION_KEYS.USER_TYPE);
    if (userType !== 'student') return null;
    const email = readSessionValue(SESSION_KEYS.USER);
    if (!email) return null;
    return normalizeEmail(email);
}
function pickByAliases(row, aliases) {
    if (!row) return '';
    const wanted = aliases.map(a => a.toString().trim().toLowerCase());
    for (const key of Object.keys(row)) {
        const norm = key.toString().trim().toLowerCase();
        if (wanted.includes(norm)) {
            const v = row[key];
            if (v != null && v.toString().trim() !== '') return v;
        }
    }
    return '';
}
function readByExactHeader(row, header) {
    if (!row || !header) return '';
    if (row[header] !== undefined && row[header] !== null && row[header] !== '') {
        return row[header];
    }
    const target = header.toString().trim().toLowerCase();
    for (const key of Object.keys(row)) {
        if (key.toString().trim().toLowerCase() === target) {
            const v = row[key];
            if (v != null && v.toString().trim() !== '') return v;
        }
    }
    return '';
}

/* ══════════════════════════════════════════════════════════════
   THEME
   ══════════════════════════════════════════════════════════════ */
function applyTheme(theme) {
    const t = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.body.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0f1c' : '#2563eb');
}
function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved || 'light');
    window.addEventListener('storage', (e) => {
        if (e.key === THEME_KEY && e.newValue) applyTheme(e.newValue);
    });
    window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'themeChange' && e.data.theme) applyTheme(e.data.theme);
    });
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            const latest = localStorage.getItem(THEME_KEY);
            if (latest) applyTheme(latest);
        }
    });
}

/* ══════════════════════════════════════════════════════════════
   NETWORK + CACHE
   ══════════════════════════════════════════════════════════════ */
function sheetCacheKey(id, name) { return `${SHEET_KEY_PREFIX}${id}::${name}`; }
function readSheetCache(id, name, allowStale = false) {
    try {
        const raw = localStorage.getItem(sheetCacheKey(id, name));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.rows)) return null;
        if (allowStale || (Date.now() - (parsed.ts || 0)) < SHEET_CACHE_TTL) return parsed.rows;
    } catch (e) {}
    return null;
}
function writeSheetCache(id, name, rows) {
    try { localStorage.setItem(sheetCacheKey(id, name), JSON.stringify({ ts: Date.now(), rows })); } catch (e) {}
}
function clearSheetCache(id, name) {
    try { localStorage.removeItem(sheetCacheKey(id, name)); } catch (e) {}
}
async function fetchSheet(id, name, { bust = false, allowStale = false } = {}) {
    if (!bust) {
        const cached = readSheetCache(id, name, allowStale);
        if (cached) return cached;
    }
    const url = `${SCRIPT_URL}?spreadsheetId=${id}&sheetName=${encodeURIComponent(name)}&action=getData${bust ? '&_=' + Date.now() : ''}`;
    const resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) throw new Error('Network error');
    const json = await resp.json();
    if (json.status !== 'success' || !Array.isArray(json.data)) throw new Error(json.message || 'Invalid response');
    writeSheetCache(id, name, json.data);
    return json.data;
}

    const emailKey = currentEmail;

    try {
        const raw = localStorage.getItem(PROFILE_KEY_PREFIX + emailKey);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.row) {
                const cachedName = pickByAliases(parsed.row, DASH_COLS.FULL_NAME);
                if (cachedName) {
                    const imgRaw = pickByAliases(parsed.row, DASH_COLS.IMAGE);
                    const avatar = imgRaw ? getDriveThumb(imgRaw, 400) : '';
                    return { name: cachedName, avatar };
                }
            }
        }
    } catch (e) {}

    const tasks = DASHBOARD_SHEET_NAMES.map(async (sheetName) => {
        try {
            const rows = await fetchSheet(DASHBOARD_SPREADSHEET_ID, sheetName, { allowStale: true });
            const idx = rows.findIndex(r => normalizeEmail(pickByAliases(r, DASH_COLS.EMAIL)) === emailKey);
            if (idx !== -1) {
                const name = pickByAliases(rows[idx], DASH_COLS.FULL_NAME);
                if (name) {
                    const imgRaw = pickByAliases(rows[idx], DASH_COLS.IMAGE);
                    const avatar = imgRaw ? getDriveThumb(imgRaw, 400) : '';
                    return { sheet: sheetName, row: rows[idx], rowIndex: idx + 2, name, avatar };
                }
            }
        } catch (e) {}
        return null;
    });
    const results = await Promise.all(tasks);
    const found = results.find(r => r !== null);
    if (found) {
        try {
            localStorage.setItem(PROFILE_KEY_PREFIX + emailKey, JSON.stringify({
                ts: Date.now(), row: found.row, sheetName: found.sheet, rowIndex: found.rowIndex, fullName: found.name
            }));
        } catch (e) {}
        return { name: found.name, avatar: found.avatar };
    }
    return null;
}

async function getProfileFromLogin() {
    try {
        const rows = await fetchSheet(LOGIN_SPREADSHEET_ID, LOGIN_SHEET_NAME, { allowStale: true });
        const idx = rows.findIndex(r => normalizeEmail(pickByAliases(r, DASH_COLS.EMAIL)) === currentEmail);
        if (idx !== -1) {
            const name = pickByAliases(rows[idx], DASH_COLS.FULL_NAME);
            if (name) {
                const imgRaw = pickByAliases(rows[idx], DASH_COLS.IMAGE);
                const avatar = imgRaw ? getDriveThumb(imgRaw, 400) : '';
                return { name, avatar };
            }
        }
    } catch (e) {}
    return null;
}

function getNameFromEmail() {
    const local = (currentEmail || '').split('@')[0] || 'Student';
    const derived = local.replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim() || 'Student';
    return { name: derived, avatar: '' };
}

async function resolveProfile() {
    let r = await getProfileFromDashboard();
    if (r && r.name) {
        currentAvatarUrl = r.avatar || '';
        updatePillLabel(r.name, r.avatar);
        return r.name;
    }
    r = await getProfileFromLogin();
    if (r && r.name) {
        currentAvatarUrl = r.avatar || '';
        updatePillLabel(r.name, r.avatar);
        return r.name;
    }
    r = getNameFromEmail();
    currentAvatarUrl = '';
    updatePillLabel(r.name);
    return r.name;
}

/* ══════════════════════════════════════════════════════════════
   DATE / DRIVE HELPERS
   ══════════════════════════════════════════════════════════════ */
function parseDateFlexible(v) {
    if (!v) return null;
    if (v instanceof Date && !isNaN(v)) return v;
    const s = v.toString().trim();
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) {
        let [, d, mo, y] = m;
        if (y.length === 2) y = '20' + y;
        const dt = new Date(+y, +mo - 1, +d);
        return isNaN(dt) ? null : dt;
    }
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (m) {
        const dt = new Date(+m[1], +m[2] - 1, +m[3]);
        return isNaN(dt) ? null : dt;
    }
    const dt = new Date(s);
    return isNaN(dt) ? null : dt;
}
function fmtDate(v) {
    const d = parseDateFlexible(v);
    if (!d) return v == null ? '' : v.toString();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${dd}/${mm}/${d.getFullYear()}`;
}
function fmtDateForInput(d) {
    if (!d) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d)   { const x = new Date(d); x.setHours(23,59,59,999); return x; }

function getFileId(url) {
    if (!url) return '';
    const m = url.toString().match(/\/d\/([-\w]{25,})|id=([-\w]{25,})/);
    if (m) return m[1] || m[2] || '';
    const bare = url.toString().match(/^([-\w]{25,})$/);
    return bare ? bare[1] : '';
}
function getDriveThumb(url, size = 400) {
    const id = getFileId(url);
    if (!id) return '';
    return `https://lh3.googleusercontent.com/d/${id}=w${size}`;
}
function isFilled(v) {
    if (v == null) return false;
    const s = String(v).trim();
    if (s === '' || s === '—' || s === '-') return false;
    const n = parseFloat(s);
    if (!isNaN(n) && n === 0) return false;
    return true;
}

/* ══════════════════════════════════════════════════════════════
   LOAD RECORDS
   ══════════════════════════════════════════════════════════════ */
async function loadRecords({ bust = false } = {}) {
    setRefreshIndicator(true);
    if (bust) {
        RESULT_TABS.forEach(t => clearSheetCache(RESULTS_SPREADSHEET_ID, t.sheetName));
    }
    try {
        const tabsData = await Promise.all(
            RESULT_TABS.map(async (tab) => {
                try {
                    const rows = await fetchSheet(RESULTS_SPREADSHEET_ID, tab.sheetName, { bust });
                    return { tab, rows };
                } catch (e) {
                    console.warn(`[Load] "${tab.sheetName}" failed:`, e.message);
                    return { tab, rows: [] };
                }
            })
        );

        const combined = [];
        for (const { tab, rows } of tabsData) {
            if (!rows.length) continue;
            for (let i = 0; i < rows.length; i++) {
                combined.push({ tab, row: rows[i], rowIndex: i });
            }
        }
        if (!combined.length) { allRecords = []; return; }

        const matched = combined.filter(c => {
            const sheetName = pickByAliases(c.row, COL_ALIASES.STUDENT_NAME);
            return namesMatch(sheetName, currentFullName);
        });

        console.log(`[Load] Name: "${currentFullName}" · Matched ${matched.length} row(s)`);

        allRecords = matched.map((c, i) => {
            const r = c.row;
            const dateRaw = readByExactHeader(r, c.tab.dateHeader) || pickByAliases(r, COL_ALIASES.DATE);
            const dt = parseDateFlexible(dateRaw);

            const subjects = c.tab.subjects.map(name => {
                const mark = readByExactHeader(r, name);
                return { name, mark: isFilled(mark) ? mark : '' };
            });

            return {
                _id: i,
                sourceSheet: c.tab.sheetName,
                sourceRowIndex: c.rowIndex,
                srNo:     readByExactHeader(r, 'Sr. No') || pickByAliases(r, COL_ALIASES.SR_NO) || (i + 1),
                name:     pickByAliases(r, COL_ALIASES.STUDENT_NAME),
                dateRaw,
                date:     dt,
                std:      pickByAliases(r, COL_ALIASES.STD),
                testName: pickByAliases(r, COL_ALIASES.TEST_NAME),
                status:   pickByAliases(r, COL_ALIASES.STATUS),
                percent:  pickByAliases(r, COL_ALIASES.PERCENTAGE),
                obtain:   pickByAliases(r, COL_ALIASES.OBTAIN_MARKS),
                total:    pickByAliases(r, COL_ALIASES.TOTAL_MARKS),
                remarks:  pickByAliases(r, COL_ALIASES.REMARKS),
                image:    pickByAliases(r, COL_ALIASES.IMAGE),
                email:    pickByAliases(r, COL_ALIASES.EMAIL),
                subjects,
                raw: r
            };
        });

        allRecords.sort((a, b) => {
            const at = a.date ? a.date.getTime() : 0;
            const bt = b.date ? b.date.getTime() : 0;
            return bt - at;
        });
    } finally {
        setRefreshIndicator(false);
    }
}

/* ══════════════════════════════════════════════════════════════
   FILTER + SORT
   ══════════════════════════════════════════════════════════════ */
function applyFilter() {
    const q = (dom.searchInput?.value || '').trim().toLowerCase();
    const now = new Date();
    let rows = allRecords.slice();

    if (activeFilter === 'last-test') {
        const withDates = rows.filter(r => r.date);
        if (withDates.length) {
            const maxTs = Math.max(...withDates.map(r => r.date.getTime()));
            rows = rows.filter(r => r.date && r.date.getTime() === maxTs);
        } else rows = rows.slice(0, 1);
    } else if (activeFilter === 'this-month') {
        const m = now.getMonth(), y = now.getFullYear();
        rows = rows.filter(r => r.date && r.date.getMonth() === m && r.date.getFullYear() === y);
    } else if (activeFilter === 'last-month') {
        const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const m = d.getMonth(), y = d.getFullYear();
        rows = rows.filter(r => r.date && r.date.getMonth() === m && r.date.getFullYear() === y);
    } else if (activeFilter === 'custom' && customRange.from && customRange.to) {
        const fromTs = startOfDay(customRange.from).getTime();
        const toTs   = endOfDay(customRange.to).getTime();
        rows = rows.filter(r => r.date && r.date.getTime() >= fromTs && r.date.getTime() <= toTs);
    }

    if (q) {
        rows = rows.filter(r => {
            const blob = [
                r.testName, r.dateRaw, r.std, r.remarks, r.name,
                r.obtain, r.total, r.percent, r.status,
                ...(r.subjects || []).map(s => `${s.name} ${s.mark}`)
            ].map(x => (x == null ? '' : x.toString().toLowerCase())).join(' ');
            return blob.includes(q);
        });
    }

    const sortVal = dom.sortSelect?.value || dom.mobileSortSelect?.value || 'date-desc';
    rows.sort((a, b) => {
        if (sortVal === 'test-asc')  return (a.testName || '').localeCompare(b.testName || '');
        if (sortVal === 'test-desc') return (b.testName || '').localeCompare(a.testName || '');
        const at = a.date ? a.date.getTime() : 0;
        const bt = b.date ? b.date.getTime() : 0;
        return sortVal === 'date-asc' ? at - bt : bt - at;
    });

    filteredRecords = rows;
    renderTable();
    updateFilterMeta();
}

function updateFilterMeta() {
    const labelMap = {
        'all': 'All Tests',
        'last-test': 'Last Test',
        'this-month': 'This Month',
        'last-month': 'Last Month',
        'custom': customRange.from && customRange.to
            ? `${fmtDate(customRange.from)} → ${fmtDate(customRange.to)}`
            : 'Custom Range'
    };
    const show = activeFilter !== 'all';
    if (dom.filterMeta) dom.filterMeta.style.display = show ? 'flex' : 'none';
    if (show) {
        if (dom.filterMetaText) dom.filterMetaText.textContent = labelMap[activeFilter] || activeFilter;
        if (dom.filterMetaCount) dom.filterMetaCount.textContent = `(${filteredRecords.length} record${filteredRecords.length === 1 ? '' : 's'})`;
    }
    if (dom.mobileFilterLabel) dom.mobileFilterLabel.textContent = labelMap[activeFilter] || 'All Tests';
    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === activeFilter);
    });
}

/* ══════════════════════════════════════════════════════════════
   TABLE
   ══════════════════════════════════════════════════════════════ */
function renderTable() {
    if (!dom.tableBody) return;
    if (!filteredRecords.length) {
        const isFiltered = activeFilter !== 'all' || (dom.searchInput?.value || '').trim();
        dom.tableBody.innerHTML = `
            <tr><td colspan="5">
                <div class="empty-container">
                    <i class="fas fa-clipboard-list empty-icon" style="color:var(--text-light);"></i>
                    <div class="empty-title">${isFiltered ? 'No matching records' : 'No exam results yet'}</div>
                    <div class="empty-subtitle">${isFiltered
                        ? 'Try adjusting or clearing the filter.'
                        : `No records found for "${escapeHtml(currentFullName || '')}" in the exam sheet(s).`}</div>
                </div>
            </td></tr>`;
        return;
    }
    dom.tableBody.innerHTML = filteredRecords.map((r) => `
        <tr>
            <td><strong>${escapeHtml(r.srNo)}</strong></td>
            <td>${escapeHtml(r.name || currentFullName || '')}</td>
            <td>${escapeHtml(fmtDate(r.dateRaw))}</td>
            <td>${escapeHtml(r.std || '—')}</td>
            <td>
                <button class="view-action-btn" data-view-id="${r._id}">
                    <i class="fas fa-eye"></i> View
                </button>
            </td>
        </tr>
    `).join('');
    dom.tableBody.querySelectorAll('[data-view-id]').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = Number(btn.dataset.viewId);
            const record = filteredRecords.find(x => x._id === id);
            if (record) showDetail(record);
        });
    });
}

/* ══════════════════════════════════════════════════════════════

function infoTile(label, value, extraClass = '') {
    return `
        <div class="info-tile ${extraClass}">
            <div class="label">${escapeHtml(label)}</div>
            <div class="value">${escapeHtml(String(value ?? '—'))}</div>
        </div>
    `;
}

function showDetail(record) {
    currentDetail = record;
    if (dom.detailStudentName) dom.detailStudentName.textContent = record.name || 'Student Marks';

    const obtain = parseFloat(record.obtain) || 0;
    const total  = parseFloat(record.total) || 0;
    const storedPct = String(record.percent || '').replace(/%/g, '').trim();
    const pct = storedPct || (total > 0 ? ((obtain / total) * 100).toFixed(2) : '');
    const statusText = record.status || (total > 0 ? (obtain >= total * 0.33 ? 'Pass' : 'Fail') : '');
    const statusLower = String(statusText).toLowerCase();
    const statusClassHero = statusLower === 'pass' ? 'pass-bg' : (statusLower === 'fail' ? 'fail-bg' : '');

    const heroHtml = `
        <div class="detail-hero">
            <div class="detail-hero-left">
                <div class="name">${escapeHtml(record.name || currentFullName || 'Student')}</div>
                <div class="meta">
                    <span><i class="fas fa-calendar"></i> ${escapeHtml(fmtDate(record.dateRaw) || '—')}</span>
                    <span><i class="fas fa-graduation-cap"></i> ${escapeHtml(record.std || '—')}</span>
                    ${record.testName ? `<span><i class="fas fa-file-alt"></i> ${escapeHtml(record.testName)}</span>` : ''}
                </div>
            </div>
            <div class="detail-hero-right">
                ${isFilled(record.obtain) ? `
                    <div class="hero-stat highlight">
                        <div class="label">Obtained</div>
                        <div class="value">${escapeHtml(String(record.obtain))}<span style="font-size:.65em;opacity:.75;"> / ${escapeHtml(String(record.total || '—'))}</span></div>
                    </div>` : ''}
                ${pct ? `
                    <div class="hero-stat highlight">
                        <div class="label">Percentage</div>
                        <div class="value">${escapeHtml(pct)}%</div>
                    </div>` : ''}
                ${statusText ? `
                    <div class="hero-stat ${statusClassHero}">
                        <div class="label">Status</div>
                        <div class="value">${escapeHtml(statusText).toUpperCase()}</div>
                    </div>` : ''}
            </div>
        </div>
    `;

    const personalTiles = [];
    personalTiles.push(infoTile('Student Name', record.name || '—'));
    if (isFilled(record.std))      personalTiles.push(infoTile('Standard', record.std));
    if (isFilled(record.dateRaw))  personalTiles.push(infoTile('Exam Date', fmtDate(record.dateRaw)));
    if (isFilled(record.testName)) personalTiles.push(infoTile('Test Name', record.testName));
    if (isFilled(statusText))      personalTiles.push(infoTile('Status', statusText));

    const personalHtml = `
        <div class="detail-section">
            <div class="detail-section-header">
                <i class="fas fa-user"></i> Personal Information
            </div>
            <div class="detail-section-body">
                ${personalTiles.join('')}
            </div>
        </div>
    `;

    const marksTiles = [];
    (record.subjects || []).forEach(s => {
        if (isFilled(s.mark)) marksTiles.push(infoTile(s.name, s.mark, 'marks-tile'));
    });

    const marksHtml = `
        <div class="detail-section">
            <div class="detail-section-header">
                <i class="fas fa-book-open"></i> Subject-wise Marks
            </div>
            <div class="detail-section-body">
                ${marksTiles.length ? marksTiles.join('') : '<div class="info-tile" style="grid-column:1/-1;"><div class="value" style="color:var(--text-muted);font-weight:500;">No subject marks recorded</div></div>'}
            </div>
        </div>
    `;

    const resultTiles = [];
    if (isFilled(record.obtain)) resultTiles.push(infoTile('Obtain Marks', record.obtain, 'highlight'));
    if (isFilled(record.total))  resultTiles.push(infoTile('Total Marks',  record.total,  'highlight'));
    if (pct)                     resultTiles.push(infoTile('Percentage (%)', pct + '%',  'highlight'));
    if (isFilled(statusText))    resultTiles.push(infoTile('Final Status', statusText,   'highlight'));
    if (isFilled(record.remarks)) resultTiles.push(infoTile('Remarks', record.remarks, 'remark-tile'));

    const resultHtml = resultTiles.length ? `
        <div class="detail-section">
            <div class="detail-section-header">
                <i class="fas fa-award"></i> Result Summary & Remarks
            </div>
            <div class="detail-section-body">
                ${resultTiles.join('')}
            </div>
        </div>
    ` : '';

    if (dom.detailContainer) {
        dom.detailContainer.innerHTML = heroHtml + personalHtml + marksHtml + resultHtml;
    }
    dom.page1.classList.remove('active-page');
    dom.page2.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToList() {
    dom.page2.classList.remove('active-page');
    dom.page1.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ⭐ Print via hidden iframe with image + font preloading */
async function printResult() {
    const sheet = document.getElementById('printResultSheet');
    if (!sheet) { showToast('❌ Nothing to print', 'error'); return; }

    const oldFrame = document.getElementById('printResultFrame');
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement('iframe');
    iframe.id = 'printResultFrame';
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Result - ${escapeHtml(currentFullName || 'Student')}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>${getPrintStyles()}</style>
</head>
<body class="pr-print-body">${sheet.outerHTML}</body>
</html>`);
    doc.close();

    const waitForImages = () => new Promise((resolve) => {
        const images = Array.from(doc.images || []);
        if (!images.length) return resolve();

        let pending = images.length;
        let settled = false;
        const finish = () => { if (!settled) { settled = true; resolve(); } };
        const tick = () => { pending -= 1; if (pending <= 0) finish(); };

        images.forEach(img => {
            if (img.complete && img.naturalWidth > 0) { tick(); return; }
            img.addEventListener('load', tick, { once: true });
            img.addEventListener('error', tick, { once: true });
        });

        setTimeout(finish, 4000);
    });

    const waitForFonts = () => {
        try {
            if (doc.fonts && doc.fonts.ready) return doc.fonts.ready.catch(() => {});
        } catch (e) {}
        return Promise.resolve();
    };

    await new Promise(r => setTimeout(r, 120));
    await Promise.all([waitForImages(), waitForFonts()]);
    await new Promise(r => setTimeout(r, 200));

    try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    } catch (e) {
        console.error('Print failed:', e);
        showToast('❌ Print failed. Try again.', 'error');
    } finally {
        setTimeout(() => {
            if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }, 1500);
    }
}

/* ══════════════════════════════════════════════════════════════
   REFRESH
   ══════════════════════════════════════════════════════════════ */
async function doRefresh() {
    if (refreshInFlight) return;
    refreshInFlight = true;

    [dom.refreshBtn, dom.mobileRefreshBtn].forEach(btn => {
        if (!btn) return;
        btn.disabled = true;
        btn.dataset.originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner sm"></span> Refreshing…';
    });

    try {
        DASHBOARD_SHEET_NAMES.forEach(n => clearSheetCache(DASHBOARD_SPREADSHEET_ID, n));
        RESULT_TABS.forEach(t => clearSheetCache(RESULTS_SPREADSHEET_ID, t.sheetName));
        clearSheetCache(LOGIN_SPREADSHEET_ID, LOGIN_SHEET_NAME);

        currentFullName = await resolveProfile();
        await loadRecords({ bust: true });
        applyFilter();

        if (allRecords.length) {
            showToast(`✅ Refreshed — ${allRecords.length} record${allRecords.length === 1 ? '' : 's'}`, 'success', 2500);
        } else {
            showToast('✅ Refreshed — no records found', 'info', 2500);
        }
    } catch (err) {
        console.error('[Refresh]', err);
        showToast('❌ Refresh failed: ' + (err.message || 'Unknown error'), 'error', 4000);
    } finally {
        refreshInFlight = false;
        [dom.refreshBtn, dom.mobileRefreshBtn].forEach(btn => {
            if (!btn) return;
            btn.disabled = false;
            if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
        });
    }
}

/* ══════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════ */
function bindEvents() {
    let searchTimer = null;
    dom.searchInput?.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilter, 180);
    });
    dom.sortSelect?.addEventListener('change', applyFilter);
    dom.mobileSortSelect?.addEventListener('change', () => {
        if (dom.sortSelect) dom.sortSelect.value = dom.mobileSortSelect.value;
        applyFilter();
    });
    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const f = chip.dataset.filter;
            if (f === 'custom') { openDateRange(); return; }
            activeFilter = f;
            customRange = { from: null, to: null };
            closeMobileFilter();
            applyFilter();
        });
    });
    dom.clearFilterBtn?.addEventListener('click', () => {
        activeFilter = 'all';
        customRange = { from: null, to: null };
        if (dom.searchInput) dom.searchInput.value = '';
        applyFilter();
    });
    dom.mobileFilterBtn?.addEventListener('click', openMobileFilter);
    dom.mobileFilterClose?.addEventListener('click', closeMobileFilter);
    dom.mobileFilterBackdrop?.addEventListener('click', closeMobileFilter);
    dom.closeDateRangeBtn?.addEventListener('click', closeDateRange);
    dom.cancelDateRangeBtn?.addEventListener('click', closeDateRange);
    dom.applyDateRangeBtn?.addEventListener('click', applyDateRange);
    dom.dateRangeModal?.addEventListener('click', (e) => {
        if (e.target === dom.dateRangeModal) closeDateRange();
    });
    document.querySelectorAll('[data-quick]').forEach(btn => {
        btn.addEventListener('click', () => {
            const q = btn.dataset.quick;
            const today = new Date();
            let from, to;
            if (q === 'last7')       { to = today; from = new Date(today); from.setDate(from.getDate() - 6); }
            else if (q === 'last30') { to = today; from = new Date(today); from.setDate(from.getDate() - 29); }
            else if (q === 'this-month') { from = new Date(today.getFullYear(), today.getMonth(), 1); to = new Date(today.getFullYear(), today.getMonth() + 1, 0); }
            else if (q === 'last-month') { from = new Date(today.getFullYear(), today.getMonth() - 1, 1); to = new Date(today.getFullYear(), today.getMonth(), 0); }
            else if (q === 'this-year')  { from = new Date(today.getFullYear(), 0, 1); to = new Date(today.getFullYear(), 11, 31); }
            if (dom.fromDateInput) dom.fromDateInput.value = fmtDateForInput(from);
            if (dom.toDateInput)   dom.toDateInput.value   = fmtDateForInput(to);
        });
    });
    dom.backToListBtn?.addEventListener('click', backToList);
    dom.printFromDetailBtn?.addEventListener('click', openPrintResult);
    dom.closePrintResultBtn?.addEventListener('click', closePrintPreview);
    dom.closePrintResultFooterBtn?.addEventListener('click', closePrintPreview);
    dom.printResultNowBtn?.addEventListener('click', printResult);
    dom.printResultModal?.addEventListener('click', (e) => {
        if (e.target === dom.printResultModal) closePrintPreview();
    });
    dom.refreshBtn?.addEventListener('click', doRefresh);
    dom.mobileRefreshBtn?.addEventListener('click', doRefresh);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeMobileFilter(); closeDateRange(); closePrintPreview(); }
    });
}

function openMobileFilter() {
    dom.mobileFilterSheet?.classList.add('open');
    dom.mobileFilterBackdrop?.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeMobileFilter() {
    dom.mobileFilterSheet?.classList.remove('open');
    dom.mobileFilterBackdrop?.classList.remove('open');
    document.body.style.overflow = '';
}
function openDateRange() {
    dom.dateRangeModal?.classList.add('active');
    if (dom.fromDateInput && customRange.from) dom.fromDateInput.value = fmtDateForInput(customRange.from);
    if (dom.toDateInput && customRange.to)     dom.toDateInput.value   = fmtDateForInput(customRange.to);
    if (!dom.fromDateInput?.value || !dom.toDateInput?.value) {
        const t = new Date();
        if (dom.fromDateInput) dom.fromDateInput.value = fmtDateForInput(new Date(t.getFullYear(), t.getMonth(), 1));
        if (dom.toDateInput)   dom.toDateInput.value   = fmtDateForInput(new Date(t.getFullYear(), t.getMonth() + 1, 0));
    }
}
function closeDateRange() { dom.dateRangeModal?.classList.remove('active'); }
function applyDateRange() {
    const fromVal = dom.fromDateInput?.value;
    const toVal   = dom.toDateInput?.value;
    if (!fromVal || !toVal) { showToast('Please pick both From and To dates', 'warning'); return; }
    const from = new Date(fromVal);
    const to   = new Date(toVal);
    if (from > to) { showToast('From date must be before To date', 'warning'); return; }
    customRange = { from, to };
    activeFilter = 'custom';
    closeDateRange();
    closeMobileFilter();
    applyFilter();
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function init() {
    cacheDom();
    initTheme();
    bindEvents();

    currentEmail = getLoggedInEmail();
    if (!currentEmail) {
        showToast('Please log in as a student first', 'error', 5000);
        if (dom.tableBody) {
            dom.tableBody.innerHTML = `
                <tr><td colspan="5">
                    <div class="error-container">
                        <i class="fas fa-user-lock error-icon"></i>
                        <div class="error-title">Not logged in</div>
                        <div class="empty-subtitle">You need to be logged in as a student to view your exam results.</div>
                        <div class="error-actions">
                            <a href="../../Study Material/My Account/myaccount.html" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt"></i> Go to Login
                            </a>
                        </div>
                    </div>
                </td></tr>`;
        }
        return;
    }

    try {
        currentFullName = await resolveProfile();
        console.log('[Boot] Name:', currentFullName, '| Avatar:', currentAvatarUrl || '(none)');

        if (!currentFullName) {
            showToast('Could not determine your name. Please re-login.', 'error', 5000);
            return;
        }
        await loadRecords();
        applyFilter();
        if (!allRecords.length) {
            showToast(`No exam records found for "${currentFullName}"`, 'info', 4500);
        }
    } catch (err) {
        console.error('[StudentExam]', err);
        showToast('Failed to load exam results: ' + (err.message || 'Unknown error'), 'error', 5000);
    }
}

function scheduleInit() {
    if ('requestIdleCallback' in window) {
        requestIdleCallback(() => init(), { timeout: 1200 });
    } else {
        setTimeout(init, 0);
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleInit, { once: true });
} else {
    scheduleInit();
}

})();
