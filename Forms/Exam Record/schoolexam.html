<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>📚 Ujjwal Academy | Exam Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ============================================================
           CSS VARIABLES & THEME - MATCHING myaccount.html
           ============================================================ */
        :root {
            --bg-body: #f4f7fc;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1e293b;
            --text-muted: #5b6e8c;
            --text-light: #94a3b8;
            --border-light: #e2e8f0;
            --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.06);
            --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.12);
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --card-border: 1px solid rgba(0,0,0,0.04);
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --admin-gold: #f59e0b;
            --admin-badge-bg: rgba(245, 158, 11, 0.15);
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        [data-theme="dark"] {
            --bg-body: #0a0f1c;
            --bg-card: #1e293b;
            --bg-header: #111827;
            --text-main: #f1f5f9;
            --text-muted: #9ca3af;
            --text-light: #64748b;
            --border-light: #1f2a3e;
            --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.6);
            --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.8);
            --accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.15);
            --card-border: 1px solid rgba(255,255,255,0.04);
            --input-bg: #1e293b;
            --input-border: #334155;
            --admin-badge-bg: rgba(245, 158, 11, 0.2);
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        /* ============================================================
           BASE STYLES
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            transition: background var(--transition-normal), color var(--transition-normal);
            min-height: 100vh;
            padding: 20px 16px;
        }

        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-light);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page.active-page { display: block; }

        /* ============================================================
           TOP BAR
           ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--bg-header);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.8rem;
            transition: background var(--transition-normal);
        }

        .brand-area { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            height: 44px;
            width: auto;
            object-fit: contain;
        }
        [data-theme="dark"] .brand-logo { filter: brightness(0) invert(1); }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--admin-badge-bg);
            color: var(--admin-gold);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--admin-gold);
        }

        .session-info {
            font-size: 0.7rem;
            color: var(--text-light);
            display: none;
            align-items: center;
            gap: 6px;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            background: var(--accent-soft);
            border: 1px solid var(--border-light);
            transition: all var(--transition-fast);
        }
        .session-info i { font-size: 0.65rem; color: var(--success); }
        .session-info .expiry-time { font-weight: 600; color: var(--text-muted); }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::before { width: 300px; height: 300px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: white; transform: translateY(-2px); }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-2px); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }
        .btn-success:hover { transform: translateY(-2px); }

        .btn-sm { padding: 0.4rem 1rem; font-size: 0.75rem; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* ============================================================
           SEARCH SECTION
           ============================================================ */
        .search-section {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 1.5rem 2rem;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .search-wrapper {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrapper input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
        }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .search-wrapper input::placeholder { color: var(--text-light); }

        .desktop-buttons { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .mobile-buttons { display: none; gap: 0.8rem; width: 100%; margin-top: 1rem; }
        .mobile-buttons .btn { flex: 1; justify-content: center; }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-card {
            background: var(--bg-card);
            border-radius: 32px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 1rem 1rem;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 1rem 1.2rem;
            background: var(--table-header-bg);
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 3px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
            transition: background var(--transition-fast);
        }
        .data-table tr:hover td { background: var(--table-row-hover); }

        .data-table th:first-child { border-top-left-radius: 12px; }
        .data-table th:last-child { border-top-right-radius: 12px; }

        .view-action-btn {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .view-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

        /* ============================================================
           DETAIL VIEW (Marks)
           ============================================================ */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
        }

        .detail-card {
            background: var(--accent-soft);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--border-light);
            transition: all var(--transition-fast);
        }
        .detail-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .detail-card .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .detail-card .value {
            font-weight: 700;
            font-size: 1rem;
            margin-top: 4px;
            color: var(--text-main);
        }

        .detail-actions {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }
        .modal-overlay.active { display: flex; visibility: visible; opacity: 1; }
        .modal-overlay.nested { z-index: 2001; }

        .modal-box {
            background: var(--bg-card);
            border-radius: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: var(--card-border);
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-box.wide { max-width: 900px; }

        .modal-header {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 40px 40px 0 0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }
        .modal-close:hover { transform: rotate(90deg); }

        .modal-body { padding: 2rem; overflow-y: auto; max-height: calc(90vh - 70px); }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 1rem;
        }
        .form-group label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
        }
        .form-group input, .form-group select {
            padding: 0.7rem 1rem;
            border-radius: 16px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all var(--transition-fast);
            font-family: inherit;
            width: 100%;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-grid .fullwidth { grid-column: 1 / -1; }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .student-select-btn {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .student-select-btn input {
            flex: 1;
            cursor: pointer;
            background: var(--accent-soft);
        }
        .student-select-btn .btn { padding: 0.5rem 1rem; }

        /* ============================================================
           STUDENT SELECTOR POPUP
           ============================================================ */
        .student-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .student-list .student-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px;
        }
        .student-list .student-item:hover {
            background: var(--accent-soft);
            transform: translateX(4px);
        }
        .student-list .student-item .std-badge {
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        /* ============================================================
           STATUS MESSAGES
           ============================================================ */
        .status-message {
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 1rem;
            display: none;
            font-weight: 600;
            text-align: center;
        }
        .status-success { background: var(--success); color: white; }
        .status-error { background: var(--danger); color: white; }
        .status-info { background: var(--accent); color: white; }

        /* ============================================================
           ALERT TOAST
           ============================================================ */
        .alert-popup {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--bg-card);
            border-left: 5px solid var(--accent);
            padding: 16px 24px;
            box-shadow: var(--shadow-hover);
            border-radius: 0 16px 16px 0;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 3000;
            display: none;
            animation: slideIn 0.3s ease-out;
            color: var(--text-main);
            max-width: 400px;
        }
        .alert-popup.success { border-left-color: var(--success); }
        .alert-popup.error { border-left-color: var(--danger); }
        .alert-popup.warning { border-left-color: var(--warning); }

        /* ============================================================
           LOADING / EMPTY / ERROR STATES
           ============================================================ */
        .loading-container, .empty-container, .error-container {
            text-align: center;
            padding: 40px 20px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        .empty-icon, .error-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
        .error-icon { color: var(--danger); }
        .empty-title { font-weight: 600; color: var(--text-secondary); font-size: 1.1rem; }
        .error-title { font-weight: 600; color: var(--danger); font-size: 1.1rem; }
        .error-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 820px) {
            .desktop-buttons { display: none; }
            .mobile-buttons { display: flex; }
            .top-bar { padding: 0.6rem 1rem; border-radius: 32px; }
            .brand-text { font-size: 1.2rem; }
            .brand-logo { height: 38px; }
            .search-section { padding: 1rem 1.2rem; border-radius: 24px; }
            .search-wrapper input { font-size: 0.9rem; padding: 0.7rem 1rem; }
            .data-table th, .data-table td { padding: 0.8rem 0.8rem; font-size: 0.75rem; }
            .modal-box { max-width: 95%; }
            .form-grid { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: 1fr 1fr; }
            .modal-body { padding: 1.5rem; }
            .alert-popup { bottom: 70px; right: 15px; left: 15px; max-width: none; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .top-bar { padding: 0.4rem 0.8rem; border-radius: 24px; }
            .brand-text { font-size: 1rem; }
            .brand-logo { height: 32px; }
            .data-table th, .data-table td { padding: 0.6rem; font-size: 0.7rem; }
            .detail-grid { grid-template-columns: 1fr; }
            .modal-box { border-radius: 28px; }
            .modal-header { border-radius: 28px 28px 0 0; padding: 1rem 1.2rem; }
            .modal-header h3 { font-size: 1.1rem; }
            .modal-body { padding: 1.2rem; }
            .btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
            .student-list .student-item { font-size: 0.85rem; padding: 0.6rem 0.8rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- ===================== TOP BAR ===================== -->
    <header class="top-bar">
        <div class="brand-area">
            <img class="brand-logo" src="https://lh3.googleusercontent.com/d/1HUjvQXeYLxFtt5StZMinVh8sXRZ_TI0F" alt="Ujjwal Academy logo">
            <span class="brand-text">Ujjwal Academy</span>
            <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
        </div>
        <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
            <span class="session-info" id="sessionInfo">
                <i class="fas fa-clock"></i>
                <span>Session: <span class="expiry-time" id="sessionExpiry">10 days</span></span>
            </span>
            <button onclick="handleLogout()" class="btn btn-outline btn-sm">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
            <button onclick="window.location.href='../../Study Material/My Account/myaccount.html'" class="btn btn-outline btn-sm">
                <i class="fas fa-user"></i> My Account
            </button>
        </div>
    </header>

    <!-- ===================== PAGE 1 - LIST VIEW ===================== -->
    <div id="page1" class="page active-page">

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Search by Student Name, Std, or Date...">
                <div class="desktop-buttons">
                    <button id="refreshBtn" class="btn btn-outline"><span>⟳</span> Refresh</button>
                    <button id="addNewBtn" class="btn btn-primary"><span>+</span> Add Record</button>
                </div>
            </div>
            <div class="mobile-buttons">
                <button id="mobileRefreshBtn" class="btn btn-outline"><span>⟳</span> Refresh</button>
                <button id="mobileAddBtn" class="btn btn-primary"><span>+</span> Add Record</button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>Student Name</th>
                            <th>Date</th>
                            <th>Std</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" style="text-align:center;">
                                <div class="loading-container">
                                    <div class="loading-spinner"></div>
                                    <div class="loading-message">Loading exam records...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===================== PAGE 2 - DETAIL VIEW (Marks) ===================== -->
    <div id="page2" class="page">
        <div class="table-card">
            <div class="modal-header" style="border-radius: 32px 32px 0 0;">
                <h3><i class="fas fa-graduation-cap"></i> <span id="detailStudentName">Student Marks</span></h3>
                <button id="backToListBtn" class="btn btn-outline" style="background:rgba(255,255,255,0.15);color:white;border-color:rgba(255,255,255,0.3);">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </div>
            <div id="detailContainer" class="detail-grid">
                <!-- Rendered dynamically -->

<script>
// ================================================================
// 🔐 COMPLETE AUTHENTICATION (Matches myaccount.html)
// ================================================================

const SESSION_KEYS = {
    USER: 'ujjwal_user',
    USER_DATA: 'ujjwal_user_data',
    USER_TYPE: 'ujjwal_user_type',
    REMEMBER_ME: 'ujjwal_remember_me',
    SESSION_EXPIRY: 'ujjwal_session_expiry'
};

function getSessionData(key) {
    // Check localStorage first (Remember Me)
    const localData = localStorage.getItem(key);
    if (localData) {
        try {
            const parsed = JSON.parse(localData);
            if (parsed.expiry && Date.now() < parsed.expiry) {
                return parsed.value;
            } else {
                localStorage.removeItem(key);
                return null;
            }
        } catch (e) {
            return null;
        }
    }
    
    // Check sessionStorage
    const sessionData = sessionStorage.getItem(key);
    if (sessionData) {
        try {
            return JSON.parse(sessionData);
        } catch (e) {
            return sessionData;
        }
    }
    return null;
}

function isRememberMeActive() {
    const rememberMe = localStorage.getItem(SESSION_KEYS.REMEMBER_ME);
    if (rememberMe) {
        try {
            const parsed = JSON.parse(rememberMe);
            return parsed.value === true && Date.now() < parsed.expiry;
        } catch (e) {
            return false;
        }
    }
    return false;
}

function getSessionExpiryTime() {
    const expiryData = localStorage.getItem(SESSION_KEYS.SESSION_EXPIRY);
    if (expiryData) {
        try {
            const parsed = JSON.parse(expiryData);
            if (Date.now() < parsed.expiry) {
                return parsed.value;
            }
        } catch (e) {}
    }
    return null;
}

function clearAllSessionData() {
    Object.values(SESSION_KEYS).forEach(key => {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
    });
}

function updateSessionDisplay() {
    const sessionInfo = document.getElementById('sessionInfo');
    const expiryDisplay = document.getElementById('sessionExpiry');
    if (!sessionInfo || !expiryDisplay) return;
    
    const expiry = getSessionExpiryTime();
    if (expiry && isRememberMeActive()) {
        const remaining = expiry - Date.now();
        if (remaining > 0) {
            const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
            const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
            if (days > 0) {
                expiryDisplay.textContent = `${days}d ${hours}h remaining`;
            } else {
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                expiryDisplay.textContent = `${hours}h ${minutes}m remaining`;
            }
            sessionInfo.style.display = 'inline-flex';
        } else {
            sessionInfo.style.display = 'none';
        }
    } else {
        sessionInfo.style.display = 'none';
    }
}

function checkAdminAuth() {
    let user = null;
    let userType = null;
    const rememberMe = isRememberMeActive();
    
    if (rememberMe) {
        user = getSessionData(SESSION_KEYS.USER);
        userType = getSessionData(SESSION_KEYS.USER_TYPE);
        
        const expiry = getSessionExpiryTime();
        if (expiry && Date.now() > expiry) {
            clearAllSessionData();
            user = null;
            userType = null;
        }
    } else {
        const userData = sessionStorage.getItem(SESSION_KEYS.USER);
        const userTypeData = sessionStorage.getItem(SESSION_KEYS.USER_TYPE);
        if (userData) {
            try {
                user = JSON.parse(userData);
                userType = JSON.parse(userTypeData);
            } catch (e) {
                user = null;
                userType = null;
            }
        }
    }
    
    // Check if user is authenticated as admin
    if (!user || userType !== 'admin') {
        // Check if this is a student trying to access admin page
        if (user && userType === 'student') {
            showToast('⚠️ Student access denied. Admin login required.', 'warning');
            setTimeout(() => {
                window.location.href = '../../Study Material/My Account/myaccount.html';
            }, 1500);
            return false;
        }
        
        // Store redirect URL for after login
        sessionStorage.setItem('redirect_after_login', window.location.href);
        window.location.href = '../../Study Material/My Account/myaccount.html';
        return false;
    }
    
    // Update session display
    updateSessionDisplay();
    return true;
}

function handleLogout() {
    clearAllSessionData();
    clearCache();
    dataLoaded = false;
    allRecords = [];
    window.location.href = '../../Study Material/My Account/myaccount.html';
}

// Session expiry checker
setInterval(() => {
    const expiry = getSessionExpiryTime();
    if (expiry && Date.now() > expiry) {
        clearAllSessionData();
        if (window.location.pathname.includes('schoolexam.html')) {
            window.location.href = '../../Study Material/My Account/myaccount.html';
        }
    }
    updateSessionDisplay();
}, 60000);

// ================================================================
// THEME SYNC (Matches myaccount.html)
// ================================================================
function syncThemeWithParent() {
    const localTheme = localStorage.getItem('user-theme-preference');
    if (localTheme) {
        document.body.setAttribute('data-theme', localTheme);
        document.documentElement.setAttribute('data-theme', localTheme);
    } else {
        try {
            if (window.parent && window.parent.document.body) {
                const parentTheme = window.parent.document.body.getAttribute('data-theme');
                if (parentTheme) {
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                }
            }
        } catch(e) {}
    }
}

window.addEventListener('DOMContentLoaded', syncThemeWithParent);
window.addEventListener('storage', syncThemeWithParent);

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'themeChange') {
        const newTheme = event.data.theme;
        if (newTheme) {
            document.body.setAttribute('data-theme', newTheme);
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    }
});

// ================================================================
// UTILITY FUNCTIONS
// ================================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function showToast(msg, type = 'info') {
    const box = dom.alertBox;
    if (!box) return;
    box.textContent = msg;
    box.className = `alert-popup ${type}`;
    box.style.display = 'block';
    clearTimeout(box._timeout);
    box._timeout = setTimeout(() => { box.style.display = 'none'; }, 4500);
}

function showSpinner(element, show, customHtml = null) {
    if (!element) return;
    if (show) {
        element.disabled = true;
        const originalText = element.innerHTML;
        element.setAttribute('data-original-text', originalText);
        element.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
    } else {
        element.disabled = false;
        const original = element.getAttribute('data-original-text');
        if (original) element.innerHTML = original;
    }
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    try {
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
    } catch { return dateStr; }
}

function getVisibleSubjects(std) {
    const all = [...SUBJECT_CONFIG.allSubjects];
    const hidden = SUBJECT_CONFIG.hiddenSubjects[std] || [];
    return all.filter(s => !hidden.includes(s));
}

// ================================================================
// CACHE MANAGEMENT
// ================================================================
const CACHE_KEY = 'exam_records_cache';
const CACHE_VERSION_KEY = 'exam_records_version';
const CURRENT_CACHE_VERSION = '1.0';

function getCache() {
    try {
        const version = localStorage.getItem(CACHE_VERSION_KEY);
        if (version !== CURRENT_CACHE_VERSION) {
            localStorage.removeItem(CACHE_KEY);
            localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
            return null;
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, timestamp } = JSON.parse(cached);
            if (Date.now() - timestamp < CONFIG.CACHE_TTL) {
                return data;
            }
            localStorage.removeItem(CACHE_KEY);
        }
    } catch (e) { console.error('Cache read error:', e); }
    return null;
}

function setCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data: data,
            timestamp: Date.now()
        }));
        localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
    } catch (e) { console.error('Cache write error:', e); }
}

function clearCache() {
    localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem(CACHE_VERSION_KEY);
    dataLoaded = false;
}

// ================================================================
// FETCH STUDENTS FROM ALL STD SHEETS
// ================================================================
async function fetchAllStudents() {
    const result = {};
    for (const sheetName of CONFIG.STUDENT_SHEETS) {
        try {
            const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.STUDENT_SPREADSHEET_ID}&sheetName=${sheetName}&_=${Date.now()}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data.status === 'success' && Array.isArray(data.data)) {
                result[sheetName] = data.data.map((row, idx) => ({
                    ...row,
                    _rowIndex: idx + 2,
                    _sheet: sheetName
                }));
            }
        } catch (err) {
            console.error(`Error fetching ${sheetName}:`, err);
            result[sheetName] = [];
        }
    }
    return result;
}

// ================================================================
// FETCH EXAM RECORDS
// ================================================================
async function loadRecords(forceRefresh = false) {
    const tableBody = dom.tableBody;
    if (!tableBody) return;

    if (!forceRefresh && dataLoaded && allRecords.length > 0) {
        renderTable();
        return;
    }

    try {
        if (!forceRefresh) {
            const cached = getCache();
            if (cached && Array.isArray(cached) && cached.length > 0) {
                allRecords = cached;
                dataLoaded = true;
                renderTable();
                showToast(`📦 Loaded ${allRecords.length} records from cache`, 'info');
                setTimeout(() => refreshInBackground(), 3000);
                return;
            }
        }

        tableBody.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-message">Loading exam records...</div>
                    </div>
                </td>
            </tr>
        `;

        const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.SPREADSHEET_ID}&sheetName=${CONFIG.SHEET_NAME}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data)) {
            allRecords = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(allRecords);
            dataLoaded = true;
            renderTable();
            showToast(`✅ Loaded ${allRecords.length} records`, 'success');
        } else {
            throw new Error(result.message || 'Failed to load data');
        }
    } catch (err) {
        console.error('Load records error:', err);
        const cached = getCache();
        if (cached && Array.isArray(cached) && cached.length > 0) {
            allRecords = cached;
            dataLoaded = true;
            renderTable();
            showToast('⚠️ Using cached data (offline mode)', 'warning');
        } else {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="error-container">
                            <span class="error-icon">⚠️</span>
                            <p class="error-title">Failed to load data</p>
                            <p class="error-message">${escapeHtml(err.message)}</p>
                            <div class="error-actions">
                                <button onclick="handleRetry()" class="btn btn-primary">⟳ Retry</button>
                                <button onclick="handleClearCache()" class="btn btn-outline">🧹 Clear Cache</button>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        }
    }
}

async function refreshInBackground() {
    try {
        const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.SPREADSHEET_ID}&sheetName=${CONFIG.SHEET_NAME}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();
        if (result.status === 'success' && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            if (JSON.stringify(allRecords) !== JSON.stringify(newData)) {
                allRecords = newData;
                setCache(allRecords);
                renderTable();
                showToast('🔄 Data updated in background', 'info');
            }
        }
    } catch (err) { console.log('Background refresh failed:', err.message); }
}

// ================================================================
// RENDER TABLE
// ================================================================
function renderTable(filter = '') {
    const tableBody = dom.tableBody;
    if (!tableBody) return;

    const searchLower = filter.toLowerCase().trim();
    let filtered = allRecords;

    if (searchLower) {
        filtered = allRecords.filter(r => {
            const name = (r['Student Name'] || '').toLowerCase();
            const std = (r['Std'] || '').toLowerCase();
            const date = (r['Date'] || '').toLowerCase();
            return name.includes(searchLower) || std.includes(searchLower) || date.includes(searchLower);
        });
    }

    if (!filtered || filtered.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-container">
                        <span class="empty-icon">📚</span>
                        <p class="empty-title">${searchLower ? 'No matching records found' : 'No exam records yet'}</p>
                        <p class="empty-subtitle">${searchLower ? 'Try adjusting your search' : 'Click "Add Record" to add your first exam'}</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    const fragment = document.createDocumentFragment();
    filtered.forEach((record, idx) => {
        const row = document.createElement('tr');
        const actualIndex = allRecords.indexOf(record);
        const studentName = record['Student Name'] || '—';
        const date = record['Date'] || '—';
        const std = record['Std'] || '—';

        row.innerHTML = `
            <td><strong>${idx + 1}</strong></td>
            <td>${escapeHtml(studentName)}</td>
            <td>${formatDate(date)}</td>
            <td>${escapeHtml(std)}</td>
            <td>
                <button class="view-action-btn" data-index="${actualIndex}" data-std="${escapeHtml(std)}">
                    <i class="fas fa-eye"></i> View
                </button>
            </td>
        `;
        fragment.appendChild(row);
    });

    tableBody.innerHTML = '';
    tableBody.appendChild(fragment);

    tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const index = parseInt(this.getAttribute('data-index'));
            if (!isNaN(index) && index >= 0 && index < allRecords.length) {
                currentViewRecord = allRecords[index];
                currentEditRecord = allRecords[index];
                selectedRowIndex = currentViewRecord._rowIndex;
                showDetailView(currentViewRecord);
            } else {
                showToast('❌ Record not found', 'error');
            }
        });
    });
}

// ================================================================
// SHOW DETAIL VIEW (Marks)
// ================================================================
function showDetailView(record) {
    if (!record) {
        showToast('❌ No record to display', 'error');
        return;
    }

    dom.detailStudentName.textContent = record['Student Name'] || 'Student Marks';
    const container = dom.detailContainer;
    container.innerHTML = '';

    // Get all visible subjects based on Std
    const std = record['Std'] || '';
    const visibleSubjects = getVisibleSubjects(std);

    // Display student info first
    const infoFields = [
        { label: 'Student Name', value: record['Student Name'] || '—' },
        { label: 'Date', value: formatDate(record['Date']) || '—' },
        { label: 'Std', value: record['Std'] || '—' }
    ];

    infoFields.forEach(f => {
        const card = document.createElement('div');
        card.className = 'detail-card';
        card.innerHTML = `
            <div class="label">${f.label}</div>
            <div class="value">${escapeHtml(f.value)}</div>
        `;
        container.appendChild(card);
    });

    // Display subject marks
    const marksFields = [];
    visibleSubjects.forEach(subject => {
        const value = record[subject];
        if (value !== undefined && value !== null && value !== '') {
            marksFields.push({ label: subject, value: value });
        }
    });

    // Also check for Obtain Marks and Total Marks
    if (record['Obtain Marks'] !== undefined && record['Obtain Marks'] !== '') {
        marksFields.push({ label: 'Obtain Marks', value: record['Obtain Marks'] });
    }
    if (record['Total Marks'] !== undefined && record['Total Marks'] !== '') {
        marksFields.push({ label: 'Total Marks', value: record['Total Marks'] });
    }

    if (marksFields.length === 0) {
        const card = document.createElement('div');
        card.className = 'detail-card';
        card.style.gridColumn = '1 / -1';
        card.innerHTML = `
            <div class="value" style="color: var(--text-muted);">No marks data available</div>
        `;
        container.appendChild(card);
    } else {
        marksFields.forEach(f => {
            const card = document.createElement('div');
            card.className = 'detail-card';
            card.innerHTML = `
                <div class="label">${escapeHtml(f.label)}</div>
                <div class="value">${escapeHtml(String(f.value))}</div>
            `;
            container.appendChild(card);
        });
    }

    dom.page1.classList.remove('active-page');
    dom.page2.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================================================================
// BUILD FORM
// ================================================================
function buildForm(record = null, isEdit = false) {
    const def = {
        'Date': '',
        'Student Name': '',
        'Std': '',
        'English': '',
        'Hindi': '',
        'Marathi': '',
        'History & Civics': '',
        'History': '',
        'Political Science': '',
        'Geography': '',
        'Science': '',
        'Science Part 1': '',
        'Science Part 2': '',

        'Maths Part 1': '',
        'Maths Part 2': '',

        });

            <div class="form-group subject-field" data-subject="${subject}">
                <label>${escapeHtml(displayName)}</label>
                <input type="number" step="0.01" id="f_${subject.replace(/[& ]/g, '_')}" value="${escapeHtml(val)}" placeholder="Enter marks">
            </div>
        `;
    });

    // Always include Obtain Marks and Total Marks
    const obtainMarksHtml = `
        <div class="form-group fullwidth">
            <label>Obtain Marks</label>
            <input type="number" step="0.01" id="f_Obtain_Marks" value="${escapeHtml(def['Obtain Marks'] || '')}" placeholder="Total obtain marks">
        </div>
        <div class="form-group fullwidth">
            <label>Total Marks</label>
            <input type="number" step="0.01" id="f_Total_Marks" value="${escapeHtml(def['Total Marks'] || '')}" placeholder="Total marks">
        </div>
    `;

    return `
        <form id="examForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="f_Date" value="${def['Date'] || ''}" required>
                </div>
                <div class="form-group">
                    <label>Student Name *</label>
                    <div class="student-select-btn">
                        <input type="text" id="f_Student_Name" value="${escapeHtml(def['Student Name'])}" placeholder="Click to select student" readonly required style="cursor:pointer;">
                        <button type="button" class="btn btn-outline btn-sm" id="selectStudentBtn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Std *</label>
                    <input type="text" id="f_Std" value="${escapeHtml(def['Std'])}" readonly required style="background:var(--accent-soft);">
                </div>
            </div>

            <div style="margin: 1rem 0; border-top: 2px solid var(--border-light); padding-top: 1rem;">
                <h4 style="color: var(--accent); margin-bottom: 1rem;"><i class="fas fa-book"></i> Subject Marks</h4>
                <div class="form-grid" id="subjectFieldsContainer">
                    ${subjectFieldsHtml}
                    ${obtainMarksHtml}
                </div>
            </div>

            <div id="formStatus" class="status-message"></div>

            <div class="form-actions">
                <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                <button type="submit" id="saveFormBtn" class="btn btn-primary">${isEdit ? '💾 Update' : '💾 Save'}</button>
            </div>
        </form>
    `;
}

// ================================================================
// OPEN FORM MODAL
// ================================================================
function openFormModal(record = null, isEdit = false) {
    selectedStudent = null;
    selectedStd = '';

    dom.formModalTitle.textContent = isEdit ? '✏️ Edit Exam Record' : '➕ Add Exam Record';
    dom.formModalBody.innerHTML = buildForm(record, isEdit);
    dom.formModal.classList.add('active');

    // Attach form events after render
    setTimeout(() => attachFormEvents(record, isEdit), 50);
}

function attachFormEvents(record, isEdit) {
    const form = document.getElementById('examForm');
    if (!form) return;

    // Student selector button
    const selectBtn = document.getElementById('selectStudentBtn');
    if (selectBtn) {
        selectBtn.addEventListener('click', function(e) {
            e.preventDefault();
            openStudentSelector();
        });
    }

    // Student name input - click to open selector
    const studentInput = document.getElementById('f_Student_Name');
    if (studentInput) {
        studentInput.addEventListener('click', function() {
            openStudentSelector();
        });
    }

    // Cancel button
    const cancelBtn = document.getElementById('cancelFormBtn');
    if (cancelBtn) {
        cancelBtn.addEventListener('click', function() {
            dom.formModal.classList.remove('active');
        });
    }

    // Form submit
    form.onsubmit = async function(e) {
        e.preventDefault();
        await handleFormSubmit(e, record, isEdit);
    };
}

// ================================================================
// OPEN STUDENT SELECTOR
// ================================================================
let studentSelectorResolve = null;

function openStudentSelector() {
    return new Promise((resolve) => {
        studentSelectorResolve = resolve;
        dom.studentSelectorModal.classList.add('active');
        dom.studentListContainer.innerHTML = `
            <div style="text-align:center;padding:20px;">
                <div class="spinner"></div>
                <p style="margin-top:10px;color:var(--text-muted);">Loading students...</p>
            </div>
        `;

        // Load students
        fetchAllStudents().then(studentsData => {
            allStudents = studentsData;
            renderStudentList('');
        }).catch(err => {
            dom.studentListContainer.innerHTML = `
                <div class="error-container">
                    <span class="error-icon">⚠️</span>
                    <p class="error-title">Failed to load students</p>
                    <p class="error-message">${escapeHtml(err.message)}</p>
                </div>
            `;
        });
    });
}

function renderStudentList(search = '') {
    const container = dom.studentListContainer;
    const searchLower = search.toLowerCase().trim();

    let allItems = [];
    for (const [sheet, students] of Object.entries(allStudents)) {
        students.forEach(s => {
            const fullName = s['Full Name'] || s['First Name'] || '';
            if (fullName) {
                allItems.push({
                    name: fullName,
                    std: sheet,
                    data: s
                });
            }
        });
    }

    if (searchLower) {
        allItems = allItems.filter(item => item.name.toLowerCase().includes(searchLower));
    }

    if (allItems.length === 0) {
        container.innerHTML = `
            <div class="empty-container">
                <span class="empty-icon">🔍</span>
                <p class="empty-title">${search ? 'No matching students found' : 'No students available'}</p>
            </div>
        `;
        return;
    }

    let html = '';
    allItems.forEach(item => {
        html += `
            <div class="student-item" data-name="${escapeHtml(item.name)}" data-std="${escapeHtml(item.std)}" data-data='${JSON.stringify(item.data).replace(/'/g, "&#39;")}'>
                <span><strong>${escapeHtml(item.name)}</strong></span>
                <span class="std-badge">${escapeHtml(item.std)}</span>
            </div>
        `;
    });

    container.innerHTML = html;

    container.querySelectorAll('.student-item').forEach(el => {
        el.addEventListener('click', function() {
            const name = this.getAttribute('data-name');
            const std = this.getAttribute('data-std');
            const dataStr = this.getAttribute('data-data');
            try {
                const data = JSON.parse(dataStr);
                selectedStudent = data;
                selectedStd = std;

                // Update form fields
                const nameInput = document.getElementById('f_Student_Name');
                const stdInput = document.getElementById('f_Std');
                if (nameInput) nameInput.value = name;
                if (stdInput) stdInput.value = std;

                // Update subject fields based on Std
                updateSubjectFields(std);

                dom.studentSelectorModal.classList.remove('active');
                if (studentSelectorResolve) {
                    studentSelectorResolve({ name, std, data });
                    studentSelectorResolve = null;
                }
            } catch (err) {
                console.error('Error parsing student data:', err);
            }
        });
    });
}

function updateSubjectFields(std) {
    const container = document.getElementById('subjectFieldsContainer');
    if (!container) return;

    const visibleSubjects = getVisibleSubjects(std);
    const allSubjectFields = container.querySelectorAll('.subject-field');

    allSubjectFields.forEach(field => {
        const subject = field.getAttribute('data-subject');
        if (visibleSubjects.includes(subject)) {
            field.style.display = '';
        } else {
            field.style.display = 'none';
            const input = field.querySelector('input');
            if (input) input.value = '';
        }
    });
}

// ================================================================
// HANDLE FORM SUBMIT
// ================================================================
async function handleFormSubmit(e, record, isEdit) {
    e.preventDefault();
    if (saveInProgress) return;
    saveInProgress = true;

    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);

    try {
        // Collect form data
        const formData = {};
        const inputs = document.querySelectorAll('#examForm input, #examForm select');
        inputs.forEach(input => {
            if (input.id && input.id.startsWith('f_')) {
                const key = input.id.replace('f_', '').replace(/_/g, ' ');
                const value = input.value;
                formData[key] = value;
            }
        });

        // Map back to original keys
        const mappedData = {
            'Date': formData['Date'] || '',
            'Student Name': formData['Student Name'] || '',
            'Std': formData['Std'] || '',
            'English': formData['English'] || '',
            'Hindi': formData['Hindi'] || '',
            'Marathi': formData['Marathi'] || '',
            'History & Civics': formData['History & Civics'] || '',
            'History': formData['History'] || '',
            'Political Science': formData['Political Science'] || '',
            'Geography': formData['Geography'] || '',
            'Science': formData['Science'] || '',
            'Science Part 1': formData['Science Part 1'] || '',
            'Science Part 2': formData['Science Part 2'] || '',
            'Maths': formData['Maths'] || '',
            'Maths Part 1': formData['Maths Part 1'] || '',
            'Maths Part 2': formData['Maths Part 2'] || '',
            'Obtain Marks': formData['Obtain Marks'] || '',
            'Total Marks': formData['Total Marks'] || ''
        };

        // Validate required fields
        if (!mappedData['Date'] || !mappedData['Student Name'] || !mappedData['Std']) {
            showToast('❌ Date, Student Name, and Std are required', 'error');
            saveInProgress = false;
            showSpinner(saveBtn, false);
            return;
        }

        // Prepare params
        const params = new URLSearchParams();
        params.append('action', isEdit ? 'update' : 'insert');
        params.append('spreadsheetId', CONFIG.SPREADSHEET_ID);
        params.append('sheetName', CONFIG.SHEET_NAME);

        if (isEdit) {
            let rowIdx = selectedRowIndex;
            if (!rowIdx && record) {
                rowIdx = record._rowIndex;
            }
            if (!rowIdx) {
                const found = allRecords.find(r =>
                    r['Student Name'] === mappedData['Student Name'] &&
                    r['Std'] === mappedData['Std']
                );
                if (found) rowIdx = found._rowIndex;
            }
            if (!rowIdx) {
                showToast('❌ Could not determine row to update', 'error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            params.append('rowIndex', rowIdx);
        }

        for (const [key, value] of Object.entries(mappedData)) {
            params.append(key, value);
        }

        const response = await fetch(CONFIG.SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });

        const result = await response.json();

        if (result.status === 'success') {
            showToast(`✅ Record ${isEdit ? 'updated' : 'saved'} successfully!`, 'success');
            dom.formModal.classList.remove('active');
            clearCache();
            await loadRecords(true);
            goToListView();
        } else {
            showToast('❌ Error: ' + (result.message || 'Unknown error'), 'error');
        }
    } catch (err) {
        console.error('Save error:', err);
        showToast('❌ Error: ' + err.message, 'error');
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

// ================================================================
// DELETE RECORD
// ================================================================
async function deleteRecord() {
    if (!currentViewRecord) return;

    const name = currentViewRecord['Student Name'] || 'this record';
    const rowIdx = currentViewRecord._rowIndex || selectedRowIndex;

    if (!rowIdx) {
        showToast('❌ Could not determine row to delete', 'error');
        return;
    }

    dom.confirmModalTitle.textContent = '⚠️ Confirm Delete';
    dom.confirmModalMsg.innerHTML = `
        Are you sure you want to delete the exam record for <strong>${escapeHtml(name)}</strong>?
        <br><br>This action cannot be undone.
    `;
    dom.confirmModal.classList.add('active');

    const okBtn = dom.confirmOkBtn;
    const cancelBtn = dom.confirmCancelBtn;
    const closeBtn = dom.closeConfirmModalBtn;

    const cleanup = () => {
        dom.confirmModal.classList.remove('active');
        okBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        closeBtn.removeEventListener('click', onCancel);
    };

    const onConfirm = async () => {
        cleanup();
        showSpinner(dom.deleteFromDetailBtn, true);

        try {
            const params = new URLSearchParams();
            params.append('action', 'delete');
            params.append('spreadsheetId', CONFIG.SPREADSHEET_ID);
            params.append('sheetName', CONFIG.SHEET_NAME);
            params.append('rowIndex', rowIdx);

            const response = await fetch(CONFIG.SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });

            const result = await response.json();

            if (result.status === 'success') {
                showToast('✅ Record deleted successfully!', 'success');
                clearCache();
                await loadRecords(true);
                goToListView();
            } else {
                showToast('❌ Delete failed: ' + (result.message || 'Unknown error'), 'error');
            }
        } catch (err) {
            showToast('❌ Error: ' + err.message, 'error');
        } finally {
            showSpinner(dom.deleteFromDetailBtn, false);
        }
    };

    const onCancel = () => cleanup();

    okBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    closeBtn.addEventListener('click', onCancel);
}

// ================================================================
// GLOBAL FUNCTIONS (for inline onclick)
// ================================================================
window.handleRetry = function() {
    clearCache();
    loadRecords(true);
};

window.handleClearCache = function() {
    clearCache();
    showToast('🧹 Cache cleared! Refreshing...', 'info');
    loadRecords(true);
};

window.openStudentSelector = openStudentSelector;
window.handleLogout = handleLogout;

// ================================================================
// INITIALIZATION
// ================================================================
function init() {
    const isAuthorized = checkAdminAuth();
    if (!isAuthorized) return;

    // Load data
    loadRecords();

    // Search input
    dom.searchInput.addEventListener('input', (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => renderTable(e.target.value), 300);
    });

    // Student search in selector
    dom.studentSearchInput.addEventListener('input', (e) => {
        renderStudentList(e.target.value);
    });

    // Refresh buttons
    dom.refreshBtn.addEventListener('click', () => {
        clearCache();
        loadRecords(true);
    });
    dom.mobileRefreshBtn.addEventListener('click', () => {
        clearCache();
        loadRecords(true);
    });

    // Add buttons
    dom.addNewBtn.addEventListener('click', () => openFormModal(null, false));
    dom.mobileAddBtn.addEventListener('click', () => openFormModal(null, false));

    // Back to list
    dom.backToListBtn.addEventListener('click', goToListView);

    // Edit from detail
    dom.editFromDetailBtn.addEventListener('click', () => {
        if (currentViewRecord) {
            openFormModal(currentViewRecord, true);
        } else {
            showToast('❌ No record to edit', 'error');
        }
    });

    // Delete from detail
    dom.deleteFromDetailBtn.addEventListener('click', deleteRecord);

    // Close modals
    dom.closeFormModalBtn.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
    });

    dom.closeStudentSelectorBtn.addEventListener('click', () => {
        dom.studentSelectorModal.classList.remove('active');
        if (studentSelectorResolve) {
            studentSelectorResolve(null);
            studentSelectorResolve = null;
        }
    });

    dom.cancelStudentSelectBtn.addEventListener('click', () => {
        dom.studentSelectorModal.classList.remove('active');
        if (studentSelectorResolve) {
            studentSelectorResolve(null);
            studentSelectorResolve = null;
        }
    });

    dom.closeConfirmModalBtn.addEventListener('click', () => {
        dom.confirmModal.classList.remove('active');
    });

    dom.confirmCancelBtn.addEventListener('click', () => {
        dom.confirmModal.classList.remove('active');
    });

    // Click outside modal to close
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                if (this.id === 'studentSelectorModal' && studentSelectorResolve) {
                    studentSelectorResolve(null);
                    studentSelectorResolve = null;
                }
            }
        });
    });

    // Background refresh every 5 minutes
    setInterval(() => {
        if (document.hidden) return;
        refreshInBackground();
    }, 5 * 60 * 1000);

    console.log('✅ Ujjwal Academy Exam Management System Loaded');
    console.log(`📊 Sheet: ${CONFIG.SHEET_NAME}`);
    console.log(`📚 Student Sheets: ${CONFIG.STUDENT_SHEETS.join(', ')}`);
    console.log('🔐 Session: ' + (isRememberMeActive() ? 'Remember Me Active (10 days)' : 'Session Only'));
}

// ================================================================
// START
// ================================================================
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(init, 100);
});
</script>
