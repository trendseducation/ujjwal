<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>💰 Staff Payment Portal | Smart Dashboard</title>
    
    <style>
        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            /* Light Mode Colors */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            /* Brand Colors */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            
            /* Table Colors */
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            
            /* Animation */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
        }

        /* App Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Page animations */
        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Cards */
        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        /* Headers */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-header .btn {
            flex-shrink: 0;
        }

        /* Search Section */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Search Input */
        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Table Styles */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .data-table th:first-child {
            border-top-left-radius: 12px;
        }

        .data-table th:last-child {
            border-top-right-radius: 12px;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            filter: brightness(1.05);
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }

        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* Action Row */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            display: flex;
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-box-large {
            max-width: 700px;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(85vh - 70px);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .field input[readonly] {
            background: var(--table-header-bg);
            cursor: pointer;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Message */
        .status-message {
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .status-success {
            background: var(--success);
            color: white;
        }

        .status-error {
            background: var(--danger);
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            .card-header {
                padding: 0.8rem 1rem;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                flex-wrap: nowrap;
            }
            
            .card-header h2 {
                font-size: 1rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                min-width: 0;
            }
            
            .card-header .btn {
                flex-shrink: 0;
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            
            .desktop-buttons {
                display: none;
            }
            
            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 12px;
                width: 100%;
            }
            
            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
                border-radius: 60px;
            }
            
            .search-section {
                padding: 1rem 1.2rem;
            }
            
            .search-wrapper {
                width: 100%;
            }
            
            .search-wrapper input {
                padding: 14px 20px;
                font-size: 0.95rem;
                border-radius: 60px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 12px;
                font-size: 0.7rem;
            }
            
            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            
            .modal-box {
                width: 95%;
                border-radius: 1.5rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 769px) {
            .mobile-buttons {
                display: none !important;
            }
        }

        .mobile-buttons {
            display: none;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }

        .mobile-buttons .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .mobile-buttons .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .mobile-buttons .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .mobile-buttons .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .mobile-buttons .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .mobile-buttons .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .mobile-buttons .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .mobile-buttons .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .mobile-buttons .btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--table-header-bg);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .table-wrapper::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        .table-wrapper,
        .modal-box {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--table-header-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .alert-popup {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--card-bg);
            border-left: 5px solid var(--primary);
            padding: 16px 24px;
            box-shadow: var(--shadow-xl);
            border-radius: 0 16px 16px 0;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out;
            color: var(--text-primary);
            max-width: 400px;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert-popup.success {
            border-left-color: var(--success);
        }

        .alert-popup.error {
            border-left-color: var(--danger);
        }

        /* Staff Search Modal Specific Styles */
        .staff-list-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .staff-list-item:hover {
            background: var(--table-row-hover);
            transform: translateX(4px);
        }

        .staff-list-item .name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .staff-list-item .icon {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .modal-search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
        }

        .modal-search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-icon-wrapper {
            position: relative;
        }

        .search-icon-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Transaction Method Specific Styles */
        .method-upi {
            border-color: #6366f1 !important;
        }

        .method-upi:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
        }

        .method-bank {
            border-color: #10b981 !important;
        }

        .method-bank:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1) !important;
        }

        .transaction-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .transaction-badge.cash {
            background: #f59e0b;
            color: white;
        }

        .transaction-badge.upi {
            background: #6366f1;
            color: white;
        }

        .transaction-badge.bank {
            background: #10b981;
            color: white;
        }

        /* Amount Display */
        .amount-display {
            font-weight: 700;
            color: var(--success);
        }

        .amount-display.negative {
            color: var(--danger);
        }

        /* Loading spinner in modal */
        .modal-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-light);
            gap: 12px;
        }

        .modal-spinner .spinner {
            width: 30px;
            height: 30px;
            border-width: 4px;
        }

        .modal-spinner span {
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ===================== PAGE 1 - LIST VIEW ===================== -->
    <div id="page1" class="page active-page">
        <div class="soft-card">
            <div class="card-header">
                <h2>💰 Staff Payment Portal</h2>
                
                <div class="desktop-buttons">
                    <button id="refreshBtn" class="btn btn-outline">
                        <span>⟳</span> Refresh
                    </button>
                    <button id="addNewBtn" class="btn btn-primary">
                        <span>+</span> New Payment
                    </button>
                </div>
            </div>
            
            <div class="search-section">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" 
                           placeholder="🔍 Search by Staff Name...">

                <div class="mobile-buttons">
                    <button id="mobileRefreshBtn" class="btn btn-outline">
                        <span>⟳</span> Refresh

                    <button id="mobileAddBtn" class="btn btn-primary">

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>Date</th>
                            <th>Staff Name</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" style="text-align:center;">
                                <div class="spinner"></div> Loading payment records...
                            </td>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===================== PAGE 2 - DETAIL VIEW ===================== -->
    <div id="page2" class="page">
        <div class="soft-card">
            <div class="card-header">
                <h2>💰 Payment Details</h2>
                <button id="backToPage1Btn" class="btn btn-outline">← Back</button>
            </div>
            
            <div id="detailsContainer" class="details-grid">
                <div class="loading-skeleton" style="height: 200px;"></div>
            </div>
            
            <div class="action-row">
                <button id="editFromDetailBtn" class="btn btn-primary">✏️ Edit</button>
                <button id="deleteFromDetailBtn" class="btn btn-danger">🗑 Delete</button>
            </div>
        </div>
    </div>

    <!-- ===================== GLOBAL MODAL ===================== -->
    <div id="globalModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 450px;">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
                <button class="close-modal" id="closeGlobalModal">×</button>
            </div>
            <div class="modal-body">
                <p id="modalMsg" style="font-size: 1rem; line-height: 1.5;"></p>
                <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                    <button id="confirmModalBtn" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== FORM MODAL ===================== -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-box modal-box-large">
            <div class="modal-header">
                <h3 id="formModalTitle">Add New Payment</h3>
                <button class="close-modal" id="closeFormModalBtn">×</button>
            </div>
            <div class="modal-body" id="formModalBody"></div>
        </div>
    </div>

    <!-- ===================== STAFF SEARCH MODAL ===================== -->
    <div id="staffSearchModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-users" style="margin-right: 10px;"></i> Select Staff Member</h3>
                <button class="close-modal" id="closeStaffSearchBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="search-icon-wrapper" style="margin-bottom: 16px;">
                    <span class="icon"><i class="fas fa-search"></i></span>
                    <input type="text" id="staffSearchInput" class="modal-search-input" placeholder="Type to search staff name..." oninput="filterStaffList(this.value)">
                </div>
                <div id="staffListContainer" style="max-height: 400px; overflow-y: auto;">
                    <div class="modal-spinner">
                        <div class="spinner"></div>
                        <span>Loading staff records...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== ALERT POPUP ===================== -->
    <div id="alertBox" class="alert-popup">Message...</div>

</div>

<script>
      // ================================================================
        // ADMIN AUTHENTICATION CHECK
        // ================================================================
        function checkAdminAuth() {
            const userType = sessionStorage.getItem('ujjwal_user_type');
            const user = sessionStorage.getItem('ujjwal_user');
            
            // If not logged in as admin, redirect to myaccount.html
            if (!user || userType !== 'admin') {
                // Redirect to myaccount.html for admin login
                window.location.href = '../../Study Material/My Account/myaccount.html';
                return false;
            }
            return true;
        }
  
    /* ======================== DARK MODE SYNC ======================== */
    function syncThemeWithParent() {
        const localTheme = localStorage.getItem('user-theme-preference');
        if (localTheme) {
            document.body.setAttribute('data-theme', localTheme);
            document.documentElement.setAttribute('data-theme', localTheme);
        } else {
            try {
                if (window.parent && window.parent.document.body) {
                    const parentTheme = window.parent.document.body.getAttribute('data-theme');
                    if (parentTheme) {
                        document.body.setAttribute('data-theme', parentTheme);
                        document.documentElement.setAttribute('data-theme', parentTheme);
                    }
                }
            } catch(e) { }
        }
    }

    window.addEventListener('DOMContentLoaded', syncThemeWithParent);
    window.addEventListener('storage', syncThemeWithParent);
    setInterval(syncThemeWithParent, 1000);
    
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'themeChange') {
            const newTheme = event.data.theme;
            if (newTheme) {
                document.body.setAttribute('data-theme', newTheme);
                document.documentElement.setAttribute('data-theme', newTheme);
            }
        }
    });

    /* ======================== CONFIGURATION ======================== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyg5EwL2WVufTR0Ks1mH9ZEHWwyuIBXshTvjANGhIq8zD7yZEmgOfimxdpB8pTjkqwq/exec";
    const SPREADSHEET_ID = "1_0oBxaAlvYw86pwIzNJw4-hSlmdxiCI0U17B2Zxr3YI";
    const STAFF_SHEET = "Staff Details";
    const PAYMENT_SHEET = "Staff Payment";

    // Use sessionStorage for page-specific data (clears when tab closes)
    const CACHE_KEY = "payment_cache";
    const STAFF_CACHE_KEY = "staff_registry_cache";
    const CACHE_TTL = 15 * 60 * 1000;

    /* ======================== GLOBAL STATE ======================== */
    let allPayments = [];
    let staffRegistry = [];
    let currentViewPayment = null;
    let selectedRowIndex = 2;
    let selectedSrNo = null;
    let searchDebounceTimer = null;
    let saveInProgress = false;
    let computedNextPaymentSrNo = 1;
    let isDataLoaded = false;
    let isStaffLoaded = false;
    let formHtmlCache = null;

    /* ======================== DOM REFS ======================== */
    const dom = {};

    function cacheDomElements() {
        dom.page1 = document.getElementById('page1');
        dom.page2 = document.getElementById('page2');
        dom.tableBody = document.getElementById('tableBody');
        dom.searchInput = document.getElementById('searchInput');
        dom.refreshBtn = document.getElementById('refreshBtn');
        dom.addNewBtn = document.getElementById('addNewBtn');
        dom.backBtn = document.getElementById('backToPage1Btn');
        dom.editBtn = document.getElementById('editFromDetailBtn');
        dom.deleteBtn = document.getElementById('deleteFromDetailBtn');
        dom.detailsContainer = document.getElementById('detailsContainer');
        dom.globalModal = document.getElementById('globalModal');
        dom.formModal = document.getElementById('formModal');
        dom.staffSearchModal = document.getElementById('staffSearchModal');
        dom.modalTitle = document.getElementById('modalTitle');
        dom.modalMsg = document.getElementById('modalMsg');
        dom.formModalTitle = document.getElementById('formModalTitle');
        dom.formModalBody = document.getElementById('formModalBody');
        dom.staffListContainer = document.getElementById('staffListContainer');
        dom.staffSearchInput = document.getElementById('staffSearchInput');
        dom.alertBox = document.getElementById('alertBox');
    }

    /* ======================== MOBILE BUTTON HANDLERS ======================== */
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');

    if (mobileRefreshBtn) {
        mobileRefreshBtn.addEventListener('click', function() {
            if (dom.refreshBtn) {
                dom.refreshBtn.click();
            } else {
                refreshData();
            }
        });
    }

    if (mobileAddBtn) {
        mobileAddBtn.addEventListener('click', function() {
            if (dom.addNewBtn) {
                dom.addNewBtn.click();
            } else {
                openAddModal();
            }
        });
    }

    /* ======================== UTILITY FUNCTIONS ======================== */
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function formatDateForDisplay(dateStr) {
        if (!dateStr) return '—';
        try {
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [year, month, day] = dateStr.split('-');
                return `${day}/${month}/${year}`;
            }
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '—';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${day}/${month}/${year}`;
        } catch { return '—'; }
    }

    function formatDateForSheet(dateStr) {
        if (!dateStr) return '';
        try {
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const [year, month, day] = dateStr.split('-');
                return `${day}/${month}/${year}`;
            }
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${day}/${month}/${year}`;
        } catch { return ''; }
    }

    function formatDateForInput(dateStr) {
        if (!dateStr) return '';
        try {
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
                const [day, month, year] = dateStr.split('/');
                return `${year}-${month}-${day}`;
            }
            return '';
        } catch { return ''; }
    }

    function getTodayDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function showToast(msg, type = 'info') {
        const box = dom.alertBox;
        box.textContent = msg;
        box.className = `alert-popup ${type}`;
        box.style.display = 'block';
        clearTimeout(box._timeout);
        box._timeout = setTimeout(() => { box.style.display = 'none'; }, 4500);
    }

    function showModal(msg, title = "Message", isConfirm = false, onConfirm = null) {
        dom.modalTitle.innerText = title;
        dom.modalMsg.innerHTML = msg;
        const confirmBtn = document.getElementById('confirmModalBtn');
        confirmBtn.onclick = () => {
            dom.globalModal.classList.remove('active');
            if (isConfirm && onConfirm) onConfirm();
        };
        dom.globalModal.classList.add('active');
    }

    function showSpinner(element, show) {
        if (!element) return;
        if (show) {
            element.disabled = true;
            const originalText = element.innerHTML;
            element.setAttribute('data-original-text', originalText);
            element.innerHTML = '<span class="spinner"></span> Loading...';
        } else {
            element.disabled = false;
            const original = element.getAttribute('data-original-text');
            if (original) element.innerHTML = original;
        }
    }

    /* ======================== OPTIMIZED DATA MANAGEMENT ======================== */
    function getCache(key) {
        try {
            const cached = sessionStorage.getItem(key);
            if (cached) {
                const { data, timestamp } = JSON.parse(cached);
                if (Date.now() - timestamp < CACHE_TTL) {
                    return data;
                }
            }
        } catch { }
        return null;
    }

    function setCache(key, data) {
        try {
            sessionStorage.setItem(key, JSON.stringify({
                data: data,
                timestamp: Date.now()
            }));
        } catch { }
    }

    /* ======================== BACKGROUND DATA LOADING ======================== */
    async function loadPayments(forceRefresh = false) {
        if (!forceRefresh) {
            const cached = getCache(CACHE_KEY);
            if (cached) {
                allPayments = cached;
                isDataLoaded = true;
                renderTable();
                // Background refresh
                refreshDataInBackground();
                return allPayments;
            }
        }

        try {
            const response = await fetch(`${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(PAYMENT_SHEET)}&_=${Date.now()}`);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                allPayments = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
                setCache(CACHE_KEY, allPayments);
                isDataLoaded = true;
                renderTable();
                return allPayments;
            }
            throw new Error(result.message || "Failed to load data");
        } catch (err) {
            showToast("❌ Failed to load records: " + err.message, "error");
            return [];
        }
    }

    async function refreshDataInBackground() {
        try {
            const response = await fetch(`${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(PAYMENT_SHEET)}&_=${Date.now()}`);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
                // Only update if data changed
                if (JSON.stringify(newData) !== JSON.stringify(allPayments)) {
                    allPayments = newData;
                    setCache(CACHE_KEY, allPayments);
                    renderTable();
                }
            }
        } catch (err) {
            // Silent fail for background refresh
            console.log("Background refresh failed:", err.message);
        }
    }

    /* ======================== STAFF REGISTRY WITH CACHE ======================== */
    async function loadStaffRegistry(forceRefresh = false) {
        if (!forceRefresh) {
            const cached = getCache(STAFF_CACHE_KEY);
            if (cached) {
                staffRegistry = cached;
                isStaffLoaded = true;
                renderStaffList(staffRegistry);
                return staffRegistry;
            }
        }

        try {
            const response = await fetch(`${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(STAFF_SHEET)}`);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                staffRegistry = result.data
                    .map(row => row["Staff Name"] || row["StaffName"])
                    .filter(name => !!name);
                setCache(STAFF_CACHE_KEY, staffRegistry);
                isStaffLoaded = true;
                renderStaffList(staffRegistry);
                return staffRegistry;
            }
            return [];
        } catch (err) {
            console.error("Failed to load staff registry:", err);
            return [];
        }
    }

    /* ======================== TABLE RENDERING ======================== */
    function renderTable(filter = "") {
        if (!dom.tableBody) return;
        
        const searchLower = filter.toLowerCase();
        let filtered = allPayments.filter(s => {
            const staffName = String(s['Staff Name'] || '').toLowerCase();
            return staffName.includes(searchLower);
        });

        if (!filtered.length) {
            dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">💰 No payment records found</td></tr>';
            return;
        }

        const fragment = document.createDocumentFragment();
        filtered.forEach((s, idx) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${escapeHtml(s['Sr. No'] || idx + 1)}</strong></td>
                <td>${escapeHtml(formatDateForDisplay(s['Date']))}</td>
                <td>${escapeHtml(s['Staff Name'] || '—')}</td>
                <td class="amount-display">₹${escapeHtml(parseFloat(s['Amount'] || 0).toFixed(2))}</td>
                <td><button class="view-action-btn" data-srno="${escapeHtml(s['Sr. No'] || '')}">👁️ View</button></td>
            `;
            fragment.appendChild(row);
        });

        dom.tableBody.innerHTML = '';
        dom.tableBody.appendChild(fragment);

        dom.tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const srNoVal = btn.getAttribute('data-srno');
                const found = allPayments.find(s => String(s['Sr. No']) === String(srNoVal));
                if (found) {
                    currentViewPayment = found;
                    showDetailView(found);
                }
            });
        });
    }

    /* ======================== DETAIL VIEW ======================== */
    function showDetailView(payment) {
        selectedSrNo = payment['Sr. No'];
        selectedRowIndex = payment._rowIndex || 2;

        const fields = [
            { label: "Sr. No", value: payment['Sr. No'] },
            { label: "Date", value: formatDateForDisplay(payment['Date']) },
            { label: "Staff Name", value: payment['Staff Name'] },
            { label: "Payment For", value: payment['Payment For'] },
            { label: "Transaction Method", value: payment['Transaction'] },
            { label: "UPI Transaction No", value: payment['UPI Trans No'] || '—' },
            { label: "Bank Transaction No", value: payment['Bank Trans No'] || '—' },
            { label: "Amount", value: `₹${parseFloat(payment['Amount'] || 0).toFixed(2)}` },
            { label: "Note", value: payment['Note'] || '—', full: true }
        ];

        const grid = dom.detailsContainer;
        grid.innerHTML = '';
        fields.forEach(f => {
            const card = document.createElement('div');
            card.className = `detail-card${f.full ? ' fullwidth' : ''}`;
            card.innerHTML = `
                <div class="detail-label">${f.label}</div>
                <div class="detail-value">${escapeHtml(String(f.value || '—'))}</div>
            `;
            grid.appendChild(card);
        });

        dom.page1.classList.remove('active-page');
        dom.page2.classList.add('active-page');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ======================== NAVIGATION ======================== */
    function goToListView() {
        dom.page2.classList.remove('active-page');
        dom.page1.classList.add('active-page');
    }

    /* ======================== CRUD OPERATIONS ======================== */
    function findRowIndexBySrNo(srNo) {
        const idx = allPayments.findIndex(s => String(s['Sr. No']) === String(srNo));
        return idx !== -1 ? allPayments[idx]._rowIndex : null;
    }

    async function deletePayment() {
        if (!currentViewPayment) return;
        const srNo = currentViewPayment['Sr. No'];
        const rowIdx = findRowIndexBySrNo(srNo);
        if (!rowIdx) {
            showModal("Row not found", "Error");
            return;
        }

        showModal(
            `⚠️ Are you sure you want to delete payment record <strong>${currentViewPayment['Payment For']}</strong> for ${currentViewPayment['Staff Name']}?<br><br>This action cannot be undone.`,
            "Confirm Delete",
            true,
            async () => {
                showSpinner(dom.deleteBtn, true);
                try {
                    const params = new URLSearchParams();
                    params.append("action", "delete");
                    params.append("spreadsheetId", SPREADSHEET_ID);
                    params.append("sheetName", PAYMENT_SHEET);
                    params.append("rowIndex", rowIdx);

                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: params.toString()
                    });
                    const result = await response.json();

                    if (result.status === "success") {
                        showToast("✅ Payment deleted successfully!", "success");
                        localStorage.removeItem(CACHE_KEY);
                        await loadPayments(true);
                        goToListView();
                    } else {
                        showModal("❌ Delete failed: " + result.message, "Error");
                    }
                } catch (err) {
                    showModal("❌ Error: " + err.message, "Error");
                } finally {
                    showSpinner(dom.deleteBtn, false);
                }
            }
        );
    }

    /* ======================== FORM BUILDER WITH CACHE ======================== */
    function buildFormHtml(payment = null, isEdit = false) {
        const def = {
            "Date": getTodayDate(),
            "Staff Name": "",
            "Payment For": "",
            "Transaction": "Cash",
            "UPI Trans No": "",
            "Bank Trans No": "",
            "Amount": "",
            "Note": ""
        };

        if (payment) {
            Object.keys(def).forEach(k => {
                if (payment[k] !== undefined) def[k] = payment[k];
            });
        }

        const dateValue = formatDateForInput(def["Date"]) || getTodayDate();

        return `
            <form id="paymentForm">
                <div class="form-grid">
                    <div class="field">
                        <label>Payment Date *</label>
                        <input type="date" id="fPaymentDate" value="${dateValue}" max="${getTodayDate()}" required>
                    </div>
                    
                    <div class="field">
    <label>Staff Name <span class="text-rose-500">*</span></label>
    <div style="position: relative; display: flex; gap: 10px; align-items: center;">
        <div style="position: relative; flex: 1;">
            <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);">
                <i class="fas fa-user-circle"></i>
            </span>
            <input type="text" id="fStaffName" value="${escapeHtml(def['Staff Name'])}" readonly required 
                   placeholder="Click the search button to find staff..." 
                   style="width: 100%; padding: 12px 16px 12px 40px; border: 2px solid var(--border-color); border-radius: 16px; 
                          background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem; 
                          cursor: default; transition: all var(--transition-fast); font-family: inherit;
                          ${def['Staff Name'] ? 'border-color: var(--success);' : ''}">
        </div>
        <button type="button" onclick="openStaffSearchModalForForm()" 
                class="btn btn-primary" 
                style="flex-shrink: 0; padding: 10px 18px; border-radius: 16px; font-size: 0.85rem; 
                       display: flex; align-items: center; gap: 8px; min-width: 100px; justify-content: center;">
            <i class="fas fa-search"></i> 
            <span>Select</span>
        </button>
    </div>
    ${def['Staff Name'] ? `<div style="margin-top: 4px; font-size: 0.7rem; color: var(--success);">
        <i class="fas fa-check-circle"></i> Staff selected
    </div>` : ''}
</div>
                    
                    <div class="field fullwidth">
                        <label>Payment For / Allocation Purpose *</label>
                        <input type="text" id="fPaymentFor" value="${escapeHtml(def['Payment For'])}" required 
                               placeholder="e.g., Monthly Salary, Exam Supervision, Bonus...">
                    </div>
                    
                    <div class="field">
                        <label>Amount (INR) *</label>
                        <input type="number" id="fAmount" value="${escapeHtml(def['Amount'])}" required 
                               min="1" step="any" placeholder="0.00">
                    </div>
                    
                    <div class="field">
                        <label>Transaction Method *</label>
                        <select id="fTransaction" onchange="toggleTransactionFields(this.value)" required>
                            <option value="Cash" ${def['Transaction'] === 'Cash' ? 'selected' : ''}>Cash</option>
                            <option value="UPI" ${def['Transaction'] === 'UPI' ? 'selected' : ''}>UPI Digital Payment</option>
                            <option value="Bank Transfer" ${def['Transaction'] === 'Bank Transfer' ? 'selected' : ''}>Direct Bank Transfer</option>
                        </select>
                    </div>
                    
                    <div class="field" id="upiFieldContainer" style="${def['Transaction'] === 'UPI' ? '' : 'display: none;'}">
                        <label style="color: #6366f1;">UPI Transaction No *</label>
                        <input type="text" id="fUpiTransNo" value="${escapeHtml(def['UPI Trans No'])}" 
                               placeholder="Enter 12-digit UPI Ref/TXN No..." 
                               class="method-upi" ${def['Transaction'] === 'UPI' ? 'required' : ''}>
                    </div>
                    
                    <div class="field" id="bankFieldContainer" style="${def['Transaction'] === 'Bank Transfer' ? '' : 'display: none;'}">
                        <label style="color: #10b981;">Bank Transaction No / UTR *</label>
                        <input type="text" id="fBankTransNo" value="${escapeHtml(def['Bank Trans No'])}" 
                               placeholder="Enter Bank UTR Reference code..." 
                               class="method-bank" ${def['Transaction'] === 'Bank Transfer' ? 'required' : ''}>
                    </div>
                    
                    <div class="field fullwidth">
                        <label>Notes / Remarks</label>
                        <textarea id="fNote" rows="2" placeholder="Append transaction annotations or payment descriptors here...">${escapeHtml(def['Note'])}</textarea>
                    </div>
                </div>

                <div id="formStatus" class="status-message"></div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                    <button type="submit" id="saveFormBtn" class="btn btn-primary">${isEdit ? "💾 Update Payment" : "💾 Save Payment"}</button>
                </div>
            </form>
        `;
    }

    /* ======================== TRANSACTION TOGGLE ======================== */
    function toggleTransactionFields(method) {
        const upiContainer = document.getElementById('upiFieldContainer');
        const bankContainer = document.getElementById('bankFieldContainer');
        const upiInput = document.getElementById('fUpiTransNo');
        const bankInput = document.getElementById('fBankTransNo');

        if (method === 'UPI') {
            upiContainer.style.display = 'block';
            bankContainer.style.display = 'none';
            if (upiInput) upiInput.required = true;
            if (bankInput) bankInput.required = false;
            if (bankInput) bankInput.value = '';
        } else if (method === 'Bank Transfer') {
            upiContainer.style.display = 'none';
            bankContainer.style.display = 'block';
            if (upiInput) upiInput.required = false;
            if (bankInput) bankInput.required = true;
            if (upiInput) upiInput.value = '';
        } else {
            upiContainer.style.display = 'none';
            bankContainer.style.display = 'none';
            if (upiInput) upiInput.required = false;
            if (bankInput) bankInput.required = false;
            if (upiInput) upiInput.value = '';
            if (bankInput) bankInput.value = '';
        }
    }

    /* ======================== STAFF SEARCH MODAL ======================== */
    function openStaffSearchModalForForm() {
        const modal = dom.staffSearchModal;
        modal.classList.add('active');
        dom.staffSearchInput.value = '';
        
        // Use cached staff list or load
        if (isStaffLoaded && staffRegistry.length > 0) {
            renderStaffList(staffRegistry);
        } else {
            dom.staffListContainer.innerHTML = `
                <div class="modal-spinner">
                    <div class="spinner"></div>
                    <span>Loading staff records...</span>
                </div>
            `;
            loadStaffRegistry();
        }
        
        setTimeout(() => dom.staffSearchInput.focus(), 100);
    }

    function closeStaffSearchModal() {
        dom.staffSearchModal.classList.remove('active');
    }

    function renderStaffList(list) {
        const container = dom.staffListContainer;
        if (!list || list.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-light);">
                    <i class="fas fa-users" style="font-size: 2rem; display: block; margin-bottom: 12px;"></i>
                    No staff members found
                </div>
            `;
            return;
        }

        container.innerHTML = list.map(name => `
            <div class="staff-list-item" onclick="selectStaffMember('${name.replace(/'/g, "\\'")}')">
                <span class="name"><i class="fas fa-user-circle" style="margin-right: 10px; color: var(--primary);"></i>${escapeHtml(name)}</span>
                <span class="icon"><i class="fas fa-chevron-right"></i></span>
            </div>
        `).join('');
    }

    function filterStaffList(query) {
        const filtered = staffRegistry.filter(name => 
            name.toLowerCase().includes(query.toLowerCase().trim())
        );
        renderStaffList(filtered);
    }

    function selectStaffMember(name) {
        document.getElementById('fStaffName').value = name;
        closeStaffSearchModal();
    }

    /* ======================== FORM EVENTS ======================== */
    function attachFormEvents(isEdit, rowIdx) {
        const form = document.getElementById('paymentForm');
        if (!form) {
            console.error("❌ Form not found!");
            return;
        }

        // Initialize transaction fields
        const transactionSelect = document.getElementById('fTransaction');
        if (transactionSelect) {
            toggleTransactionFields(transactionSelect.value);
        }

        // Cancel button
        const cancelBtn = document.getElementById('cancelFormBtn');
        if (cancelBtn) {
            cancelBtn.addEventListener('click', () => {
                dom.formModal.classList.remove('active');
            });
        }

        // Close staff search modal
        document.getElementById('closeStaffSearchBtn')?.addEventListener('click', closeStaffSearchModal);
        
        // Close staff search modal on overlay click
        dom.staffSearchModal.addEventListener('click', function(e) {
            if (e.target === this) {
                closeStaffSearchModal();
            }
        });

        // Form submit
        form.onsubmit = (e) => {
            handleFormSubmit(e, isEdit, rowIdx);
        };
    }

    /* ======================== FORM SUBMIT ======================== */
    async function handleFormSubmit(e, isEdit, rowIdx) {
        e.preventDefault();
        if (saveInProgress) return;
        saveInProgress = true;

        const saveBtn = document.getElementById('saveFormBtn');
        showSpinner(saveBtn, true);
        document.getElementById('formStatus').style.display = 'none';

        try {
            const transactionMethod = document.getElementById('fTransaction').value;
            const rawDateValue = document.getElementById('fPaymentDate').value;

            const formData = {
                "Date": rawDateValue,
                "Staff Name": document.getElementById('fStaffName')?.value || "",
                "Payment For": document.getElementById('fPaymentFor')?.value || "",
                "Transaction": transactionMethod,
                "UPI Trans No": transactionMethod === "UPI" ? document.getElementById('fUpiTransNo')?.value || "" : "",
                "Bank Trans No": transactionMethod === "Bank Transfer" ? document.getElementById('fBankTransNo')?.value || "" : "",
                "Amount": parseFloat(document.getElementById('fAmount')?.value || 0).toFixed(2),
                "Note": document.getElementById('fNote')?.value || ""
            };

            // Validate required fields
            const required = ['Staff Name', 'Payment For', 'Amount'];
            for (const field of required) {
                if (!formData[field] || formData[field].trim() === '') {
                    showToast(`❌ ${field} is required`, "error");
                    saveInProgress = false;
                    showSpinner(saveBtn, false);
                    return;
                }
            }

            if (parseFloat(formData['Amount']) <= 0) {
                showToast("❌ Amount must be greater than 0", "error");
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }

            const params = new URLSearchParams();
            params.append("action", isEdit ? "update" : "insert");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", PAYMENT_SHEET);
            if (isEdit && rowIdx) params.append("rowIndex", rowIdx);

            if (!isEdit) {
                const nextSrNo = allPayments.length + 1;
                params.append("Sr. No", nextSrNo);
            }

            for (const [key, value] of Object.entries(formData)) {
                params.append(key, value);
            }

            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params.toString()
            });

            const result = await response.json();

            if (result.status === "success") {
                showToast(`✅ Payment ${isEdit ? 'updated' : 'saved'} successfully!`, "success");
                setCache(CACHE_KEY, null); // Invalidate cache
                dom.formModal.classList.remove('active');
                await loadPayments(true);
                goToListView();
            } else {
                showToast("❌ Error: " + result.message, "error");
            }
        } catch (err) {
            console.error("Submission error:", err);
            showToast("❌ Error: " + err.message, "error");
        } finally {
            saveInProgress = false;
            showSpinner(saveBtn, false);
        }
    }

    /* ======================== OPTIMIZED MODAL OPEN FUNCTIONS ======================== */
    let formHtmlCacheData = null;
    let formHtmlCacheEdit = null;

    function getCachedFormHtml(isEdit, payment = null) {
        if (isEdit && payment) {
            // For edit mode, always regenerate with payment data
            return buildFormHtml(payment, true);
        }
        
        // For add mode, use cached form if available
        if (!isEdit && formHtmlCacheData) {
            return formHtmlCacheData;
        }
        
        const html = buildFormHtml(null, false);
        if (!isEdit) {
            formHtmlCacheData = html;
        }
        return html;
    }

    async function openAddModal() {
        // Show modal immediately with cached form
        dom.formModal.classList.add('active');
        dom.formModalTitle.textContent = "💰 Add New Payment";
        
        // Use cached form HTML for instant display
        dom.formModalBody.innerHTML = getCachedFormHtml(false);
        
        // Attach events after DOM is ready
        setTimeout(() => {
            attachFormEvents(false, null);
        }, 50);
        
        // Load staff registry in background if not loaded
        if (!isStaffLoaded) {
            loadStaffRegistry();
        }
        
        // Preload staff registry if needed (background)
        if (staffRegistry.length === 0 && !isStaffLoaded) {
            setTimeout(() => loadStaffRegistry(), 100);
        }
    }

    async function openEditModal() {
        if (!currentViewPayment) {
            showModal("No payment selected", "Error");
            return;
        }
        
        const rowIdx = findRowIndexBySrNo(currentViewPayment['Sr. No']);
        if (!rowIdx) { 
            showModal("Row error", "Error"); 
            return; 
        }

        dom.formModal.classList.add('active');
        dom.formModalTitle.textContent = "✏️ Edit Payment";
        
        // Generate form with payment data
        dom.formModalBody.innerHTML = buildFormHtml(currentViewPayment, true);
        
        setTimeout(() => {
            attachFormEvents(true, rowIdx);
        }, 50);
    }

    /* ======================== INITIALIZATION ======================== */
    function init() {
	      // 1. Check admin authentication FIRST
           const isAuthorized = checkAdminAuth();
           if (!isAuthorized) return; // Redirect happens inside checkAdminAuth
	
        cacheDomElements();

        // Show loading state
        dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><div class="spinner"></div> Loading payment records...</td></tr>';
        
        // Load data with caching
        loadPayments();
        
        // Preload staff registry in background
        setTimeout(() => loadStaffRegistry(), 100);

        // Event listeners
        dom.searchInput?.addEventListener('input', (e) => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => renderTable(e.target.value), 300);
        });

        dom.refreshBtn?.addEventListener('click', async () => {
            showSpinner(dom.refreshBtn, true);
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(STAFF_CACHE_KEY);
            showToast("🔄 Syncing with Google Sheets...", "info");
            try {
                await loadPayments(true);
                await loadStaffRegistry(true);
                showToast("✅ Data refreshed successfully!", "success");
            } catch (err) {
                showToast("❌ Refresh failed: " + err.message, "error");
            } finally {
                showSpinner(dom.refreshBtn, false);
            }
        });

        dom.addNewBtn?.addEventListener('click', openAddModal);
        dom.backBtn?.addEventListener('click', goToListView);
        dom.editBtn?.addEventListener('click', openEditModal);
        dom.deleteBtn?.addEventListener('click', deletePayment);

        document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal.classList.remove('active'));
        document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
            dom.formModal.classList.remove('active');
        });

        window.onclick = (e) => {
            if (e.target.classList?.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        };

        // Background refresh every 5 minutes
        setInterval(() => {
            refreshDataInBackground();
        }, 5 * 60 * 1000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
