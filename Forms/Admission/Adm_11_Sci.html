<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>📚 Ujjwal Academy | Smart Dashboard</title>
    
    <!-- Cropper.js for image editing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            /* Light Mode Colors */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            /* Brand Colors */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            
            /* Table Colors */
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            
            /* Animation */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
        }

        /* App Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Page animations */
        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Cards */
        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        /* Headers */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Search Section */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Search Input */
        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Table Styles */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .data-table th:first-child {
            border-top-left-radius: 12px;
        }

        .data-table th:last-child {
            border-top-right-radius: 12px;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            filter: brightness(1.05);
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }

        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* Action Row */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* Profile Image */
        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 2rem 2rem 0;
            flex-wrap: wrap;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 1.2rem;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: var(--shadow-lg);
            background: var(--table-header-bg);
        }

        .profile-info h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            display: flex;
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(85vh - 70px);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        /* Image Upload Section */
        .image-section {
            border: 2px dashed var(--border-color);
            padding: 20px;
            border-radius: 1.2rem;
            text-align: center;
            margin: 20px 0;
            background: var(--table-header-bg);
            transition: all var(--transition-fast);
        }

        .image-section:hover {
            border-color: var(--primary);
        }

        .image-section label {
            cursor: pointer;
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }

        #preview-container {
            max-width: 400px;
            margin: 15px auto;
            display: none;
        }

        #image-to-crop {
            max-width: 100%;
            display: block;
        }

        .crop-controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: var(--table-header-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }

        .btn-tool:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        #image-status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Message */
        .status-message {
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .status-success {
            background: var(--success);
            color: white;
        }

        .status-error {
            background: var(--danger);
            color: white;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            text-decoration: none;
            border: none;
            font-size: 2rem;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            background: var(--primary-dark);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            .card-header {
                padding: 1rem 1.2rem;
                flex-direction: row;
                align-items: flex-start;
                gap: 8px;
            }
            
            .card-header h2 {
                font-size: 1rem;
                width: 100%;
            }
            
            /* Hide Desktop Buttons on Mobile */
            .desktop-buttons {
                display: none;
            }
            
            /* Show Mobile Buttons */
            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 12px;
                width: 100%;
            }
            
            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
                border-radius: 60px;
            }
            
            .search-section {
                padding: 1rem 1.2rem;
            }
            
            .search-wrapper {
                width: 100%;
            }
            
            .search-wrapper input {
                padding: 14px 20px;
                font-size: 0.95rem;
                border-radius: 60px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 12px;
                font-size: 0.7rem;
            }
            
            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            
            .modal-box {
                width: 95%;
                border-radius: 1.5rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .profile-wrapper {
                padding: 1rem;
                flex-direction: column;
                text-align: center;
            }
            
            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        /* Desktop - Hide Mobile Buttons */
        @media (min-width: 769px) {
            .mobile-buttons {
                display: none !important;
            }
        }

        /* Mobile Buttons Container */
        .mobile-buttons {
            display: none;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }

        /* Button Styles for Mobile */
        .mobile-buttons .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .mobile-buttons .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .mobile-buttons .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .mobile-buttons .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .mobile-buttons .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .mobile-buttons .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .mobile-buttons .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .mobile-buttons .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading state for mobile buttons */
        .mobile-buttons .btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--table-header-bg);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Hide scrollbars but keep scrolling */
        .table-wrapper::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        .table-wrapper,
        .modal-box {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Loading Skeleton */
        .loading-skeleton {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--table-header-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;

/* ======================== UTILITY FUNCTIONS ======================== */
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function formatDateForDisplay(dateStr) {
    if (!dateStr) return '—';
    try {
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
            return dateStr;
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '—';
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${day}/${month}/${year}`;
    } catch { 
        return '—'; 
    }
}

function formatDateForSheet(dateStr) {
    if (!dateStr) return '';
    try {
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
            return dateStr;
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${day}/${month}/${year}`;
    } catch { 
        return ''; 
    }
}

function formatDateForInput(dateStr) {

    try {
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            return dateStr;
        }
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
            const [day, month, year] = dateStr.split('/');

        }
        return '';
    } catch {

    }
}

function getTodayDate() {

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function getAcademicYear() {

    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    return month >= 4 ? `${year}-${year + 1}` : `${year - 1}-${year}`;
}

/* ======================== CACHE MANAGEMENT ======================== */

function clearAllCaches() {
    try {
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(CACHE_VERSION_KEY);
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (key.includes('admissions') || key.includes('cache'))) {
                keysToRemove.push(key);
            }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        console.log('✅ All caches cleared');
        return true;
    } catch (e) {
        console.error('Cache clear error:', e);
        return false;
    }
}

function getCache() {
    try {
        const cachedVersion = localStorage.getItem(CACHE_VERSION_KEY);
        if (cachedVersion !== CURRENT_CACHE_VERSION) {
            console.log('🔄 Cache version mismatch, clearing old cache');
            localStorage.removeItem(CACHE_KEY);
            localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
            return null;
        }

        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, timestamp, sheetName } = JSON.parse(cached);
            // Verify the cache belongs to the current sheet
            if (sheetName !== SHEET_NAME) {
                console.log(`🔄 Sheet name mismatch: cached="${sheetName}", current="${SHEET_NAME}"`);
                localStorage.removeItem(CACHE_KEY);
                return null;
            }
            if (Date.now() - timestamp < CACHE_TTL) {
                console.log(`📦 Using cached data for sheet: ${SHEET_NAME}`);
                return data;
            }
            localStorage.removeItem(CACHE_KEY);
        }
    } catch (e) {
        console.error('Cache read error:', e);
        localStorage.removeItem(CACHE_KEY);
    }
    return null;
}

function setCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data: data,
            timestamp: Date.now(),
            sheetName: SHEET_NAME
        }));
        localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
        console.log(`💾 Cached ${data.length} records for sheet: ${SHEET_NAME}`);
    } catch (e) {
        console.error('Cache write error:', e);
    }
}

function manualClearCache() {
    clearAllCaches();
    showToast("🧹 Cache cleared! Refresh to load fresh data.", "success");
    console.log('✅ Manual cache cleared. Refresh the page to load fresh data.');
}

function forceRefreshData() {
    showToast("🔄 Forcing data refresh...", "info");
    clearAllCaches();
    showLoadingSpinner(true, 'Force refreshing data...');
    setTimeout(() => loadStudents(true), 300);
}

/* ======================== DATA MANAGEMENT ======================== */

async function loadStudents(forceRefresh = false) {
    const tableBody = dom.tableBody;
    if (!tableBody) return [];

    // Show loading spinner
    showLoadingSpinner(true, forceRefresh ? 'Refreshing data...' : 'Loading students from Google Sheets...');

    try {
        // Try cache first (only if not force refresh)
        if (!forceRefresh) {
            const cached = getCache();
            if (cached && Array.isArray(cached) && cached.length > 0) {
                allStudents = cached;
                renderTable();
                showToast(`📦 Loaded ${allStudents.length} students from cache`, "info");
                // Still refresh in background for fresh data
                setTimeout(() => refreshDataInBackground(), 2000);
                isLoading = false;
                return allStudents;
            }
        }

        // Fetch fresh data from API
        const response = await fetch(`${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`);
        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
            allStudents = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(allStudents);
            renderTable();
            showToast(`✅ Loaded ${allStudents.length} students from Google Sheets`, "success");
            isLoading = false;
            return allStudents;
        } else {
            throw new Error(result.message || "Failed to load data");
        }
    } catch (err) {
        console.error('Load students error:', err);
        
        // Try to show cached data if available (even if expired)
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const { data, sheetName } = JSON.parse(cached);
                if (data && Array.isArray(data) && data.length > 0 && sheetName === SHEET_NAME) {
                    allStudents = data;
                    renderTable();
                    showToast("⚠️ Using cached data (offline mode)", "warning");
                    isLoading = false;
                    return allStudents;
                }
            }
        } catch (e) {}

        // Show error state with retry button
        showErrorState(err.message);
        isLoading = false;
        return [];
    }
}

async function refreshDataInBackground() {
    try {
        const response = await fetch(`${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`);
        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            
            const currentDataStr = JSON.stringify(allStudents);
            const newDataStr = JSON.stringify(newData);
            
            if (currentDataStr !== newDataStr) {
                allStudents = newData;
                setCache(allStudents);
                renderTable();
                showToast("🔄 Data updated in background", "info");
            }
        }
    } catch (err) {
        console.log('Background refresh failed:', err.message);
    }
}

async function refreshData() {
    const refreshBtn = dom.refreshBtn;
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    
    // Show spinner on both buttons
    showSpinner(refreshBtn, true);
    if (mobileRefreshBtn) {
        mobileRefreshBtn.disabled = true;
        mobileRefreshBtn.innerHTML = '<span class="spinner"></span> Loading...';
    }
    
    // Show loading spinner in table
    showLoadingSpinner(true, 'Refreshing data...');
    
    try {
        clearAllCaches();
        await loadStudents(true);
        showToast("✅ Data refreshed successfully!", "success");
    } catch (err) {
        showToast("❌ Refresh failed: " + err.message, "error");
    } finally {
        showSpinner(refreshBtn, false);
        if (mobileRefreshBtn) {
            mobileRefreshBtn.disabled = false;
            mobileRefreshBtn.innerHTML = '<span>⟳</span> Refresh';
        }
    }
}

/* ======================== TABLE RENDERING ======================== */

function renderTable(filter = "") {
    if (!dom.tableBody) return;
    
    if (!allStudents || allStudents.length === 0) {
        showEmptyState('No students found', 'Click "Add Admission" to add your first student');
        return;
    }
    
    const searchLower = filter.toLowerCase();
    let filtered = allStudents.filter(s => {
        const fullName = combineFullName(
            s['First Name'] || '', 
            s['Middle Name'] || '', 
            s['Last Name'] || ''
        ).toLowerCase();
        const mobile = String(s['Personal Mob No'] || '').toLowerCase();
        const admIn = String(s['Adm In'] || '').toLowerCase();
        return fullName.includes(searchLower) || mobile.includes(searchLower) || admIn.includes(searchLower);
    });

    if (!filtered.length) {
        showEmptyState('No matching students found', 'Try adjusting your search');
        return;
    }

    const fragment = document.createDocumentFragment();
    filtered.forEach((s, idx) => {
        const row = document.createElement('tr');
        const fullName = combineFullName(
            s['First Name'] || '', 
            s['Middle Name'] || '', 
            s['Last Name'] || ''
        ) || '—';
        row.innerHTML = `
            <td><strong>${idx + 1}</strong></td>
            <td>${escapeHtml(fullName)}</td>
            <td>${escapeHtml(s['Personal Mob No'] || '—')}</td>
            <td><button class="view-action-btn" data-adm="${escapeHtml(s['Adm In'] || '')}">👁️ View</button></td>
        `;
        fragment.appendChild(row);
    });

    dom.tableBody.innerHTML = '';
    dom.tableBody.appendChild(fragment);

    dom.tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const admVal = btn.getAttribute('data-adm');
            const found = allStudents.find(s => String(s['Adm In']) === String(admVal));
            if (found) {
                currentViewStudent = found;
                showDetailView(found);
            }
        });
    });
}

/* ======================== CRUD OPERATIONS ======================== */

function findRowIndexByAdmIn(admIn) {
    const idx = allStudents.findIndex(s => String(s['Adm In']) === String(admIn));
    return idx !== -1 ? allStudents[idx]._rowIndex : null;
}

async function deleteStudent() {
    if (!currentViewStudent) return;
    const admIn = currentViewStudent['Adm In'];
    const rowIdx = findRowIndexByAdmIn(admIn);
    if (!rowIdx) {
        showModal("Row not found", "Error");
        return;
    }

    showModal(
        `⚠️ Are you sure you want to delete student <strong>${dom.profileName.textContent}</strong> (Adm In: ${admIn})?<br><br>This action cannot be undone and will remove all associated data.`,
        "Confirm Delete",
        true,
        async () => {
            showSpinner(dom.deleteBtn, true);
            try {
                const params = new URLSearchParams();
                params.append("action", "delete");
                params.append("spreadsheetId", SPREADSHEET_ID);
                params.append("sheetName", SHEET_NAME);
                params.append("rowIndex", rowIdx);

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("✅ Student deleted successfully!", "success");
                    localStorage.removeItem(CACHE_KEY);
                    goToListView();
                } else {
                    showModal("❌ Delete failed: " + result.message, "Error");
                }
            } catch (err) {
                showModal("❌ Error: " + err.message, "Error");
            } finally {
                showSpinner(dom.deleteBtn, false);
            }
        }
    );
}

                <label style="cursor: pointer; color: var(--primary); font-weight: bold;">
                    📷 Click to Upload Student Image
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </label>
                <div id="preview-container">
                    <img id="image-to-crop">
                    <div class="crop-controls">
                        <button type="button" class="btn-tool" onclick="rotateLeft()">↺ Rotate Left</button>
                        <button type="button" class="btn-tool" onclick="rotateRight()">↻ Rotate Right</button>
                        <button type="button" class="btn-tool" onclick="applyCrop()">✓ Apply Crop</button>
                    </div>
                </div>
                <div id="image-status" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-secondary);"></div>
            </div>

            <div id="formStatus" class="status-message"></div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                <button type="submit" id="saveFormBtn" class="btn btn-primary">${isEdit ? "💾 Update Student" : "💾 Save Student"}</button>
            </div>
        </form>
    `;
}

/* ======================== CROPPER FUNCTIONS ======================== */

function rotateLeft() { if (cropper) cropper.rotate(-90); }
function rotateRight() { if (cropper) cropper.rotate(90); }

function applyCrop() {
    if (!cropper) {
        document.getElementById('image-status').textContent = "❌ No image loaded to crop.";
        return;
    }
    try {
        const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
        if (!canvas) throw new Error("Could not crop image");
        
        const base64Data = canvas.toDataURL('image/jpeg', 0.9);
        croppedImageData = {
            base64Data: base64Data.split(',')[1],
            fileName: `student_photo_${Date.now()}.jpg`,
            mimeType: 'image/jpeg'
        };
        
        document.getElementById('image-status').textContent = "✅ Image cropped and ready!";
        document.getElementById('image-status').style.color = "var(--success)";
        
        const preview = document.createElement('img');
        preview.src = base64Data;
        preview.style.maxWidth = "100px";
        preview.style.marginTop = "10px";
        preview.style.borderRadius = "8px";
        preview.style.border = "2px solid var(--primary)";
        preview.id = 'cropped-preview';
        
        const oldPreview = document.getElementById('cropped-preview');
        if (oldPreview) oldPreview.remove();
        document.getElementById('preview-container').appendChild(preview);
        
    } catch (error) {
        document.getElementById('image-status').textContent = "❌ Failed to crop image.";
        document.getElementById('image-status').style.color = "var(--danger)";
    }
}

/* ======================== FORM EVENTS ======================== */

function attachFormEvents(isEdit, rowIdx) {
    const form = document.getElementById('studentForm');
    if (!form) return;

    const imageInput = document.getElementById('imageInput');
    const imageToCrop = document.getElementById('image-to-crop');
    const previewContainer = document.getElementById('preview-container');
    const imageStatus = document.getElementById('image-status');

    if (imageInput) {
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    imageStatus.textContent = "❌ Image too large! Max 5MB.";
                    imageStatus.style.color = "var(--danger)";
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    imageStatus.textContent = "❌ Please select a valid image.";
                    imageStatus.style.color = "var(--danger)";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageToCrop.src = event.target.result;
                    previewContainer.style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 1,
                        responsive: true
                    });
                    imageStatus.textContent = "✅ Image loaded. Crop if needed.";
                    imageStatus.style.color = "var(--success)";
                    croppedImageData = null;
                };
                reader.readAsDataURL(file);
            }
        });
    }

    document.getElementById('cancelFormBtn')?.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
        if (cropper) { cropper.destroy(); cropper = null; }
    });

    form.onsubmit = (e) => handleFormSubmit(e, isEdit, rowIdx);
}

/* ======================== FORM SUBMIT ======================== */

async function handleFormSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;
    saveInProgress = true;

    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);
    document.getElementById('formStatus').style.display = 'none';

    try {
        const firstName = document.getElementById('fFirstName')?.value || "";
        const middleName = document.getElementById('fMiddleName')?.value || "";
        const lastName = document.getElementById('fLastName')?.value || "";
        
        const fullName = combineFullName(firstName, middleName, lastName);
        
        const formData = {
            "Academic Year": document.getElementById('fAcademicYear')?.value || "",
            "Date of Adm": document.getElementById('fDateOfAdm')?.value || "",
            "First Name": firstName,
            "Middle Name": middleName,
            "Last Name": lastName,
            "Full Name": fullName,
            "Father Name": document.getElementById('fFatherName')?.value || "",
            "Mother Name": document.getElementById('fMotherName')?.value || "",
            "Father Occupation": document.getElementById('fFatherOccupation')?.value || "",
            "Mother Occupation": document.getElementById('fMotherOccupation')?.value || "",
            "Adm In": document.getElementById('fAdmIn')?.value || "",
            "Birth Date": document.getElementById('fBirthDate')?.value || "",
            "Gender": document.getElementById('fGender')?.value || "",
            "Email Id": document.getElementById('fEmail')?.value || "",
            "Personal Mob No": document.getElementById('fPersonalMobile')?.value || "",
            "Parent Mob No": document.getElementById('fParentMobile')?.value || "",
            "Last School Name": document.getElementById('fLastSchool')?.value || "",
            "Last Session Marks (%)": document.getElementById('fMarks')?.value || "",
            "Weight": document.getElementById('fWeight')?.value || "",
            "Height": document.getElementById('fHeight')?.value || "",
            "Address": document.getElementById('fAddress')?.value || "",
            "Note": document.getElementById('fNote')?.value || ""
        };

        const required = ['First Name', 'Last Name', 'Father Name', 'Mother Name', 'Adm In', 'Date of Adm', 'Birth Date', 'Email Id', 'Personal Mob No', 'Parent Mob No'];
        for (const field of required) {
            if (!formData[field] || formData[field].trim() === '') {
                showToast(`❌ ${field} is required`, "error");
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
        }

        const params = new URLSearchParams();
        params.append("action", isEdit ? "update" : "insert");
        params.append("spreadsheetId", SPREADSHEET_ID);
        params.append("sheetName", SHEET_NAME);
        if (isEdit && rowIdx) params.append("rowIndex", rowIdx);
        if (DRIVE_FOLDER_ID) params.append("driveFolderId", DRIVE_FOLDER_ID);

        for (const [key, value] of Object.entries(formData)) {
            if (key === "Date of Adm" || key === "Birth Date") {
                const formattedDate = formatDateForSheet(value);
                params.append(key, formattedDate);
            } else if (key === "Full Name") {
                if (value && value.trim()) {
                    params.append(key, value);
                }
            } else {
                params.append(key, value);
            }
        }

        if (croppedImageData && croppedImageData.base64Data) {
            params.append("fileCount", "1");
            params.append("fileData1", croppedImageData.base64Data);
            params.append("fileName1", croppedImageData.fileName);
            params.append("fileType1", croppedImageData.mimeType);
            params.append("fileColumn1", IMAGE_COLUMN_NAME);
        }

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        });

        const result = await response.json();

        if (result.status === "success") {
            showToast(`✅ Student ${isEdit ? 'updated' : 'saved'} successfully!`, "success");
            localStorage.removeItem(CACHE_KEY);
            dom.formModal.classList.remove('active');
            if (cropper) { cropper.destroy(); cropper = null; }
            await loadStudents();
            goToListView();
        } else {
            showToast("❌ Error: " + result.message, "error");
        }
    } catch (err) {
        console.error("Submission error:", err);
        showToast("❌ Error: " + err.message, "error");
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

/* ======================== MODAL OPEN FUNCTIONS ======================== */

async function openAddModal() {
    dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading form...</p></div>';
    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = "➕ Add New Admission";
    dom.formModalBody.innerHTML = buildFormHtml(null, false);
    setTimeout(() => attachFormEvents(false, null), 50);
}

async function openEditModal() {
    if (!currentViewStudent) return;
    const rowIdx = findRowIndexByAdmIn(currentViewStudent['Adm In']);
    if (!rowIdx) { showModal("Row error", "Error"); return; }

    dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading edit form...</p></div>';
    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = "✏️ Edit Student";
    dom.formModalBody.innerHTML = buildFormHtml(currentViewStudent, true);
    setTimeout(() => attachFormEvents(true, rowIdx), 50);
}

/* ======================== MOBILE BUTTON HANDLERS ======================== */

function setupMobileButtons() {
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');

    if (mobileRefreshBtn) {
        mobileRefreshBtn.addEventListener('click', function() {
            if (dom.refreshBtn) {
                dom.refreshBtn.click();
            } else {
                refreshData();
            }
        });
    }

    if (mobileAddBtn) {
        mobileAddBtn.addEventListener('click', function() {
            if (dom.addNewBtn) {
                dom.addNewBtn.click();
            } else {
                openAddModal();
            }
        });
    }
}

/* ======================== INITIALIZATION ======================== */

function init() {
       // 1. Check admin authentication FIRST
            const isAuthorized = checkAdminAuth();
            if (!isAuthorized) return; // Redirect happens inside checkAdminAuth

    // Add spinner styles
    addSpinnerStyles();
    
    // Cache DOM elements
    cacheDomElements();
    
    // Setup mobile buttons
    setupMobileButtons();

    // Show spinner immediately on page load
    showLoadingSpinner(true, 'Loading application...');

    // Load data with spinner
    setTimeout(() => loadStudents(), 500);

    // Event listeners
    dom.searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => renderTable(e.target.value), 300);
    });

    dom.refreshBtn?.addEventListener('click', refreshData);
    dom.addNewBtn?.addEventListener('click', openAddModal);
    dom.fabBtn?.addEventListener('click', openAddModal);
    dom.backBtn?.addEventListener('click', goToListView);
    dom.editBtn?.addEventListener('click', openEditModal);
    dom.deleteBtn?.addEventListener('click', deleteStudent);
    dom.printBtn?.addEventListener('click', printAdmissionForm);

    document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal.classList.remove('active'));
    document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
        if (cropper) { cropper.destroy(); cropper = null; }
    });

    window.onclick = (e) => {
        if (e.target.classList?.contains('modal-overlay')) {
            e.target.classList.remove('active');
            if (cropper) { cropper.destroy(); cropper = null; }
        }
    };

    // Background refresh every 5 minutes
    setInterval(() => {
        refreshDataInBackground();
    }, 5 * 60 * 1000);
    
    // Check for cache version changes every minute
    setInterval(() => {
        const cachedVersion = localStorage.getItem(CACHE_VERSION_KEY);
        if (cachedVersion !== CURRENT_CACHE_VERSION) {
            console.log('🔄 Cache version changed, reloading data');
            loadStudents(true);
        }
    }, 60000);

    // Log cache info to console
    console.log(`📦 Cache Version: ${CURRENT_CACHE_VERSION}`);
    console.log(`📊 Sheet: ${SHEET_NAME}`);
    console.log(`🔄 Type "manualClearCache()" in console to clear cache manually`);
    console.log(`🔄 Type "forceRefreshData()" in console to force refresh data`);
}

/* ======================== START APP ======================== */

// Ensure spinner shows before DOMContentLoaded
document.addEventListener('DOMContentLoaded', function() {
    // Show spinner immediately when DOM is ready
    if (dom.tableBody) {
        showLoadingSpinner(true, 'Loading application...');
    }
    // Then run init
    init();
});

// Also show spinner right away if DOM already loaded
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
        if (dom.tableBody) {
            showLoadingSpinner(true, 'Loading application...');
        }
    });
} else {
    // DOM already loaded
    if (dom.tableBody) {
        showLoadingSpinner(true, 'Loading application...');
    }
    init();
}

// Expose functions to window for console access
window.manualClearCache = manualClearCache;
window.forceRefreshData = forceRefreshData;
window.autoFillAdmIn = autoFillAdmIn;
window.rotateLeft = rotateLeft;
window.rotateRight = rotateRight;
window.applyCrop = applyCrop;
window.handleRetry = handleRetry;
window.handleClearCache = handleClearCache;

console.log('✅ Ujjwal Academy Admission System Loaded');
console.log(`📊 Current Sheet: ${SHEET_NAME}`);
console.log('🔄 Spinner and sheet-specific loading enabled');
console.log('📦 Cache TTL: ' + (CACHE_TTL / 60000) + ' minutes');
</script>
