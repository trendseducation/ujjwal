<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>📚 Ujjwal Academy | 8th STD Admission</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js for image editing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- ⭐ ADMIN AUTHENTICATION - ONE LINE -->
    <script src="../../Script/loginadmin.js" data-auto-init="true"></script>
    
    <!-- ⭐ FOOTER LOADER (Optional) -->
    <script src="../../Script/footer-loader.js" data-footer="true" data-footer-path="footer.html"></script>
    
    <style>
        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            /* Light Mode Colors */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --bg-body: #f4f7fc;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #5b6e8c;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            /* Brand Colors */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --warning: #fbbf24;
            --info: #06b6d4;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --accent-glow: rgba(37, 99, 235, 0.15);
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-accent: linear-gradient(135deg, #2563eb, #7c3aed);
            
            /* Table Colors */
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            
            /* Animation */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --bg-body: #0a0f1c;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #9ca3af;
            --text-light: #64748b;
            --border-color: #334155;
            --border-light: #1f2a3e;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
            --danger-light: rgba(239, 68, 68, 0.2);
            --accent-soft: rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ================================================================
           LOADING SPINNER (Admin Auth)
           ================================================================ */
        #authLoading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
            z-index: 9999;
            flex-direction: column;
            gap: 1.5rem;
        }

        #authLoading.hidden {
            display: none !important;
        }

        #authLoading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #authLoading p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-header .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .card-header .header-badge i {
            font-size: 0.7rem;
        }

        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-info {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .data-table th:first-child {
            border-top-left-radius: 12px;
        }

        .data-table th:last-child {
            border-top-right-radius: 12px;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        .view-action-btn {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            filter: brightness(1.05);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }

        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 2rem 2rem 0;
            flex-wrap: wrap;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 1.2rem;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: var(--shadow-lg);
            background: var(--table-header-bg);
        }

        .profile-info h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            display: flex;
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: var(--gradient-accent);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(85vh - 70px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        .image-section {
            border: 2px dashed var(--border-color);
            padding: 20px;
            border-radius: 1.2rem;
            text-align: center;
            margin: 20px 0;
            background: var(--table-header-bg);
            transition: all var(--transition-fast);
        }

        .image-section:hover {
            border-color: var(--primary);
        }

        .image-section label {
            cursor: pointer;
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }

        #preview-container {
            max-width: 400px;
            margin: 15px auto;
            display: none;
        }

        #image-to-crop {
            max-width: 100%;
            display: block;
        }

        .crop-controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: var(--table-header-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }

        .btn-tool:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        #image-status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .status-message {
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .status-success {
            background: var(--success);
            color: white;
        }

        .status-error {
            background: var(--danger);
            color: white;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--gradient-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            text-decoration: none;
            border: none;
            font-size: 2rem;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            background: var(--primary-dark);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.5);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            .card-header {
                padding: 1rem 1.2rem;
                flex-direction: row;
                align-items: flex-start;
                gap: 8px;
            }
            
            .card-header h2 {
                font-size: 1rem;
                width: 100%;
            }
            
            .desktop-buttons {
                display: none;
            }
            
            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 12px;
                width: 100%;
            }
            
            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
                border-radius: 60px;
            }
            
            .search-section {
                padding: 1rem 1.2rem;
            }
            
            .search-wrapper {
                width: 100%;
            }
            
            .search-wrapper input {
                padding: 14px 20px;
                font-size: 0.95rem;
                border-radius: 60px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 12px;
                font-size: 0.7rem;
            }
            
            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            
            .modal-box {
                width: 95%;
                border-radius: 1.5rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .profile-wrapper {
                padding: 1rem;
                flex-direction: column;
                text-align: center;
            }
            
            .details-grid {
                grid-template-columns: 1fr 1fr;
            }

            .action-row {
                padding: 1rem;
                justify-content: center;
            }

            .action-row .btn {
                flex: 1;
                min-width: 120px;
                justify-content: center;
                font-size: 0.75rem;
                padding: 10px 12px;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-buttons {
                display: none !important;
            }
        }

        .mobile-buttons {
            display: none;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }

        .mobile-buttons .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .mobile-buttons .btn::before {
            content: '';
            position: absolute;
            top: 50%;

/* ======================== DARK MODE SYNC ======================== */
function syncThemeWithParent() {
    const localTheme = localStorage.getItem('user-theme-preference');
    if (localTheme) {
        document.body.setAttribute('data-theme', localTheme);
        document.documentElement.setAttribute('data-theme', localTheme);
    } else {
        try {
            if (window.parent && window.parent.document.body) {
                const parentTheme = window.parent.document.body.getAttribute('data-theme');
                if (parentTheme) {
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                }
            }
        } catch(e) { }
    }
}

window.addEventListener('DOMContentLoaded', syncThemeWithParent);
window.addEventListener('storage', syncThemeWithParent);

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'themeChange') {
        const newTheme = event.data.theme;
        if (newTheme) {
            document.body.setAttribute('data-theme', newTheme);
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    }
});

/* ======================== UTILITY: DEBOUNCE ======================== */
function debounce(fn, wait = 250) {
    let t;
    return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
    };
}


/* ======================== DATE FORMATTING ======================== */
function formatToDDMMYYYY(dateInput) {
    if (!dateInput || dateInput === '') return '—';
    try {
        if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
            const [year, month, day] = dateInput.split('-');
            return `${day}/${month}/${year}`;
        }
        if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) {
            return dateInput;
        }
        const dateObj = new Date(dateInput);
        if (!isNaN(dateObj.getTime())) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${day}/${month}/${year}`;
        }
        return '—';
    } catch (error) {
        console.error('Date display formatting error:', error);
        return '—';
    }
}

function formatToYYYYMMDD(dateString) {
    if (!dateString || dateString === '') return '';
    try {
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
            const [day, month, year] = dateString.split('/');
            const testDate = new Date(year, month - 1, day);
            if (!isNaN(testDate.getTime())) return `${year}-${month}-${day}`;
            return '';
        }
        return '';
    } catch (error) {
        console.error('Date conversion error:', error);
        return '';
    }
}

function formatDateForDisplay(dateInput) {
    return formatToDDMMYYYY(dateInput);
}

function validateAndFormatDate(dateStr, fieldName = 'Date') {
    if (!dateStr) return { isValid: false, formattedDate: '', error: `${fieldName} is required.` };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        return { isValid: false, formattedDate: '', error: `Invalid ${fieldName} format. Please select a valid date.` };
    }
    const [year, month, day] = dateStr.split('-');
    const testDate = new Date(year, month - 1, day);
    if (isNaN(testDate.getTime()) ||
        testDate.getFullYear() != year ||
        testDate.getMonth() + 1 != month ||
        testDate.getDate() != day) {
        return { isValid: false, formattedDate: '', error: `Invalid ${fieldName}. Please select a valid date.` };
    }
    return { isValid: true, formattedDate: dateStr, error: '' };
}

function getAcademicYear() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    return month >= 4 ? `${year}-${year + 1}` : `${year - 1}-${year}`;
}

function combineFullName(firstName, middleName, lastName) {
    const parts = [];
    if (firstName && firstName.trim()) parts.push(firstName.trim());
    if (middleName && middleName.trim()) parts.push(middleName.trim());
    if (lastName && lastName.trim()) parts.push(lastName.trim());
    return parts.join(' ');
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}

function extractFileId(driveUrl) {
    if (!driveUrl) return null;
    const match = String(driveUrl).match(/[-\w]{25,}/);
    return match ? match[0] : null;
}

function getThumbnailUrl(driveUrl, width = 400) {
    const fileId = extractFileId(driveUrl);
    if (fileId) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${width}`;
    return driveUrl;
}


/* ======================== TOAST / MODAL / SPINNER ======================== */
function showToast(msg, type = 'info') {
    const box = dom.alertBox;
    if (!box) return;
    box.textContent = msg;
    box.className = `alert-popup ${type}`;
    box.style.display = 'block';
    clearTimeout(box._timeout);
    box._timeout = setTimeout(() => { box.style.display = 'none'; }, 3500);
}

function showModal(msg, title = "Message", isConfirm = false, onConfirm = null, autoClose = 0) {
    if (!dom.globalModal) return;
    dom.modalTitle.innerText = title;
    dom.modalMsg.innerHTML = msg;
    const confirmBtn = document.getElementById('confirmModalBtn');
    if (confirmBtn) {
        confirmBtn.onclick = () => {
            dom.globalModal.classList.remove('active');
            if (isConfirm && onConfirm) onConfirm();
        };
    }
    dom.globalModal.classList.add('active');
    if (autoClose > 0) setTimeout(() => dom.globalModal.classList.remove('active'), autoClose);
}

function showSpinner(element, show, customHtml = null) {
    if (!element) return;
    if (show) {
        element.disabled = true;
        if (!element.hasAttribute('data-original-text')) {
            element.setAttribute('data-original-text', element.innerHTML);
        }
        element.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
    } else {
        element.disabled = false;
        const original = element.getAttribute('data-original-text');
        if (original) {
            element.innerHTML = original;
            element.removeAttribute('data-original-text');
        }
    }
}


/* ======================== CACHE MANAGEMENT ======================== */

        return true;

        console.error('Cache clear error:', e);
        return false;
    }
}

function invalidateStudentCache() {
    try {
        allStudents = [];
        dataLoaded = false;
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(CACHE_VERSION_KEY);
        console.log('🧹 Student cache fully invalidated');
    } catch (e) {
        console.error('Cache invalidation error:', e);
    }
}

function getCache() {
    try {
        const cachedVersion = localStorage.getItem(CACHE_VERSION_KEY);
        if (cachedVersion !== CURRENT_CACHE_VERSION) {
            localStorage.removeItem(CACHE_KEY);
            localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
            return null;
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, timestamp, sheetName } = JSON.parse(cached);
            if (sheetName !== SHEET_NAME) {
                localStorage.removeItem(CACHE_KEY);
                return null;
            }
            if (Date.now() - timestamp < CACHE_TTL) {
                return data;
            }
            localStorage.removeItem(CACHE_KEY);
        }
    } catch (e) {
        console.error('Cache read error:', e);
        localStorage.removeItem(CACHE_KEY);
    }
    return null;
}

function setCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data: data,
            timestamp: Date.now(),
            sheetName: SHEET_NAME
        }));
        localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
    } catch (e) {
        console.error('Cache write error:', e);
    }
}

function buildSkeletonRows(count = 5) {

/* ======================== DATA LOADING ======================== */
async function loadStudents(forceRefresh = false) {
    console.log('🔄 loadStudents called, forceRefresh =', forceRefresh);
    const tableBody = dom.tableBody;
    if (!tableBody) {
        console.error('❌ tableBody not found — aborting load');
        return [];
    }

    if (!forceRefresh && dataLoaded) {
        console.log('📦 Data already loaded in memory');
        renderTable();
        return allStudents;
    }

    try {
        // [CACHE] Serve cached data instantly
        if (!forceRefresh) {
            const cached = getCache();
            if (cached && Array.isArray(cached) && cached.length > 0) {
                console.log(`📦 Using cached data (${cached.length} records)`);
                allStudents = cached;
                dataLoaded = true;
                renderTable();
                showToast(`📦 Loaded ${allStudents.length} students from cache`, "info");
                scheduleIdleRefresh();
                isLoading = false;
                return allStudents;
            }
        }

        // [SKEL] Show skeleton while fetching
        tableBody.innerHTML = buildSkeletonRows(6);

        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
        console.log('🌐 Fetching:', url);

        const response = await fetch(url);
        console.log('📡 Response status:', response.status);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();
        console.log('📥 Received data:', result.status, 'records:', result.data?.length);

        if (result.status === "success" && Array.isArray(result.data)) {
            allStudents = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(allStudents);
            dataLoaded = true;
            renderTable();
            showToast(`✅ Loaded ${allStudents.length} students`, "success");
            isLoading = false;
            return allStudents;
        } else {
            throw new Error(result.message || "Failed to load data");
        }
    } catch (err) {
        console.error('❌ Load students error:', err);

        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const { data, sheetName } = JSON.parse(cached);
                if (data && Array.isArray(data) && data.length > 0 && sheetName === SHEET_NAME) {
                    console.log('⚠️ Using stale cached data as fallback');
                    allStudents = data;
                    dataLoaded = true;
                    renderTable();
                    showToast("⚠️ Using cached data (offline mode)", "warning");
                    isLoading = false;
                    return allStudents;
                }
            }
        } catch (e) {}

        tableBody.innerHTML = `
            <tr>
                <td colspan="4">
                    <div class="error-container">
                        <span class="error-icon">⚠️</span>
                        <p class="error-title">Failed to load data</p>
                        <p class="error-message">${escapeHtml(err.message)}</p>
                        <div class="error-actions">
                            <button onclick="handleRetry()" class="btn btn-primary" style="padding: 10px 24px;">
                                <span>⟳</span> Retry
                            </button>
                            <button onclick="handleClearCache()" class="btn btn-outline" style="padding: 10px 24px;">
                                <span>🧹</span> Clear Cache & Retry
                            </button>
                        </div>
                    </div>
                </td>
            </tr>
        `;
        isLoading = false;
        return [];
    }
}

function scheduleIdleRefresh() {
    const run = () => refreshDataInBackground();
    if ('requestIdleCallback' in window) {
        requestIdleCallback(run, { timeout: 4000 });
    } else {
        setTimeout(run, 2000);
    }
}

async function refreshDataInBackground() {
    try {
        const response = await fetch(
            `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`
        );
        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            if (JSON.stringify(allStudents) !== JSON.stringify(newData)) {
                allStudents = newData;
                setCache(allStudents);
                renderTable();
                console.log('🔄 Background refresh updated data');
            }
        }
    } catch (err) {
        console.log('Background refresh failed:', err.message);
    }
}

async function refreshData() {
    const refreshBtn = dom.refreshBtn;
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');

    showSpinner(refreshBtn, true);
    if (mobileRefreshBtn) {
        mobileRefreshBtn.disabled = true;
        mobileRefreshBtn.innerHTML = '<span class="spinner"></span> Loading...';
    }

    try {
        clearAllCaches();
        dataLoaded = false;
        await loadStudents(true);
        showToast("✅ Data refreshed successfully!", "success");
    } catch (err) {
        showToast("❌ Refresh failed: " + err.message, "error");
    } finally {
        showSpinner(refreshBtn, false);
        if (mobileRefreshBtn) {
            mobileRefreshBtn.disabled = false;
            mobileRefreshBtn.innerHTML = '<span>⟳</span> Refresh';
        }
    }
}

window.handleRetry = function() {
    dataLoaded = false;
    clearAllCaches();
    setTimeout(() => loadStudents(true), 300);
};

window.handleClearCache = function() {
    clearAllCaches();
    dataLoaded = false;
    showToast("🧹 Cache cleared! Refreshing...", "success");
    setTimeout(() => loadStudents(true), 300);
};

function renderTable(filter = "") {
    if (!dom.tableBody) return;

    if (!allStudents || allStudents.length === 0) {
        dom.tableBody.innerHTML = `
            <tr>
                <td colspan="4">
                    <div class="empty-container">
                        <span class="empty-icon">📚</span>

                        <p class="empty-subtitle">Click "Add Admission" to add your first student</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    const searchLower = filter.toLowerCase().trim();
    let filtered = allStudents;

    if (searchLower) {
        filtered = allStudents.filter(s => {
            const fullName = combineFullName(
                s['First Name'] || '',
                s['Middle Name'] || '',
                s['Last Name'] || ''
            ).toLowerCase();
            const mobile = String(s['Personal Mob No'] || '').toLowerCase();
            const admIn = String(s['Adm In'] || '').toLowerCase();
            return fullName.includes(searchLower) || mobile.includes(searchLower) || admIn.includes(searchLower);
        });

                        <p class="empty-subtitle">Try adjusting your search</p>
                    </div>
                </td>

            s['First Name'] || '',

/* ======================== EVENT DELEGATION ======================== */
function handleTableClick(e) {
    const btn = e.target.closest('.view-action-btn');
    if (!btn) return;
    e.stopPropagation();

    const srVal = btn.getAttribute('data-sr');
    const admVal = btn.getAttribute('data-adm');
    const actualIndex = parseInt(btn.getAttribute('data-actual-index'), 10);
    const fullName = btn.getAttribute('data-full-name');

    let found = null;

    // 🔑 Primary: match by Sr. No
    if (srVal) {
        found = allStudents.find(s => String(s['Sr. No']) === String(srVal));
    }

    // Fallback: by array index
    if (!found && !isNaN(actualIndex) && actualIndex >= 0 && actualIndex < allStudents.length) {
        found = allStudents[actualIndex];
    }

    // Fallback: by Adm In
    if (!found && admVal) {
        found = allStudents.find(s => String(s['Adm In']) === String(admVal));
    }

    // Fallback: by full name
    if (!found && fullName) {
        found = allStudents.find(s => combineFullName(
            s['First Name'] || '', s['Middle Name'] || '', s['Last Name'] || ''
        ) === fullName);
    }

    if (found) {
        currentViewStudent = found;
        currentEditStudent = found;

        // 🔑 RECORD Sr. No at View time
        selectedSrNo = found['Sr. No'];
        selectedAdmIn = found['Adm In'];
        selectedRowIndex = found._rowIndex || 2;

        console.log('👁️ View clicked — recorded Sr. No:', selectedSrNo);

        showDetailView(found);
    } else {
        showToast("❌ Student not found. Please refresh the page.", "error");
    }
}

/* ======================== ROW LOOKUP HELPERS ======================== */
/**
 * 🔑 Find row index by Sr. No — derives from CURRENT array position.
 * Never trusts a cached _rowIndex.
 */
function findRowIndexBySrNo(srNo) {
    if (srNo === null || srNo === undefined || srNo === '') return null;
    const idx = allStudents.findIndex(s => String(s['Sr. No']) === String(srNo));
    return idx !== -1 ? idx + 2 : null;
}

/**
 * Fallback lookup by Adm In (used by Edit flow).
 */
function findRowIndexByAdmIn(admIn) {
    if (!admIn) return null;
    const idx = allStudents.findIndex(s => String(s['Adm In']) === String(admIn));
    if (idx !== -1) return idx + 2;
    const altIdx = allStudents.findIndex(s =>
        String(s['Adm In']).includes(admIn) || admIn.includes(String(s['Adm In']))
    );
    if (altIdx !== -1) return altIdx + 2;
    return null;
}


/* ======================== DELETE STUDENT (Sr. No-based) ======================== */
/**
 * 🔑 DELETE FLOW (matches Cam_Taloja_3104.html pattern):
 *   1. Use the Sr. No recorded when View was clicked
 *   2. Re-fetch fresh data from server (guarantees current state)
 *   3. Find student in FRESH array by Sr. No
 *   4. Derive rowIndex from position (+2 for header)
 *   5. Send delete request
 *   6. Server's resetSerialNumbers() renumbers Sr. No column
 *   7. Client refetches fresh data
 */
async function deleteStudent() {
    // 🔑 Use the Sr. No captured at View time
    const srNoToDelete = selectedSrNo ?? currentViewStudent?.['Sr. No'];

    if (srNoToDelete === null || srNoToDelete === undefined || srNoToDelete === '') {
        showToast('❌ No student Sr. No recorded. Please click View again.', 'error');
        return;
    }

    const displayName = dom.profileName?.textContent || 'this student';

    showModal(
        `⚠️ Are you sure you want to delete <strong>${escapeHtml(displayName)}</strong> ` +
        `(Sr. No: ${escapeHtml(String(srNoToDelete))})?<br><br>` +
        `This action cannot be undone and will remove the student's record ` +
        `and all associated files.`,
        'Confirm Delete',
        true,
        async () => {
            showSpinner(dom.deleteBtn, true);
            try {
                console.log('🗑️ Delete started for Sr. No:', srNoToDelete);

                // 🔑 STEP 1: Re-fetch fresh data from server FIRST
                clearAllCaches();
                dataLoaded = false;

                const freshUrl = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}` +
                                 `&sheetName=${SHEET_NAME}&_=${Date.now()}`;
                const freshRes = await fetch(freshUrl);
                const freshResult = await freshRes.json();

                if (freshResult.status !== 'success' || !Array.isArray(freshResult.data)) {
                    throw new Error(freshResult.message || 'Failed to refresh data');
                }

                allStudents = freshResult.data.map((item, idx) => ({
                    ...item,
                    _rowIndex: idx + 2
                }));

                console.log('📥 Fresh data fetched. Looking for Sr. No:', srNoToDelete);

                // 🔑 STEP 2: Find student in FRESH array by Sr. No
                const freshIdx = allStudents.findIndex(
                    s => String(s['Sr. No']) === String(srNoToDelete)
                );

                if (freshIdx === -1) {
                    throw new Error(`Student with Sr. No "${srNoToDelete}" not found on server. Data may have changed.`);
                }

                const liveRowIndex = freshIdx + 2;
                console.log('🎯 Fresh row index resolved for delete:', liveRowIndex);

                // 🔑 STEP 3: Send delete request
                const params = new URLSearchParams();
                params.append('action', 'delete');
                params.append('spreadsheetId', SPREADSHEET_ID);
                params.append('sheetName', SHEET_NAME);
                params.append('rowIndex', liveRowIndex);
                params.append('Sr. No', srNoToDelete);   // safety net

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // 🔑 STEP 4: Reset client state
                    currentViewStudent = null;
                    currentEditStudent = null;
                    selectedSrNo = null;
                    selectedAdmIn = null;
                    selectedRowIndex = null;

                    invalidateStudentCache();

                    showModal('✅ Deleted successfully! Sr. No reset.', 'Success', false, null, 1200);

                    // 🔑 STEP 5: Re-fetch fresh (server already reset Sr. No)
                    await loadStudents(true);
                    goToListView();
                } else {
                    showModal('❌ Delete failed: ' + (result.message || 'Unknown error'), 'Error');
                    invalidateStudentCache();
                    await loadStudents(true);
                }
            } catch (err) {
                console.error('Delete error:', err);
                showModal('❌ Error: ' + err.message, 'Error');
            } finally {
                showSpinner(dom.deleteBtn, false);
            }
        }
    );
}

/* ────────────────────────────────────────────────────────────────
   PRINT-SAFE IMAGE URL
   ────────────────────────────────────────────────────────────────
   Converts any Drive URL to the reliable lh3.googleusercontent.com/d/{fileId}
   endpoint — renders in browser print dialogs and html2canvas
   (provided the Drive file is shared publicly).
   ──────────────────────────────────────────────────────────────── */
function getPrintImageUrl(driveUrl) {
    const fileId = extractFileId(driveUrl);
    if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}`;
    }
    if (driveUrl && String(driveUrl).startsWith('http')) return driveUrl;
    return '';
}


/* ────────────────────────────────────────────────────────────────
   IMAGE PRE-FETCH HELPERS
   ──────────────────────────────────────────────────────────────── */
async function urlToDataUri(url, timeoutMs = 8000) {
    if (!url) return '';
    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        const response = await fetch(url, {
            mode: 'cors',
            credentials: 'omit',
            cache: 'force-cache',
            signal: controller.signal
        });
        clearTimeout(timer);

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const blob = await response.blob();
        if (!blob || blob.size === 0) throw new Error('Empty blob');

        return await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result || '');
            reader.onerror = () => resolve('');
            reader.readAsDataURL(blob);
        });
    } catch (err) {
        console.warn('⚠️ Could not pre-fetch image:', url, err.message);
        return '';
    }
}

async function preloadPrintImages(student) {
    const LOGO_URL = 'https://lh3.googleusercontent.com/d/1HUjvQXeYLxFtt5StZMinVh8sXRZ_TI0F';

    const photoRaw = student && student['Image'] ? student['Image'] : '';
    const photoLh3 = photoRaw ? getPrintImageUrl(photoRaw) : '';

    const [photoDataUri, logoDataUri] = await Promise.all([
        photoLh3 ? urlToDataUri(photoLh3) : Promise.resolve(''),
        urlToDataUri(LOGO_URL)
    ]);

    return { photoDataUri, logoDataUri };
}

    .corner-tl {
        position: absolute; top:0; left:0;
        width: 34mm; height: 20mm;
        background: #d40000;
        clip-path: polygon(0 0, 100% 0, 0 100%);
        z-index: 1;
    }
    .corner-tr {
        position: absolute; top:0; right:0;
        width: 34mm; height: 20mm;
        background: #d40000;
        clip-path: polygon(0 0, 100% 0, 100% 100%);
        z-index: 1;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    .header {
        display: grid;
        grid-template-columns: 26mm 1fr 32mm;
        align-items: center;
        gap: 3mm;
        padding: 1mm 2mm 2mm;
        position: relative;
        z-index: 2;
    }
    .logo-wrap {
        width: 24mm; height: 24mm;
        display: flex; align-items: center; justify-content: center;
    }
    .logo-wrap img {
        width: 100%; height: 100%; object-fit: contain;
    }
    .title-wrap { text-align: center; }
    .title-wrap h1 {
        font-size: 26pt;
        font-weight: 900;
        color: #d40000;
        letter-spacing: 0.5px;
        line-height: 1;
        font-family: 'Arial Black', 'Segoe UI', sans-serif;
        text-transform: uppercase;
    }
    .title-pill {
        display: inline-block;
        background: #d40000;
        color: #fff;
        font-size: 13pt;
        font-weight: 900;
        letter-spacing: 1.2px;
        padding: 1.2mm 9mm;
        border-radius: 20px;
        margin-top: 1.5mm;
        font-family: 'Arial Black', 'Segoe UI', sans-serif;
    }
    .photo-box {
        width: 30mm; height: 34mm;
        border: 1.2pt solid #1a3e77;
        border-radius: 1mm;
        background: #eef2f7;
        overflow: hidden;
        display: flex; align-items: center; justify-content: center;
    }

    /* ── MAIN BORDERED BODY (watermark lives inside) ──────── */
    .form-body {
    position: relative;
    /* isolation: isolate;  ← REMOVE or comment this out */
    flex: 1;
    border: 1.6pt solid #0d2c54;
    border-radius: 2mm;
    padding: 4mm 4mm 3mm 4mm;
    margin-top: 3mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
@media print {
    .form-body {
        overflow: visible !important; /* ✅ allow watermark to render in print */
    }
}

    /* ═══════════════════════════════════════════════════════
       WATERMARK — EXACT MATCH TO REFERENCE IMAGE
       • ONE single instance
       • Centered on .form-body (upright, NOT rotated)
       • Large width (~135mm) so it covers the middle section
       • Very light opacity (0.08)
       • Sits BEHIND all form content (z-index: 0)
       ═══════════════════════════════════════════════════════ */
    .watermark {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: 135mm;
    height: 135mm;
    opacity: 0.14;
    pointer-events: none;
    user-select: none;

    /* ✅ ABOVE the boxes (which have white backgrounds) */
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    transform: none !important;
    will-change: auto !important;
}
.watermark img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    opacity: 1;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    transform: none !important;
}

    /* All form rows/labels/boxes render ABOVE the watermark */
    .row,
.declaration-wrap,
.sign-row {
    position: relative;
    z-index: 1;          /* below watermark (z-index: 5) */
}

    /* ── GRID LAYOUT ──────────────────────────────────────── */
    .row {
        display: grid;
        gap: 3mm 4mm;
        margin-bottom: 2.6mm;
    }
    .row.full   { grid-template-columns: 1fr; }
    .row.three  { grid-template-columns: 1fr 1fr 1fr; }
    .row.two    { grid-template-columns: 1fr 1fr; }
    .row.half   { grid-template-columns: 1.05fr 1.6fr; }

    .field {
        display: flex;
        flex-direction: column;
        gap: 0.8mm;
    }
    .field.inline {
        flex-direction: row;
        align-items: center;
        gap: 2mm;
    }
    .field label {
        font-size: 9pt;
        font-weight: 700;
        color: #000;
        white-space: nowrap;
    }
    .field.inline label {
        min-width: 26mm;
        text-align: right;
    }

    .value-box {
        border: 0.9pt solid #4a6fa5;
        border-radius: 1.2mm;
        min-height: 8mm;
        padding: 1.2mm 2.5mm;

    .row.half .field.inline label { min-width: 20mm; }

    /* ── DECLARATION ──────────────────────────────────────── */
    .declaration-wrap {
        margin-top: 3mm;
        position: relative;
    }
    .declaration-tag {
        display: inline-block;
        background: #d40000;
        color: #fff;
        font-size: 12pt;
        font-weight: 900;
        padding: 1mm 6mm;
        border-radius: 12px;
        margin-left: 4mm;
        margin-bottom: -2mm;
        position: relative;
        z-index: 2;
        font-family: 'Arial Black', 'Segoe UI', sans-serif;
    }
    .declaration-box {
        border: 1.2pt solid #e7a5a5;
        background: #fdf2f2;
        border-radius: 2mm;
        padding: 5mm 6mm 4mm 6mm;
        font-size: 10.5pt;
        line-height: 1.55;
        color: #111;
        font-weight: 500;
    }

    /* ── SIGNATURE ROW (pinned to bottom of form body) ───── */
    .sign-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 5mm;
        margin-top: auto;
        padding-top: 8mm;
        padding-bottom: 2mm;
    }
    .sign-box {
        border: 1pt solid #0d2c54;
        border-radius: 2mm;
        height: 16mm;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 1.5mm;
        font-size: 9.5pt;
        font-weight: 700;
        color: #000;
        background: #fff;
    }

    /* ── FOOTER RED LINE (no grey bar) ─────────────────────── */
    .footer-bar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 2mm;
        background: #d40000;
    }

    /* ═══════════════════════════════════════════════════════
       PRINT MEDIA — force watermark to render in print preview
       ═══════════════════════════════════════════════════════ */
    @media print {
    .form-body {
        overflow: visible !important;
        position: relative !important;
        isolation: auto !important;   /* don't isolate — let z-index cross layers */
    }
    .watermark {
        display: flex !important;
        visibility: visible !important;
        opacity: 0.14 !important;
        z-index: 5 !important;        /* ✅ ON TOP in print too */
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        transform: none !important;
    }
    .watermark img {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .row,
    .declaration-wrap,
    .sign-row {
        position: relative !important;
        z-index: 1 !important;        /* ✅ below watermark in print too */
    }
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }
    html, body {
        width: 210mm;
        height: 297mm;
        zoom: 1 !important;
    }
}

/* ────────────────────────────────────────────────────────────────
   PRINT — opens the browser print dialog
   ──────────────────────────────────────────────────────────────── */
async function printAdmissionForm() {
    const record = currentViewStudent;
    if (!record) {
        showToast("❌ No student data to print", "error");
        return;
    }

    const fullName = combineFullName(
        record['First Name'] || '',
        record['Middle Name'] || '',
        record['Last Name'] || ''
    ) || 'Student';
    const todayStr = new Date().toLocaleDateString('en-GB');

    showToast("📄 Preparing form for print...", "info");

    let photoDataUri = '';
    let logoDataUri = '';
    try {
        const pre = await preloadPrintImages(record);
        photoDataUri = pre.photoDataUri;
        logoDataUri = pre.logoDataUri;
        console.log('🖼️ Pre-fetched — photo:', !!photoDataUri, 'logo:', !!logoDataUri);
    } catch (e) {
        console.warn('Image preload failed, using lh3 URL fallbacks:', e);
    }

    const imgUrl = getPrintImageUrl(record['Image'] || '');

    const printHtml = generatePDFHTML(
        record,
        fullName,
        todayStr,
        imgUrl,
        logoDataUri,
        photoDataUri
    );

    const printWindow = window.open(
    '',
    '_blank',
    'width=900,height=1200,toolbar=yes,scrollbars=yes,resizable=yes,menubar=no'
);
    if (!printWindow) {
        showToast("❌ Please allow pop-ups to print", "error");
        return;
    }
    printWindow.document.write(printHtml);
    printWindow.document.close();

    printWindow.onload = function() {
        setTimeout(() => {
            printWindow.focus();
            printWindow.print();
        }, 800);
    };
}


/* ────────────────────────────────────────────────────────────────
   DOWNLOAD PDF — html2canvas → jsPDF
   ──────────────────────────────────────────────────────────────── */
function downloadAdmissionPDF() {
    const record = currentViewStudent;
    if (!record) {
        showToast("❌ No student data to download", "error");
        return;
    }

    if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
        showToast("📥 Loading PDF libraries...", "info");

        const loadHtml2Canvas = new Promise((resolve, reject) => {
            if (typeof html2canvas !== 'undefined') { resolve(); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });

        const loadJsPDF = new Promise((resolve, reject) => {
            if (typeof jspdf !== 'undefined') { resolve(); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });

        Promise.all([loadHtml2Canvas, loadJsPDF])
            .then(() => {
                showToast("✅ Libraries loaded, generating PDF...", "success");
                generatePDFWithCanvas(record);
            })
            .catch((err) => {
                console.error('Library load error:', err);
                showToast("❌ Failed to load PDF libraries. Please try again.", "error");
            });
        return;
    }

    generatePDFWithCanvas(record);
}

async function generatePDFWithCanvas(record) {
    const fullName = combineFullName(
        record['First Name'] || '',
        record['Middle Name'] || '',
        record['Last Name'] || ''
    ) || 'Student';

    const todayStr = new Date().toLocaleDateString('en-GB');

    showSpinner(dom.downloadBtn, true);
    showToast("📄 Generating PDF, please wait...", "info");

    let photoDataUri = '';
    let logoDataUri = '';
    try {
        const pre = await preloadPrintImages(record);
        photoDataUri = pre.photoDataUri;
        logoDataUri = pre.logoDataUri;
        console.log('🖼️ Pre-fetched — photo:', !!photoDataUri, 'logo:', !!logoDataUri);
    } catch (e) {
        console.warn('Image preload failed, using lh3 URL fallbacks:', e);
    }

    const imgUrl = getPrintImageUrl(record['Image'] || '');
    const pdfHtml = generatePDFHTML(
        record,
        fullName,
        todayStr,
        imgUrl,
        logoDataUri,
        photoDataUri
    );

    // ── Off-screen render container (A4 @ 96 dpi) ───────────
    const container = document.createElement('div');
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.style.width = '794px';
    container.style.height = '1123px';
    container.style.background = 'white';
    container.style.zIndex = '-1';
    container.style.padding = '0';
    container.style.margin = '0';
    container.style.overflow = 'hidden';
    container.innerHTML = pdfHtml;
    document.body.appendChild(container);

    const images = container.querySelectorAll('img');
    const imagePromises = Array.from(images).map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
            setTimeout(resolve, 3000);
        });
    });

    Promise.all(imagePromises).then(() => {
        setTimeout(() => {
            html2canvas(container, {
                scale: 2,
                useCORS: true,
                allowTaint: false,
                logging: false,
                backgroundColor: '#ffffff',
                width: 794,
                height: 1123,
                windowWidth: 794,
                windowHeight: 1123,
                // [WATERMARK] Re-apply opacity on the cloned node so the single
                // logo watermark survives into the PDF.
                onclone: (clonedDoc) => {
                    const wm = clonedDoc.querySelector('.watermark');
                    if (wm) {
                        wm.style.display = 'block';
                        wm.style.visibility = 'visible';
                        wm.style.opacity = '0.08';
                    }
                    const wmImg = clonedDoc.querySelector('.watermark img');
                    if (wmImg) {
                        wmImg.style.display = 'block';
                        wmImg.style.visibility = 'visible';
                        wmImg.style.opacity = '1';
                    }
                }
            }).then(canvas => {
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait'
                    });

                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                    pdf.save(`Admission_Form_${fullName.replace(/\s/g, '_')}.pdf`);

                    document.body.removeChild(container);
                    showToast("✅ PDF downloaded successfully!", "success");
                    if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
                } catch (err) {
                    console.error('PDF generation error:', err);
                    document.body.removeChild(container);
                    showToast("❌ Error generating PDF: " + err.message, "error");
                    if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
                }
            }).catch(err => {
                console.error('html2canvas error:', err);
                document.body.removeChild(container);
                showToast("❌ Error rendering content: " + err.message, "error");
                if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
            });
        }, 300);
    });
}

/* ======================== INLINE ERROR HELPERS ======================== */
function setFieldError(fieldId, message) {
    const errEl = document.getElementById('err-' + fieldId);
    const inputEl = document.getElementById(fieldId);
    if (errEl) {
        if (message) {
            errEl.textContent = message;
            errEl.classList.add('show');
        } else {
            errEl.textContent = '';
            errEl.classList.remove('show');
        }
    }
    if (inputEl) {
        inputEl.classList.toggle('field-invalid', !!message);
        inputEl.classList.toggle('field-valid', !message && inputEl.value.trim() !== '');
    }
}

function clearAllFieldErrors(fieldIds) {
    fieldIds.forEach(id => setFieldError(id, ''));
}

/* ======================== NAME VALIDATION (single word only) ======================== */
/**
 * Validates that a name is a single word (no spaces).
 * Rejects: "Vikas Verma", "Vikas Mukesh Verma"
 * Allows:  "Vikas", "Verma", "Mukesh"
 */
function validateSingleWordName(value, fieldLabel) {
    const trimmed = (value || '').trim();
    if (!trimmed) return { valid: false, message: `${fieldLabel} is required.` };
    if (trimmed.length < 2) return { valid: false, message: `${fieldLabel} must be at least 2 characters.` };
    if (trimmed.length > 30) return { valid: false, message: `${fieldLabel} must be under 30 characters.` };
    if (/\s/.test(trimmed)) {
        return {
            valid: false,
            message: `${fieldLabel} must be a single word (no spaces). Enter only the first word.`
        };
    }
    if (!/^[A-Za-z][A-Za-z.'-]*$/.test(trimmed)) {
        return { valid: false, message: `${fieldLabel} can only contain letters, apostrophes, dots, and hyphens.` };
    }
    return { valid: true, message: '' };
}

/* ======================== EMAIL VALIDATION + UNIQUENESS ======================== */
/**
 * Validates email format using HTML5 input type=email validity
 * plus a stricter regex for common typos.
 */
function validateEmailFormat(email) {
    const trimmed = (email || '').trim();
    if (!trimmed) return { valid: false, message: 'Email ID is required.' };

    // Standard email regex — covers 99% of real-world formats
    const emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
    if (!emailRegex.test(trimmed)) {
        return { valid: false, message: 'Please enter a valid email address (e.g. name@gmail.com).' };
    }

    // Common typo checks
    const lower = trimmed.toLowerCase();
    const commonTypos = ['gmal.com', 'gmial.com', 'gmail.co', 'gmail.con', 'yahho.com', 'yaho.com', 'hotmial.com', 'outlok.com'];
    for (const typo of commonTypos) {
        if (lower.endsWith('@' + typo) || lower.endsWith('.' + typo.split('.')[0])) {
            return { valid: false, message: `Did you mean "@${typo.replace(/^(gmal|gmial|gmail|yahho|yaho|hotmial|outlok)/, 'gmail')}"? Please check your email.` };
        }
    }

    if (trimmed.includes('..')) {
        return { valid: false, message: 'Email cannot contain consecutive dots (..).' };
    }

    return { valid: true, message: '' };
}

/**
 * Checks if an email already exists in the sheet (excluding the current student on edit).
 * Uses in-memory allStudents — no server round-trip.
 */
function isEmailDuplicate(email, currentSrNo = null) {
    const trimmed = (email || '').trim().toLowerCase();
    if (!trimmed) return false;

    return allStudents.some(s => {
        const existingEmail = String(s['Email Id'] || '').trim().toLowerCase();
        if (!existingEmail) return false;
        if (existingEmail !== trimmed) return false;
        // On edit: allow the same student to keep their own email
        if (currentSrNo !== null && String(s['Sr. No']) === String(currentSrNo)) return false;
        return true;
    });
}


/* ======================== CROPPER ======================== */
function rotateLeft() { if (cropper) cropper.rotate(-90); }
function rotateRight() { if (cropper) cropper.rotate(90); }

function applyCrop() {
    if (!cropper) {
        document.getElementById('image-status').textContent = "❌ No image loaded to crop.";
        return;
    }
    try {
        const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
        if (!canvas) throw new Error("Could not crop image");
        const base64Data = canvas.toDataURL('image/jpeg', 0.9);
        croppedImageData = {
            base64Data: base64Data.split(',')[1],
            fileName: `student_photo_${Date.now()}.jpg`,
            mimeType: 'image/jpeg'
        };
        const statusEl = document.getElementById('image-status');
        statusEl.textContent = "✅ Image cropped and ready!";
        statusEl.style.color = "var(--success)";

        const preview = document.createElement('img');
        preview.src = base64Data;
        preview.style.maxWidth = "100px";
        preview.style.marginTop = "10px";
        preview.style.borderRadius = "8px";
        preview.style.border = "2px solid var(--primary)";
        preview.id = 'cropped-preview';
        preview.loading = 'lazy';
        preview.decoding = 'async';

        const oldPreview = document.getElementById('cropped-preview');
        if (oldPreview) oldPreview.remove();
        document.getElementById('preview-container').appendChild(preview);
    } catch (error) {
        const statusEl = document.getElementById('image-status');
        statusEl.textContent = "❌ Failed to crop image.";
        statusEl.style.color = "var(--danger)";
    }
}
