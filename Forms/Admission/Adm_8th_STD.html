/* ======================== FORM EVENTS ======================== */
function attachFormEvents(isEdit, rowIdx) {
    const form = document.getElementById('studentForm');
    if (!form) return;
    form.onsubmit = (e) => handleFormSubmit(e, isEdit, rowIdx);

    // ═══════════════════════════════════════════════════════════════
    // ✅ ENHANCEMENT #2: Middle Name auto-syncs with Father Name
    // ═══════════════════════════════════════════════════════════════
    const fatherNameInput = document.getElementById('fFatherName');
    const middleNameInput = document.getElementById('fMiddleName');

    if (fatherNameInput && middleNameInput) {
        // Force readonly + visual hint
        middleNameInput.readOnly = true;
        middleNameInput.setAttribute('aria-readonly', 'true');
        middleNameInput.title = 'Auto-filled from Father Name';

        // Sync on load (edit mode — ensure middle = father)
        if (isEdit && fatherNameInput.value) {
            middleNameInput.value = fatherNameInput.value.trim();
        }

        // Sync on every father name change
        fatherNameInput.addEventListener('input', () => {
            const fatherVal = fatherNameInput.value.trim();
            middleNameInput.value = fatherVal;
            // Also clear middle name error (should never show one)
            setFieldError('fMiddleName', '');
        });
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ ENHANCEMENT #1: Single-word name validation (live)
    // ═══════════════════════════════════════════════════════════════
    const singleWordFields = [
        { id: 'fFirstName', label: 'First Name' },
        { id: 'fLastName',  label: 'Last Name'  },
        { id: 'fFatherName', label: 'Father Name' },
        { id: 'fMotherName', label: 'Mother Name' }
    ];

    singleWordFields.forEach(({ id, label }) => {
        const el = document.getElementById(id);
        if (!el) return;

        // Validate on blur (not on every keystroke — less annoying)
        el.addEventListener('blur', () => {
            const result = validateSingleWordName(el.value, label);
            setFieldError(id, result.valid ? '' : result.message);
        });

        // Live-clear error while typing
        el.addEventListener('input', () => {
            if (el.classList.contains('field-invalid')) {
                const result = validateSingleWordName(el.value, label);
                setFieldError(id, result.valid ? '' : result.message);
            }
        });
    });

    // ═══════════════════════════════════════════════════════════════
    // ✅ ENHANCEMENT #3: Email format + uniqueness (live)
    // ═══════════════════════════════════════════════════════════════
    const emailInput = document.getElementById('fEmail');
    if (emailInput) {
        const validateEmail = () => {
            const emailVal = emailInput.value.trim();
            // On edit, get current student's Sr. No so we allow their own email
            const currentSrNo = isEdit ? (currentEditStudent?.['Sr. No'] ?? null) : null;

            const formatResult = validateEmailFormat(emailVal);
            if (!formatResult.valid) {
                setFieldError('fEmail', formatResult.message);
                return false;
            }

            if (isEmailDuplicate(emailVal, currentSrNo)) {
                setFieldError('fEmail', `This email "${emailVal}" is already registered. Please use a different one.`);
                return false;
            }

            setFieldError('fEmail', '');
            return true;
        };

        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', () => {
            // Live-clear while typing (re-check only if error was showing)
            if (emailInput.classList.contains('field-invalid')) {
                validateEmail();
            }
        });
    }

    // ═══════════════════════════════════════════════════════════════
    // Date / Mobile / Gender basic live validation
    // ═══════════════════════════════════════════════════════════════
    document.getElementById('fDateOfAdm')?.addEventListener('blur', () => {
        const v = document.getElementById('fDateOfAdm').value;
        setFieldError('fDateOfAdm', v ? '' : 'Date of Admission is required.');
    });
    document.getElementById('fBirthDate')?.addEventListener('blur', () => {
        const v = document.getElementById('fBirthDate').value;
        setFieldError('fBirthDate', v ? '' : 'Birth Date is required.');
    });
    document.getElementById('fGender')?.addEventListener('change', () => {
        const v = document.getElementById('fGender').value;
        setFieldError('fGender', v ? '' : 'Gender is required.');
    });
    document.getElementById('fPersonalMobile')?.addEventListener('blur', () => {
        const v = document.getElementById('fPersonalMobile').value.trim();
        if (!v) { setFieldError('fPersonalMobile', 'Personal Mobile is required.'); return; }
        if (!/^[6-9][0-9]{9}$/.test(v)) { setFieldError('fPersonalMobile', 'Enter a valid 10-digit mobile starting with 6-9.'); return; }
        setFieldError('fPersonalMobile', '');
    });
    document.getElementById('fParentMobile')?.addEventListener('blur', () => {
        const v = document.getElementById('fParentMobile').value.trim();
        if (!v) { setFieldError('fParentMobile', 'Parent Mobile is required.'); return; }
        if (!/^[6-9][0-9]{9}$/.test(v)) { setFieldError('fParentMobile', 'Enter a valid 10-digit mobile starting with 6-9.'); return; }
        setFieldError('fParentMobile', '');
    });
    document.getElementById('fAdmIn')?.addEventListener('blur', () => {
        const v = document.getElementById('fAdmIn').value.trim();
        setFieldError('fAdmIn', v ? '' : 'Adm In is required.');
    });

    // ═══════════════════════════════════════════════════════════════
    // Image upload handler (unchanged)
    // ═══════════════════════════════════════════════════════════════
    const imageInput = document.getElementById('imageInput');
    const imageToCrop = document.getElementById('image-to-crop');
    const previewContainer = document.getElementById('preview-container');
    const imageStatus = document.getElementById('image-status');

    if (imageInput) {
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    imageStatus.textContent = "❌ Image too large! Max 5MB.";
                    imageStatus.style.color = "var(--danger)";
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    imageStatus.textContent = "❌ Please select a valid image.";
                    imageStatus.style.color = "var(--danger)";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageToCrop.src = event.target.result;
                    previewContainer.style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 1,
                        responsive: true
                    });
                    imageStatus.textContent = "✅ Image loaded. Crop if needed.";
                    imageStatus.style.color = "var(--success)";
                    croppedImageData = null;
                };
                reader.readAsDataURL(file);
            }
        });
    }

    document.getElementById('cancelFormBtn')?.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
        if (cropper) { cropper.destroy(); cropper = null; }
    });
}
/* ======================== FORM SUBMIT ======================== */
async function handleFormSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;
    saveInProgress = true;

    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);

    // ═══════════════════════════════════════════════════════════════
    // Clear all previous errors first
    // ═══════════════════════════════════════════════════════════════
    const allErrorFields = [
        'fFirstName', 'fLastName', 'fFatherName', 'fMotherName',
        'fDateOfAdm', 'fBirthDate', 'fGender', 'fEmail',
        'fPersonalMobile', 'fParentMobile', 'fAdmIn'
    ];
    clearAllFieldErrors(allErrorFields);

    // Force date inputs to commit values
    const dateInput = document.getElementById('fDateOfAdm');
    const birthDateInput = document.getElementById('fBirthDate');
    if (dateInput) dateInput.blur();
    if (birthDateInput) birthDateInput.blur();

    const dateValue = dateInput?.value || "";
    const birthDateValue = birthDateInput?.value || "";

    let hasErrors = false;
    const firstErrorField = { id: null };

    // ═══════════════════════════════════════════════════════════════
    // ✅ Validate names (single-word enforced)
    // ═══════════════════════════════════════════════════════════════
    const nameChecks = [
        { id: 'fFirstName', label: 'First Name' },
        { id: 'fLastName',  label: 'Last Name'  },
        { id: 'fFatherName', label: 'Father Name' },
        { id: 'fMotherName', label: 'Mother Name' }
    ];
    nameChecks.forEach(({ id, label }) => {
        const el = document.getElementById(id);
        const result = validateSingleWordName(el?.value || '', label);
        if (!result.valid) {
            setFieldError(id, result.message);
            hasErrors = true;
            if (!firstErrorField.id) firstErrorField.id = id;
        }
    });

    // ═══════════════════════════════════════════════════════════════
    // ✅ Date validations
    // ═══════════════════════════════════════════════════════════════
    const dateValidation = validateAndFormatDate(dateValue, 'Date of Admission');
    if (!dateValidation.isValid) {
        setFieldError('fDateOfAdm', dateValidation.error);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fDateOfAdm';
    }
    const birthValidation = validateAndFormatDate(birthDateValue, 'Birth Date');
    if (!birthValidation.isValid) {
        setFieldError('fBirthDate', birthValidation.error);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fBirthDate';
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ Email format + uniqueness
    // ═══════════════════════════════════════════════════════════════
    const emailVal = document.getElementById('fEmail')?.value.trim() || "";
    const emailFormat = validateEmailFormat(emailVal);
    if (!emailFormat.valid) {
        setFieldError('fEmail', emailFormat.message);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fEmail';
    } else {
        const currentSrNo = isEdit ? (currentEditStudent?.['Sr. No'] ?? null) : null;
        if (isEmailDuplicate(emailVal, currentSrNo)) {
            setFieldError('fEmail', `This email "${emailVal}" is already registered. Please use a different one.`);
            hasErrors = true;
            if (!firstErrorField.id) firstErrorField.id = 'fEmail';
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ Mobile validations
    // ═══════════════════════════════════════════════════════════════
    const personalMob = document.getElementById('fPersonalMobile')?.value.trim() || "";
    if (!personalMob) {
        setFieldError('fPersonalMobile', 'Personal Mobile is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fPersonalMobile';
    } else if (!/^[6-9][0-9]{9}$/.test(personalMob)) {
        setFieldError('fPersonalMobile', 'Enter a valid 10-digit mobile starting with 6-9.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fPersonalMobile';
    }

    const parentMob = document.getElementById('fParentMobile')?.value.trim() || "";
    if (!parentMob) {
        setFieldError('fParentMobile', 'Parent Mobile is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fParentMobile';
    } else if (!/^[6-9][0-9]{9}$/.test(parentMob)) {
        setFieldError('fParentMobile', 'Enter a valid 10-digit mobile starting with 6-9.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fParentMobile';
    }

    // ═══════════════════════════════════════════════════════════════
    // ✅ Other required fields
    // ═══════════════════════════════════════════════════════════════
    const genderVal = document.getElementById('fGender')?.value || "";
    if (!genderVal) {
        setFieldError('fGender', 'Gender is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fGender';
    }

    const admInVal = document.getElementById('fAdmIn')?.value.trim() || "";
    if (!admInVal) {
        setFieldError('fAdmIn', 'Adm In is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fAdmIn';
    }

    // ═══════════════════════════════════════════════════════════════
    // Bail out if any error
    // ═══════════════════════════════════════════════════════════════
    if (hasErrors) {
        saveInProgress = false;
        showSpinner(saveBtn, false);
        showToast('❌ Please fix the highlighted errors before saving.', 'error');
        if (firstErrorField.id) {
            const el = document.getElementById(firstErrorField.id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => el.focus(), 300);
            }
        }
        return;
    }

    // ═══════════════════════════════════════════════════════════════
    // Build form data (Middle Name = Father Name)
    // ═══════════════════════════════════════════════════════════════
    const firstName = document.getElementById('fFirstName')?.value.trim() || "";
    const middleName = document.getElementById('fMiddleName')?.value.trim() || "";
    const lastName = document.getElementById('fLastName')?.value.trim() || "";
    const fullName = combineFullName(firstName, middleName, lastName);

    const formData = {
        "Academic Year": document.getElementById('fAcademicYear')?.value || "",
        "Date of Adm": dateValue,
        "First Name": firstName,
        "Middle Name": middleName,       // Auto = Father Name
        "Last Name": lastName,
        "Full Name": fullName,
        "Father Name": document.getElementById('fFatherName')?.value.trim() || "",
        "Mother Name": document.getElementById('fMotherName')?.value.trim() || "",
        "Father Occupation": document.getElementById('fFatherOccupation')?.value || "",
        "Mother Occupation": document.getElementById('fMotherOccupation')?.value || "",
        "Adm In": admInVal,
        "Birth Date": birthDateValue,
        "Gender": genderVal,
        "Email Id": emailVal,
        "Personal Mob No": personalMob,
        "Parent Mob No": parentMob,
        "Last School Name": document.getElementById('fLastSchool')?.value || "",
        "Last Session Marks (%)": document.getElementById('fMarks')?.value || "",
        "Weight": document.getElementById('fWeight')?.value || "",
        "Height": document.getElementById('fHeight')?.value || "",
        "Address": document.getElementById('fAddress')?.value || "",
        "Note": document.getElementById('fNote')?.value || ""
    };

    // ═══════════════════════════════════════════════════════════════
    // Build params
    // ═══════════════════════════════════════════════════════════════
    const params = new URLSearchParams();
    params.append("action", isEdit ? "update" : "insert");
    params.append("spreadsheetId", SPREADSHEET_ID);
    params.append("sheetName", SHEET_NAME);

    if (isEdit) {
        let finalRowIdx = null;
        if (rowIdx) finalRowIdx = rowIdx;
        else if (currentEditStudent && currentEditStudent._rowIndex) finalRowIdx = currentEditStudent._rowIndex;
        else if (currentViewStudent && currentViewStudent._rowIndex) finalRowIdx = currentViewStudent._rowIndex;
        else if (formData['Adm In']) {
            const found = allStudents.find(s => String(s['Adm In']) === String(formData['Adm In']));
            if (found && found._rowIndex) finalRowIdx = found._rowIndex;
        }
        if (!finalRowIdx) {
            showModal("❌ Error: Could not determine which row to update. Please refresh and try again.", "Error");
            saveInProgress = false;
            showSpinner(saveBtn, false);
            return;
        }
        params.append("rowIndex", finalRowIdx);
    }

    if (DRIVE_FOLDER_ID) params.append("driveFolderId", DRIVE_FOLDER_ID);

    for (const [key, value] of Object.entries(formData)) {
        if (key === "Full Name") {
            if (value && value.trim()) params.append(key, value);
        } else {
            params.append(key, value);
        }
    }

    if (croppedImageData && croppedImageData.base64Data) {
        params.append("fileCount", "1");
        params.append("fileData1", croppedImageData.base64Data);
        params.append("fileName1", croppedImageData.fileName);
        params.append("fileType1", croppedImageData.mimeType);
        params.append("fileColumn1", IMAGE_COLUMN_NAME);
    }

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString(),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        const result = await response.json();

        if (result.status === "success") {
            showModal(`${isEdit ? "✅ Student updated" : "✅ Student saved"} successfully!`, "Success", false, null, 2000);
            await new Promise(resolve => setTimeout(resolve, 500));
            dom.formModal?.classList.remove('active');

            invalidateStudentCache();
            await loadStudents(true);
            goToListView();
        } else {
            showModal("❌ Error: " + (result.message || "Unknown error"), "Error");
        }
    } catch (err) {
        console.error('Save error:', err);
        if (err.name === 'AbortError') {
            showModal("❌ Request timeout. Please check your internet connection and try again.", "Error");
        } else {
            showModal("❌ Error: " + err.message, "Error");
        }
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

/* ======================== MODAL OPEN ======================== */
async function openAddModal() {
    if (!dom.formModalBody) return;
    dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading form...</p></div>';
    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = "➕ Add New Admission";
    dom.formModalBody.innerHTML = buildFormHtml(null, false);
    setTimeout(() => attachFormEvents(false, null), 50);
}

async function openEditModal() {
    let studentToEdit = currentEditStudent || currentViewStudent;
    if (!studentToEdit) {
        showToast("❌ No student selected to edit", "error");
        return;
    }

    let rowIdx = studentToEdit._rowIndex;
    if (!rowIdx) {
        // 🔑 Prefer Sr. No lookup (consistent with delete)
        if (selectedSrNo) rowIdx = findRowIndexBySrNo(selectedSrNo);
    }
    if (!rowIdx) {
        const admIn = studentToEdit['Adm In'];
        if (admIn) rowIdx = findRowIndexByAdmIn(admIn);
    }
    if (!rowIdx) {
        const found = allStudents.find(s =>
            String(s['Adm In']) === String(studentToEdit['Adm In']) ||
            (s['First Name'] === studentToEdit['First Name'] && s['Last Name'] === studentToEdit['Last Name'])
        );
        if (found) rowIdx = found._rowIndex;
    }
    if (!rowIdx) {
        showModal("❌ Could not find the row for this student. Please refresh and try again.", "Error");
        return;
    }

    currentEditStudent = studentToEdit;
    dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading edit form...</p></div>';
    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = `✏️ Edit ${studentToEdit['First Name']} ${studentToEdit['Last Name']}`;
    dom.formModalBody.innerHTML = buildFormHtml(studentToEdit, true);
    setTimeout(() => attachFormEvents(true, rowIdx), 50);
}


/* ======================== MOBILE BUTTONS ======================== */
function setupMobileButtons() {
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');
    if (mobileRefreshBtn) {
        mobileRefreshBtn.addEventListener('click', () => {
            if (dom.refreshBtn) dom.refreshBtn.click();
            else refreshData();
        });
    }
    if (mobileAddBtn) {
        mobileAddBtn.addEventListener('click', () => {
            if (dom.addNewBtn) dom.addNewBtn.click();
            else openAddModal();
        });
    }
}


/* ======================== INIT ======================== */
function init() {
    if (initDone) {
        console.log('⏭️ init already ran, skipping');
        return;
    }
    initDone = true;

    console.log('🚀 init() started');
    cacheDomElements();
    console.log('✅ DOM cached. tableBody =', !!dom.tableBody);
    setupMobileButtons();

    dataLoaded = false;
    console.log('📥 Calling loadStudents()...');
    loadStudents().then(() => {
        console.log('✅ Initial loadStudents resolved');
    }).catch(err => {
        console.error('❌ Initial loadStudents failed:', err);
    });

    // [DEBOUNCE] Search
    dom.searchInput?.addEventListener('input', debounce((e) => {
        scheduleRender(e.target.value);
    }, 250));

    dom.refreshBtn?.addEventListener('click', refreshData);
    dom.addNewBtn?.addEventListener('click', openAddModal);
    dom.backBtn?.addEventListener('click', goToListView);
    dom.editBtn?.addEventListener('click', openEditModal);
    dom.deleteBtn?.addEventListener('click', deleteStudent);
    dom.printBtn?.addEventListener('click', printAdmissionForm);
    dom.downloadBtn?.addEventListener('click', downloadAdmissionPDF);

    // [DOM-STR] Single delegated listener for the table
    dom.tableBody?.addEventListener('click', handleTableClick);

    document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal.classList.remove('active'));
    document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
        if (cropper) { cropper.destroy(); cropper = null; }
    });

    window.onclick = (e) => {
        if (e.target.classList?.contains('modal-overlay')) {
            e.target.classList.remove('active');
            if (cropper) { cropper.destroy(); cropper = null; }
        }
    };

    // [IDLE] Background refresh every 5 min
    setInterval(() => {
        if ('requestIdleCallback' in window) {
            requestIdleCallback(() => refreshDataInBackground(), { timeout: 3000 });
        } else {
            refreshDataInBackground();
        }
    }, 5 * 60 * 1000);

    // [DEFER] Version check every 60s
    setInterval(() => {
        const check = () => {
            const cachedVersion = localStorage.getItem(CACHE_VERSION_KEY);
            if (cachedVersion !== CURRENT_CACHE_VERSION) {
                dataLoaded = false;
                loadStudents(true);
            }
        };
        if ('requestIdleCallback' in window) requestIdleCallback(check, { timeout: 2000 });
        else check();
    }, 60000);

    updateAdminBadge();
    console.log(`✅ Ujjwal Academy 8th STD Admission System Loaded | Sheet: ${SHEET_NAME} | TTL: ${CACHE_TTL / 60000}min`);
}


/* ======================== START APP ======================== */
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 1500));
} else {
    setTimeout(init, 1500);
}

// Fallback: if auth takes longer than expected
setTimeout(() => {
    if (!initDone) {
        console.log('⏰ Fallback init trigger');
        init();
    }
}, 4000);


/* ======================== WINDOW EXPORTS ======================== */
window.manualClearCache = function() {
    clearAllCaches();
    dataLoaded = false;
    showToast("🧹 Cache cleared! Refreshing...", "success");
    setTimeout(() => loadStudents(true), 300);
};
window.forceRefreshData = function() {
    dataLoaded = false;
    clearAllCaches();
    showToast("🔄 Forcing data refresh...", "info");
    setTimeout(() => loadStudents(true), 300);
};
window.autoFillAdmIn = autoFillAdmIn;
window.rotateLeft = rotateLeft;
window.rotateRight = rotateRight;
window.applyCrop = applyCrop;
window.handleRetry = handleRetry;
window.handleClearCache = handleClearCache;
window.updateAdminBadge = updateAdminBadge;
window.deleteStudent = deleteStudent;
window.findRowIndexBySrNo = findRowIndexBySrNo;
window.findRowIndexByAdmIn = findRowIndexByAdmIn;
window.invalidateStudentCache = invalidateStudentCache;
window.loadStudents = loadStudents;

console.log('✅ Ujjwal Academy 8th STD Admission System Loaded');
console.log(`📊 Current Sheet: ${SHEET_NAME}`);
console.log(`📦 Cache TTL: ${CACHE_TTL / 60000} minutes`);

</script>
