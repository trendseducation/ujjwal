<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>View PDF · Ujjwal Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-body: #f4f7fc;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1e293b;
            --text-muted: #5b6e8c;
            --text-light: #94a3b8;
            --border-light: #e2e8f0;
            --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.06);
            --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.12);
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --card-border: 1px solid rgba(0,0,0,0.04);
            --logo-filter: none;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg-body: #0a0f1c;
            --bg-card: #1e293b;
            --bg-header: #111827;
            --text-main: #f1f5f9;
            --text-muted: #9ca3af;
            --text-light: #64748b;
            --border-light: #1f2a3e;
            --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.6);
            --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.8);
            --accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.15);
            --card-border: 1px solid rgba(255,255,255,0.04);
            --logo-filter: brightness(0) invert(1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            transition: background var(--transition-normal), color var(--transition-normal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .app-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.2rem 1.8rem 2.5rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            background: var(--bg-header);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.8rem;
            transition: background var(--transition-normal);
        }

        .brand-area { display: flex; align-items: center; gap: 10px; }
        .brand-logo { height: 44px; width: auto; filter: var(--logo-filter); object-fit: contain; }
        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .right-actions { 
            display: flex; 
            align-items: center; 
            gap: 0.8rem;
        }

        .right-actions .btn {
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
        }

        .btn {
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            font-family: inherit;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* PDF Viewer Container */
        .pdf-container {
            background: var(--bg-card);
            border-radius: 32px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        .pdf-header {
            padding: 1.5rem 2.5rem;
            border-bottom: 2px solid var(--border-light);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pdf-header .pdf-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pdf-header .pdf-title i {
            font-size: 1.8rem;
            color: var(--accent);
        }

        .pdf-header .pdf-title h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .pdf-header .pdf-title .chapter-name {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 1rem;
        }

        .pdf-header .pdf-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .pdf-body {
            flex: 1;
            padding: 1.5rem 2.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        /* Loading State */
        .pdf-loading {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        .pdf-loading .spinner-large {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pdf-loading p {
            font-size: 1.1rem;
        }

        .pdf-loading .sub-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 0.5rem;
        }

        /* PDF Iframe */
        .pdf-iframe-wrapper {
            width: 100%;
            flex: 1;
            min-height: 70vh;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: var(--bg-body);
            position: relative;
        }

        .pdf-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            min-height: 70vh;
            border: none;
            background: var(--bg-body);
        }

        /* Error State */
        .pdf-error {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        .pdf-error i {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1rem;
            display: block;
        }

        .pdf-error h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .pdf-error p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
        }

        .pdf-error .btn {
            min-width: 150px;
            justify-content: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 820px) {
            .top-bar { 
                border-radius: 32px; 
                padding: 0.6rem 1.2rem; 
            }
            .brand-text { 
                font-size: 1.1rem; 
            }
            .brand-logo { 
                height: 32px; 
            }
            .app-wrapper { 
                padding: 0.8rem 1rem 2rem; 
            }
            
            .right-actions .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
                border-radius: 30px;
            }
            .right-actions .btn i {
                font-size: 0.8rem;
            }

            .pdf-header {
                padding: 1rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }

            .pdf-header .pdf-title h2 {
                font-size: 1.1rem;
            }

            .pdf-header .pdf-title .chapter-name {
                font-size: 0.85rem;
                display: block;
                margin-top: 2px;
            }

            .pdf-header .pdf-actions {
                width: 100%;
                justify-content: stretch;
            }

            .pdf-header .pdf-actions .btn {
                flex: 1;
                justify-content: center;
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }

            .pdf-body {
                padding: 1rem 1.5rem 1.5rem;
                min-height: 100vh;
            }

            .pdf-iframe-wrapper {
                min-height: 100vh;
            }

            .pdf-iframe-wrapper iframe {
                min-height: 100vh;
            }
        }

        @media (max-width: 600px) {
            .app-wrapper { 
                padding: 0.5rem 0.6rem 1.5rem; 
            }
            .top-bar { 
                padding: 0.4rem 0.8rem; 
                border-radius: 24px; 
                gap: 0.5rem;
            }
            .brand-text { 
                font-size: 0.85rem; 
            }
            .brand-logo { 
                height: 28px; 
            }
            
            .right-actions .btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.65rem;
                border-radius: 20px;
            }
            .right-actions .btn i {
                font-size: 0.7rem;
            }

            .pdf-header {
                padding: 0.8rem 1rem;
            }

            .pdf-header .pdf-title i {
                font-size: 1.4rem;
            }

            .pdf-header .pdf-title h2 {
                font-size: 0.95rem;
            }

            .pdf-header .pdf-title .chapter-name {
                font-size: 0.75rem;
            }

            .pdf-header .pdf-actions .btn {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
            }

            .pdf-body {
                padding: 0.8rem 0.8rem 1rem;
                min-height: 100vh;
            }

            .pdf-iframe-wrapper {
                min-height: 100vh;
                border-radius: 12px;
            }

            .pdf-iframe-wrapper iframe {
                min-height: 100vh;
            }

            .pdf-loading .spinner-large {
                width: 40px;
                height: 40px;
            }

            .pdf-loading p {
                font-size: 0.95rem;
            }

            .pdf-error i {
                font-size: 3rem;
            }

            .pdf-error h3 {
                font-size: 1.2rem;
            }

            .pdf-error p {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .pdf-header .pdf-actions {
                flex-direction: column;
            }

            .pdf-header .pdf-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="top-bar">
            <div class="brand-area">
                <img class="brand-logo" src="https://lh3.googleusercontent.com/d/1HUjvQXeYLxFtt5StZMinVh8sXRZ_TI0F" alt="Ujjwal Academy logo">
                <span class="brand-text">Ujjwal Academy</span>
            </div>
            <div class="right-actions">
               <!-- <a href="7th_Std_Eng.html" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back
                </a> -->
                <a href="../My Account/myaccount.html" class="btn btn-outline">
                    <i class="fas fa-user"></i> My Account
                </a>
            </div>
        </header>

        <div class="main-content">
            <div class="pdf-container">
                <!-- PDF Header -->
                <div class="pdf-header">
                    <div class="pdf-title">
                        <i class="fas fa-file-pdf"></i>
                        <div>
                            <h2 id="chapterTitle">Loading Chapter...</h2>
                            <span class="chapter-name" id="chapterSubtitle"></span>
                        </div>
                    </div>
                    <div class="pdf-actions">
                       <!-- <button class="btn btn-primary" id="downloadBtn" onclick="downloadPDF()">
                            <i class="fas fa-download"></i> Download
                        </button> -->
                        <button class="btn btn-outline" id="openNewTabBtn" onclick="openInNewTab()">
                            <i class="fas fa-external-link-alt"></i> Open Full Screen
                        </button>
                    </div>
                </div>

                <!-- PDF Body -->
                <div class="pdf-body">
                    <!-- Loading State -->
                    <div id="pdfLoading" class="pdf-loading">
                        <div class="spinner-large"></div>
                        <p>Loading PDF...</p>
                        <p class="sub-text">Please wait while we load your document</p>
                    </div>

                    <!-- Error State -->
                    <div id="pdfError" class="pdf-error" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Unable to Load PDF</h3>
                        <p id="errorMessage">The PDF link could not be loaded. Please try again.</p>
                        <a href="7th_Std_Eng.html" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </a>
                    </div>

                    <!-- PDF Iframe -->
                    <div id="pdfIframeWrapper" class="pdf-iframe-wrapper" style="display: none;">
                        <iframe id="pdfIframe" src="" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoDds81u8M5N8micA_hoIBgCS7aCFm0NUmwW6XLH4m_fRJ8R9pGqjgFGMeBxBd2dSL/exec";
        const SPREADSHEET_ID = "1ZCKJ_LYfk_kZ9afgtpOtAQ9-g7-3ZSsS_byQ3F_Rip0";
        const SHEET_NAME = "English";

        // ============================================================
        // THEME SYNC
        // ============================================================
        function getStoredTheme() {
            try {
                return localStorage.getItem('user-theme-preference') || 'light';
            } catch(e) {
                return 'light';
            }
        }

        function applyTheme(theme) {
            try {
                document.body.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('user-theme-preference', theme);
                
                const metaThemeColor = document.querySelector('meta[name="theme-color"]');
                if (metaThemeColor) {
                    metaThemeColor.content = theme === 'dark' ? '#0a0f1c' : '#f4f7fc';
                }
                
                console.log(`🎨 Theme applied: ${theme}`);
                
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'themeChange',
                            theme: theme,
                            source: 'viewpdf.html'
                        }, '*');
                    }
                } catch(e) {}
            } catch(e) {
                console.error('Error applying theme:', e);
            }
        }

        function syncThemeWithParent() {
            try {
                const localTheme = localStorage.getItem('user-theme-preference');
                if (localTheme) {
                    applyTheme(localTheme);
                    return;
                }
                try {
                    if (window.parent && window.parent.document.body) {
                        const parentTheme = window.parent.document.body.getAttribute('data-theme');
                        if (parentTheme) {
                            applyTheme(parentTheme);
                            return;
                        }
                    }
                } catch(e) {}
                
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    applyTheme('dark');
                } else {
                    applyTheme('light');
                }
            } catch(e) {
                console.error('Error syncing theme:', e);
                applyTheme('light');
            }
        }

        window.addEventListener('message', function(event) {
            try {
                if (event.data && event.data.type === 'themeChange') {
                    const newTheme = event.data.theme;
                    if (newTheme && (newTheme === 'light' || newTheme === 'dark')) {
                        console.log(`📩 Received theme change from parent: ${newTheme}`);
                        applyTheme(newTheme);
                    }
                }
            } catch(e) {}
        });

        window.addEventListener('storage', function(e) {
            if (e.key === 'user-theme-preference') {
                const newTheme = e.newValue;
                if (newTheme && (newTheme === 'light' || newTheme === 'dark')) {
                    console.log(`📦 Theme changed in another tab: ${newTheme}`);
                    applyTheme(newTheme);
                }
            }
        });

        if (window.matchMedia) {
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', function(e) {
                if (!localStorage.getItem('user-theme-preference')) {
                    const theme = e.matches ? 'dark' : 'light';
                    console.log(`🖥️ System theme changed: ${theme}`);
                    applyTheme(theme);
                }
            });
        }

        // ============================================================
        // DOM REFS
        // ============================================================
        const dom = {};

        function cacheDomElements() {
            dom.chapterTitle = document.getElementById('chapterTitle');
            dom.chapterSubtitle = document.getElementById('chapterSubtitle');
            dom.pdfLoading = document.getElementById('pdfLoading');
            dom.pdfError = document.getElementById('pdfError');
            dom.errorMessage = document.getElementById('errorMessage');
            dom.pdfIframeWrapper = document.getElementById('pdfIframeWrapper');
            dom.pdfIframe = document.getElementById('pdfIframe');
            dom.downloadBtn = document.getElementById('downloadBtn');
            dom.openNewTabBtn = document.getElementById('openNewTabBtn');
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                link: params.get('link') || '',
                chapter: params.get('chapter') || 'Chapter'
            };
        }

        function showToast(msg, type = 'info') {
            // Simple alert for now - can be enhanced with a proper toast
            console.log(`📢 ${type}: ${msg}`);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // PDF VIEWER FUNCTIONS
        // ============================================================
        let currentLink = '';
        let currentChapter = '';

        function loadPDF(link, chapter) {
            currentLink = link;
            currentChapter = chapter;

            // Update header
            dom.chapterTitle.textContent = chapter || 'Chapter';
            dom.chapterSubtitle.textContent = 'Read in PDF';

            // Validate link
            if (!link || link.trim() === '') {
                showError('No PDF link available for this chapter.');
                return;
            }

            // Check if link is a Google Drive link
            let finalUrl = link.trim();
            
            // If it's a Google Drive link, convert to direct embed URL
            if (finalUrl.includes('drive.google.com') || finalUrl.includes('docs.google.com')) {
                // Extract file ID from Google Drive link
                const fileIdMatch = finalUrl.match(/[-\w]{25,}/);
                if (fileIdMatch) {
                    const fileId = fileIdMatch[0];
                    // Use Google Drive embed URL
                    finalUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                    console.log(`📄 Converted Drive link to embed URL: ${finalUrl}`);
                } else {
                    // Try to use as-is
                    console.log(`📄 Using Drive link as-is: ${finalUrl}`);
                }
            } else if (finalUrl.includes('pdf')) {
                // Keep as is for direct PDF links
                console.log(`📄 Using direct PDF link: ${finalUrl}`);
            }

            // Show iframe
            dom.pdfLoading.style.display = 'none';
            dom.pdfError.style.display = 'none';
            dom.pdfIframeWrapper.style.display = 'block';

            // Set iframe src
            dom.pdfIframe.src = finalUrl;

            // Set download link
            dom.downloadBtn.onclick = function() {
                downloadPDF(finalUrl, chapter);
            };

            // Set open new tab link
            dom.openNewTabBtn.onclick = function() {
                openInNewTab(finalUrl, chapter);
            };

            console.log(`📄 PDF loaded for: ${chapter}`);
        }

        function showError(message) {
            dom.pdfLoading.style.display = 'none';
            dom.pdfError.style.display = 'block';
            dom.pdfIframeWrapper.style.display = 'none';
            dom.errorMessage.textContent = message || 'The PDF link could not be loaded. Please try again.';
            console.error(`❌ PDF Error: ${message}`);
        }

        function downloadPDF(link, chapter) {
            const url = link || currentLink;
            const name = chapter || currentChapter || 'document';
            
            if (!url) {
                showToast('No PDF link available to download.', 'error');
                return;
            }

            try {
                // Create a temporary anchor element
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name}.pdf`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast(`Downloading: ${name}`, 'success');
            } catch (err) {
                console.error('Download error:', err);
                showToast('Failed to download PDF. Please try opening in new tab.', 'error');
            }
        }

        function openInNewTab(link, chapter) {
            const url = link || currentLink;
            const name = chapter || currentChapter || 'document';
            
            if (!url) {
                showToast('No PDF link available to open.', 'error');
                return;
            }

            try {
                window.open(url, '_blank', 'noopener,noreferrer');
                showToast(`Opening: ${name}`, 'success');
            } catch (err) {
                console.error('Open new tab error:', err);
                showToast('Failed to open PDF in new tab.', 'error');
            }
        }

        // ============================================================
        // FETCH CHAPTER LINK FROM GOOGLE SHEET (Fallback)
        // ============================================================
        async function fetchChapterLinkFromSheet(chapterName) {
            try {
                const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
                const resp = await fetch(url);
                const data = await resp.json();
                
                if (data.status === 'success' && data.data) {
                    const chapter = data.data.find(row => {
                        const name = row['Chapter Name'] || '';
                        return name.toLowerCase().trim() === chapterName.toLowerCase().trim();
                    });
                    
                    if (chapter && chapter['Link']) {
                        return chapter['Link'];
                    }
                }
                return null;
            } catch (err) {
                console.error('Error fetching chapter link:', err);
                return null;
            }
        }

        // ============================================================
        // CHECK LOGIN STATUS (for security)
        // ============================================================
        function checkLoginStatus() {
            const savedUser = sessionStorage.getItem('ujjwal_user');
            const savedUserData = sessionStorage.getItem('ujjwal_user_data');
            const isAdmin = sessionStorage.getItem('ujjwal_admin_logged_in') === 'true';
            
            if ((savedUser && savedUserData) || isAdmin) {
                console.log('✅ User authenticated (Student or Admin)');
                return true;
            }
            
            console.log('❌ No user or admin logged in');
            return false;
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Escape to go back
            if (e.key === 'Escape') {
                window.location.href = '7th_Std_Eng.html';
            }
            
            // F for fullscreen
            if (e.key === 'f' || e.key === 'F') {
                if (dom.pdfIframeWrapper) {
                    if (dom.pdfIframeWrapper.requestFullscreen) {
                        dom.pdfIframeWrapper.requestFullscreen();
                    }
                }
            }
        });

        // ============================================================
        // INITIALIZE PAGE
        // ============================================================
        async function init() {
            cacheDomElements();

            // Initialize theme
            syncThemeWithParent();
            console.log('🎨 Theme initialized:', document.body.getAttribute('data-theme'));

            // Check login status
            const isLoggedIn = checkLoginStatus();
            if (!isLoggedIn) {
                // Redirect to login if not authenticated
                window.location.href = '../My Account/myaccount.html';
                return;
            }

            // Get URL parameters
            const params = getUrlParams();
            let link = params.link;
            const chapter = params.chapter;

            console.log(`📄 Opening: ${chapter}`);
            console.log(`🔗 Link: ${link}`);

            // If no link provided, try to fetch from sheet
            if (!link || link.trim() === '') {
                console.log('🔍 No link in URL, fetching from sheet...');
                const fetchedLink = await fetchChapterLinkFromSheet(chapter);
                if (fetchedLink) {
                    link = fetchedLink;
                    console.log(`✅ Found link in sheet: ${link}`);
                }
            }

            // Load PDF
            if (link && link.trim() !== '') {
                loadPDF(link, chapter);
            } else {
                showError('No PDF link found for this chapter. Please contact support.');
            }
        }

        // ============================================================
        // START APP
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
